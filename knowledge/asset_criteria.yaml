# קריטריוני הסינון של הספריה.
#
# **שני אוצרות מילים נפרדים, ואסור שיתערבבו.**
#
#   א. מה שהגוף הוא — סוג התקנה, סגנון, חומר, אופי אור, גוון.
#      נכון לגוף לתמיד, בכל פרויקט.
#
#   ב. איפה הגוף שימש בפרויקט מסוים — קומה, אזור, וקטגוריית
#      התאורה מה-PSD (מערכת / שקועים / ארונות / הארת צמחייה).
#      נכון לפרויקט אחד בלבד.
#
# **הספריה מסוננת אך ורק לפי א'.** קבוצה ב' היא מידע על תוכנית
# שכבר הופקה, לא על הגוף, ואין לה רשות להסתיר תמונות.
#
# הכשל שהוביל לכלל הזה: הפאנל נפתח "מסונן לפי שקועים מהשרטוט",
# ו"שקועים" היא קטגוריית PSD — קבוצה ב'. כלומר הספריה סוננה לפי
# איפה שגופים שימשו בפרויקטים קודמים. התיקון אינו לבטל את הסינון
# מהשרטוט אלא לתרגם אותו: השרטוט אומר SH, וזה אומר שהגוף הוא
# "שקוע בתקרה" — סוג התקנה, קבוצה א'.
#
# הקובץ הזה הוא אוצר המילים שנבחר. `asset_facets.yaml` הוא מה
# שנצפה בקבצי ה-PSD, והוא משמש רק לגזירה — לא לסינון.

criteria:

  install:
    label: "סוג התקנה"
    # בחירה מרובה מאז D-048: שקופית שדולקים בה שקועים ופסים מסומנת
    # בשני הסוגים, ומוצגים תצלומים של שניהם (איחוד, לא חיתוך).
    multi: true
    # **רך:** תצלום שמתויג כסוג אחר מוסתר, ותצלום שעוד לא תויג לסוג
    # התקנה מוצג מתחת לקו (D-048). 216 מתוך 417 עוד לא תויגו (18.10),
    # וסינון קשיח היה מסתיר חצי מהבנק — הסיבה שבגללה השרטוט הפסיק
    # לסנן ב-D-034.
    soft: true
    values: ["שקוע בתקרה", "מסילה שקועה", "מסילה צמודה", "מסילה תלויה",
             "גוף תלוי", "צמוד קיר", "צמוד תקרה", "מנורת רצפה / שולחן",
             "שקוע רצפה מואר כלפי מעלה", "פס לד לנגרות / ארונות",
             "פס לינארי"]
    # "פס לינארי" נוסף ב-18.10 לבקשת גיא: לפס לינארי מהשרטוט (LWPOLYLINE,
    # D-024) לא היה סוג התקנה. הסטודיו יתייג אליו תצלומים כשיתווספו.
    # שלוש המסילות הן הפיצול האמיתי שהרשימה מוסיפה על ה-PSD,
    # שמתעד את שלושתן כ"מערכת" אחת.

  style:
    label: "סגנון"
    multi: true
    values: [מינימליסטי, מודרני, תעשייתי, מינרלי, אורגני, כפרי]
    # מדידה על ~390 גופים: 217 מינימליסטי, 179 מודרני, 77 אורגני,
    # 37 מינרלי, 2 תעשייתי. כמעט הכל נופל לשניים הראשונים — זו
    # החתימה של הסטודיו ולא טקסונומיה. הציר נבנה לבקשת גיא;
    # כלל השבב יסתיר אותו מעצמו אם אכן אינו מפצל.

  finish:
    label: "חומרים וגימור"
    multi: true
    values: ["זכוכית שקופה", "זכוכית חלבית", "עץ", "פליז מוברש",
             "זהב מוברש", "בטון", "אבן / שיש", "נייר / בד",
             "שחור מאט", "לבן", "אלומיניום"]
    # רלוונטי בעיקר לגופים דקורטיביים. לשקוע טכני הגימור הוא
    # "לבן או שחור" וזהו.
    #
    # "אבן / שיש" ו"נייר / בד" נוספו אחרי מעבר בעין על 414 התצלומים
    # (04.09.2026). בסיסי שיש ואהילי נייר אורז חזרו שוב ושוב, ובלי
    # הערכים האלה הם נשארו בלי גימור — "בטון" אינו שיש, ולנייר לא
    # היה שום ערך קרוב. השארתי ריק במקום למלא ערך שגוי, וזה הפער
    # שנוצר מכך.

  beam:
    label: "אופי התאורה"
    multi: false
    values: ["אור ישיר", "אור עקיף / מוחזר", "ספוט צר",
             "הצפה רחבה", "זווית מתכווננת"]

  cct:
    label: "גוון אור"
    multi: false
    values: ["2700K — לבן חם", "3000K — לבן נעים", "4000K — לבן ניטרלי",
             "Warm Dim — עמעום חם"]
    # אזהרה לתייג: גוון בתצלום עבר עיבוד ואינו עדות אמינה לגוון
    # הגוף בפועל. תיוג מהתמונה הוא ניחוש מושכל בלבד.

  room:
    label: "חלל"
    multi: true
    # **מוצג ולעולם לא מסנן.**
    #
    # החלל שבו הגוף שימש בפרויקט קודם הוא מידע מועיל — הוא מוצג
    # על התמונה ומזין את כותרת השקופית — אבל אסור לו להסתיר
    # תמונות. ספוט שקוע ששימש בחדר שינה הוא בדיוק הגוף שמחפשים
    # לסלון; העובדה ששימש פעם בחדר שינה אינה פוסלת אותו.
    filter: false
    supersedes: space
    values: [סלון, מטבח, "פינת אוכל", "חדר שינה הורים", "חדר שינה",
             "חדר רחצה", שירותים, מסדרון, כניסה, "חדר עבודה",
             מרפסת, "חוץ / גינה", "חדר מדרגות", מסחרי]
    # החלל מתאר ואינו מגביל. לעולם אינו מסונן מראש — רק בלחיצה
    # מפורשת, והשבב תמיד ניתן להסרה. שקוע שצולם בחדר שינה חייב
    # להישאר נגיש כשמחפשים למסדרון.

# מקור הרשומה ורמת אמינות הוסרו לבקשת גיא (01.09.2026).
# הספריה נזרעת ממצגות המשרד, לכן כל מה שבה ברמת אמינות גבוהה
# והמשרד יודע מאיפה להשיג את הגופים. שני צירים שכל ערכיהם זהים
# אינם מוסיפים דבר. עם הסרתם ירדה גם אזהרת הייצוא על תמונת
# השראה — היא נשענה על שדה שכבר אינו קיים.

# ─────────────────────────────────────────────────────────────────
# גזירה מראיה: קטגוריית ה-PSD -> סוג התקנה.
#
# רק מיפויים חד-משמעיים. "מערכת" ו"ספוטים" מכוונים במכוון החוצה —
# "מערכת" היא בדיוק שלוש המסילות שאי אפשר להכריע ביניהן מהשם,
# ו"ספוטים" יכולים להיות שקועים או על מסילה. הם נשארים ריקים
# וממתינים לעין אדם. ערך שגוי שממתין לאישור מקבל אישור.

