# צירי הניווט במאגר התצלומים.
#
# הטקסונומיה של המשרד אינה עץ. "שקועים" הוא סוג התקנה, "אי מטבח" הוא
# מיקום, "אווירה" היא כוונה תכנונית ו"נגרות" הוא סוג אלמנט. הן מעורבבות
# בכוונה, כי ככה מתכנן תאורה חושב. לכן אין כאן היררכיה — כל תגית עומדת
# בפני עצמה, והניווט הוא חיתוך של תגיות ולא מסלול בעץ.
#
# הקיבוץ לצירים כאן הוא לתצוגה בלבד: הוא קובע תחת איזו כותרת מוצג
# השבב בממשק. הוא אינו מגביל שילובים.
#
# התגיות חולצו משמות הקבוצות ב-5 קבצי PSD (עמודת context ב-assets.csv,
# מלאה ב-57 מתוך 58 נכסים).

facets:

  # סוג התאורה — הטקסונומיה של המשרד. השרטוט כבר יודע את זה ברוב
  # המקרים, ולכן זה ציר שמסנן מראש ולא שאלה שנשאלת.
  lighting:
    label: "סוג תאורה"
    tags: [שקועים, ספוטים, מערכת, נגרות, תחתית נגרות, ארונות, קירי,
           אפלייט, טכנית, אווירה, ניתוקים, ניתוק, עמידה, עץ, עצים,
           הארת צמחייה, מאחז יד, פרופילים, שולחני, שקועי כניסה,
           "שקועים חלל כפול", "תלוי פינת אוכל", "אי מטבח", "עמידה סלון"]

  # החלל. זה מה שהשרטוט לא יודע — אין שמות חדרים ב-DXF.
  space:
    label: "חלל"
    tags: [סלון, מטבח, "שולחן אוכל", ספריה, "חדר ילדים", ילדים,
           "חדרי שינה", מאסטר, "חדר רחצה", רחצה, שירותים,
           "שירותי אורחים", "חלל ראשי", כניסה, פרגולה, "פיתוח שטח",
           ציבורי, משותפים]

  # הקומה. שימושי כשמחפשים "מה עשינו בקומה הזו", פחות לבחירת גוף.
  level:
    label: "קומה"
    tags: [קרקע, ראשונה, עליונה, מרתף, מגורים, "חלל עליון",
           "חלל תחתון", "חלל נמוך"]

# תגיות מבניות של קובץ ה-PSD, לא תוכן. מסוננות ולא מוצגות כשבבים.
noise: [תוכנית, "תוכנית גדולה", "תוכנית קטנה", "תכנית גדולה לסימוןנים",
        סימון, קומפוננטים, סטרקטורל, "רק מערכת", "לייואט שחור",
        "קו עליון", הכל, תאורה, Background,
        א, ב, ג, C2, סי2, "דירה 1", "דירה 2"]

# ציר רביעי שאינו מגיע מ-context אלא מהשרטוט עצמו.
#
# גופים טכניים נושאים קוד סוג (SH, SP, WA, TA), גופים דקורטיביים
# נושאים שם מוצר (TACCIA, NULLA, OZONE, VV Cinquanta). כלומר השרטוט
# כבר עונה על "האם הגוף אמור להיראות או להיעלם" — זו לא שאלה שצריך
# לשאול, זו הבחנה שצריך לקרוא.
#
# הכלל: קוד שמופיע ב-taxonomy.yaml תחת dxf_blocks הוא טכני.
# כל שם אחר הוא דקורטיבי.
intent:
  label: "נראה או נעלם"
  technical: "נעלם — גוף טכני"
  decorative: "נראה — גוף דקורטיבי"

# ציר חמישי, חינם מהנתונים: כמה פרויקטים השתמשו בתצלום.
reuse:
  label: "כבר בשימוש"
  threshold: 2      # נכס ב-2 פרויקטים ומעלה נחשב מוכר

# כלל הצגת שבב.
#
# "כמעט הכל מינימליסטי או מודרני" — שאלה שהתשובה שלה כמעט קבועה
# מרגישה מועילה ומבזבזת צעד. לכן שבב מוצג רק אם הוא באמת מפצל את
# התוצאות שעל המסך כרגע: לפחות שני ערכים שונים, ואף ערך לא מכסה
# כמעט הכל. הכלל מחושב על הסט הנוכחי, ולכן שבב מופיע ונעלם
# תוך כדי צמצום.
chip_rule:
  min_values: 2
  max_dominance: 0.85
  min_results_to_offer: 4    # מתחת לזה פשוט מציגים הכל בלי שבבים

# ─────────────────────────────────────────────────────────────────
# שכבות המבנה הקבוע של ה-PSD — אינן תצלומים ואינן נכנסות לספריה.
#
# המבנה תועד ב-CLAUDE.md ונמצא זהה בכל 5 הקבצים. בלעדי הרשימה הזו
# השאיבה גוררת פנימה את הרקע השחור, את שכבת ההארה ואת פאנל התוכנית
# ומציגה אותם כתצלומי גופים.
#
# **הפסילה היא לפי שם ולפי כהות, ולא לפי רוויה.** צילום מוצר על רקע
# לבן חסר רוויה כמעט לגמרי — one product photo נמדד
# ב-sat=0.01 — והוא תצלום לגיטימי לחלוטין. מבחן רוויה היה מוחק
# בדיוק את צילומי היצרן שהכי שווים.

psd_structural_layers:
  exact: [Background, "קו עליון", "לייואט שחור", "הכל", "תאורה"]
  prefix: ["תוכנית", "תכנית", "קרקע הכל", "קרקע תאורה", "מסכה", "Layer Mask",
           "Black & White", "Exposure", "Curves", "Levels", "Hue/Sat"]
  contains: ["הכל", " תאורה"]

# שכבה שרובה שחורה היא הארה או רקע, לא תצלום.
psd_reject:
  max_dark_fraction: 0.75
