# זיהוי שכבות התאורה של הסטודיו ב-DXF.
# מקור: מדידה על 4 קבצי DXF אמיתיים  (2026-08-31)
#
# לסטודיו תבנית DWG קבועה. כל 4 הקבצים חולקים את אותן שכבות באותו סדר,
# כולל אותה שגיאת כתיב ("light connectios"). לכן הזיהוי דטרמיניסטי
# ואינו זקוק ליוריסטיקה של מילות מפתח.

# שכבות האדריכל מגיעות מ-XREF ותמיד מכילות "|"
# למשל: XREF1|A-WALL , Amiga-WP_100_Plans|sh-elec , 200-REVERSED CEILING PLAN|E-630
xref_separator: "|"

# ─── שכבות שמכילות גופי תאורה ───────────────────────────────────────
# רשימת היתר מפורשת. אסור להשתמש בהתאמת קידומת "light*" —
# ראה fixture_layers_excluded למטה.
# חמש השכבות שהמשרד מוסיף, לפי גיא (31.08.2026).
fixture_layers:
  - "light up"        # תקרה: שקועים, ספוטים, תלויים. השכבה הראשית.
  - "light wall"      # קיר
  - "light ceiling"   # תקרה. לא קיימת באף אחד מ-4 הקבצים שנבדקו,
                      # אבל גיא מסר שהיא משמשת בפרויקטים אחרים.
                      # שכבה שאינה בקובץ פשוט לא תוצג, ולכן הוספתה
                      # אינה עולה דבר והשמטתה תשבור פרויקט בשקט.
  - "light floor"     # רצפה
  - "light kir"       # קיר. נשארת נפרדת מ-light wall לפי החלטת גיא —
                      # אף שהמשמעות זהה, הן נושאות בלוקים שונים
                      # באותו קובץ (ב-111: kir=TA, wall=FOIL).
  - "Strip"           # פסי לד / פרופילים לינאריים.
                      # ריקה בכל 4 הקבצים שנבדקו — 0 ישויות.

# ─── שכבות "light*" שאינן מכילות גופים ──────────────────────────────
# אלה השכבות הגדולות ביותר בקובץ (480-751 ישויות).
# כלל נאיבי "layer.startswith('light')" ייקח 751 תוויות טקסט
# ויקרא להן גופי תאורה.
fixture_layers_excluded:
  - "light text"        # הערות וקודי גופים
  - "light dim"         # מידות
  - "light connectios"  # קווי חיבור (השגיאה במקור)
  - "Strip Text"        # תוויות של פסי לד
  - "FR Plan View"
  - "Defpoints"

# ─── בלוקים שאינם גופי תאורה ────────────────────────────────────────
# ראשי חצים של מידות. אלה הבלוקים הנפוצים ביותר בקבצים
# (_Oblique מופיע 1,398 פעם) והם מרעילים כל יוריסטיקה
# מסוג "הרבה סמלים קטנים חוזרים".
block_exclude_exact: ["_ArchTick", "_Oblique", "_OBLIQUE", "_DOT", "_CLOSED"]
block_exclude_prefix: ["_", "*"]

# ─── מסגור ──────────────────────────────────────────────────────────
extents:
  method: robust_percentile
  low: 0.02
  high: 0.98
  note: |
    $EXTMIN/$EXTMAX משקרים עד פי 128, ובשני הכיוונים.
    ב-1.dxf הכותרת מצהירה על 2,489,696 יחידות רוחב בעוד התוכן
    האמיתי הוא 19,376. ב-3.dxf הכותרת דווקא קטנה מהפריסה הגולמית.
    גם הגופים עצמם מכילים חריגים, לא רק הגיאומטריה.

units:
  insunits: 5      # סנטימטרים, בכל 4 הקבצים
