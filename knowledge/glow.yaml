# פרמטרי אפקט ההארה — מחולצים מ-229 אפקטי Outer Glow ב-5 קבצי PSD של הסטודיו.
# מקור: psd_glow_params.py + psd_glow_by_type.py  (2026-08-31; הסקריפטים בארכיון: _ארכיון/2026-10-25/סקריפטים/)
#
# ההארה אינה מכחול מטושטש. היא אפקט שכבה "Outer Glow" של פוטושופ,
# מוחל על צורה אטומה קטנה שמסמנת את מיקום הגוף.
#
# ממצא מרכזי: הפרמטרים קבועים ברמת הפרויקט, לא ברמת סוג הגוף.
# פריסט אחד מכסה ~85% מהגופים — שקועים, עמידה, קריאה, תלוי, אפלייט,
# ארונות, ספריה, טכנית, מראה, צידי מיטה — כולם מקבלים אותו ערך.

algorithm: photoshop_outer_glow
# alpha של הצורה -> הרחבה לפי Spread -> טשטוש גאוסיאני -> כפל באטימות -> Screen
#
# הערה על שמות שדות: בפורמט ה-PSD הסליידר "Spread" של Outer Glow נשמר
# בשדה Ckmt, ש-psd-tools חושף בשם choke. השדה שהוא קורא לו spread אינו
# בשימוש והוא 0 בכל 229 המופעים. הערך "choke" כאן הוא Spread של הממשק.

# ─── כיול המנוע ─────────────────────────────────────────────────────
# מכויל מול הפרופיל הרדיאלי שנמדד במוקד מבודד ב-RISH_s011 (מצגת ייחוס א:
# opacity 35, size 30, spread 25). התאמה: RMS 1.9 על r=4..30, סטייה
# מרבית 3 רמות. הכלי: src/calibrate_glow.py, נעול ב-tests/test_glow.py.
calibration:
  size_to_sigma: 0.39      # sigma של הגאוסיאן = (size - הרחבה) * הערך הזה
  marker_radius_px: 1.2    # רדיוס סמן הגוף לפני ההארה
  stack: 2                 # שכבת ההארה משוכפלת. ב-Screen זה מגביר את
                           # הזנב בלי להרוות את המרכז. מתועד ב-PSD:
                           # "Layer 17" + "Layer 17 copy" וכיוצא בזה.
  fitted_against: deck_a
  caveat: |
    הכיול נעשה מול פריסט מצגת ייחוס א בלבד. הפריסטים האחרים משתמשים באותו
    מנוע עם הפרמטרים שלהם, אבל לא אומתו מול פרופיל מדוד משלהם.

defaults:
  blend: screen        # 4 מתוך 5 קבצים. מצגת ייחוס ה חורג ל-normal/linear-light.
  spread: 0            # 0 בכל 229 האפקטים ללא יוצא מן הכלל
  noise: 0             # 0 בכל 229 האפקטים

# ─── פריסטים ברמת פרויקט ────────────────────────────────────────────
# הצבע הוא צבע ה-Outer Glow עצמו, לא צבע השיא בתמונה המוגמרת
# (השיא בתמונה הוא הצורה והזוהר ממוזגים יחד).
projects:
  deck_a:
    label: "מצגת ייחוס א"
    color: "#F6F7AA"       # 246.10, 247.00, 170.48
    opacity: 35
    size: 30
    choke: 25
  deck_b:
    label: "מצגת ייחוס ב"
    color: "#EDF1A7"       # 237.66, 241.00, 167.28
    opacity: 50
    size: 20
    choke: 5
  deck_c:
    label: "מצגת ייחוס ג"
    color: "#EFF4A4"       # 239.02, 243.72, 163.79
    opacity: 30
    size: 15
    choke: 30
  deck_d:
    label: "מצגת ייחוס ד"
    color: "#EFF4A4"
    opacity: 50
    size: 15
    choke: 10
  deck_e:
    label: "מצגת ייחוס ה"
    color: "#F9F2D1"       # 249.00, 241.93, 208.96
    blend: linear_light    # חורג — לא screen
    opacity: 31
    size: 50
    choke: 39

default_project: deck_a   # המצגת החדשה ביותר

# ─── חריגים שיטתיים ─────────────────────────────────────────────────
# שלוש משפחות חורגות מהפריסט הפרויקטלי בעקביות, בכל הקבצים.
overrides:
  - name: outdoor_planting
    matches: ["הארת צמחייה", "עץ", "עצים", "גינה"]
    note: "תאורת חוץ וצמחייה — הילה גדולה ורכה בהרבה"
    size: 150            # מצגת ייחוס א. במצגת ייחוס ב המקבילה היא 40-50 עם choke 15
    opacity: 35
    choke: 10

  - name: grazing_linear
    matches: ["מאחז יד", "פרגולה", "פרופיל", "מערכת"]
    note: "אור מלטף מפרופיל לינארי — רחב, נמוך עוצמה"
    size: 50
    opacity: 30
    choke: 15

  - name: section_view
    matches: ["חתך"]
    note: "שקופיות חתך מצוירות בקנה מידה אחר, ולכן ההילה גדולה יותר"
    size: 110            # מצגת ייחוס ב. במצגות 3-4 החתך דווקא קטן יותר מהפריסט
    opacity: 50
    choke: 5

# ─── לא ידוע ────────────────────────────────────────────────────────
unknowns:
  - "מי בוחר את הפריסט הפרויקטלי ולפי מה — הסטודיו טרם נשאל."
  - "האם החריג של מצגת ייחוס ה (linear_light) מכוון או תאונה."
  - "צבע חריג #F0D34A (ענבר) הופיע פעמיים בלבד — הקשר לא ידוע."

# ─── בחירה לכל שקופית · D-051 ───────────────────────────────────────
# הסטודיו: "שתהיה אופציה לשלוט בצבע ובגודל הזוהר של גופי תאורה דולקים",
# וגם בכמה הוא בהיר — לכל שקופית, עם הצעה להחיל על כל האזור.
# **רק מה שנמדד, ודרגות קבועות** (אפשרות א, גיא 18.10): צבע חופשי
# וסליידר מאפשרים מצגת שלא נראית כמו של המשרד. בלי בחירה = הפריסט של
# הסגנון, כמו קודם. הגודל כופל את `size`; העוצמה כופלת את `opacity`
# (Screen, שחור) או את `gain` (רגיל, אפור).
per_slide:
  colors:
    - {name: "מצגת ייחוס א", color: "#F6F7AA"}
    - {name: "מצגת ייחוס ב", color: "#EDF1A7"}
    - {name: "ייחוס ד", color: "#EFF4A4"}
    - {name: "מצגת ייחוס ה", color: "#F9F2D1"}
    - {name: "מצגת ייחוס ו", color: "#FCF5D4"}
  sizes:
    small:  {he: "קטן",       factor: 0.6}
    normal: {he: "רגיל",      factor: 1.0}
    large:  {he: "גדול",      factor: 1.5}
    xlarge: {he: "גדול מאוד", factor: 2.2}
  power:
    soft:   {he: "חלש",  factor: 0.6}
    normal: {he: "רגיל", factor: 1.0}
    strong: {he: "חזק",  factor: 1.6}
