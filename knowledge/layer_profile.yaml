# פרופיל שכבות — מה מוצג בתוכנית ומה מוסתר.
#
# זו ההחלטה שהוגדרה בתוכנית כ"עיקר העבודה", ולכן היא יושבת כאן
# ולא בקוד. אפשר לערוך אותה בלי לגעת בפייתון.
#
# היעד: the reference render of deck B — קווי שיער בהירים, קירות, ריהוט,
# מדרגות וכלים סניטריים. בלי מידות, בלי הערות, בלי תגים.
#
# שמות השכבות בקבצים האדריכליים עוקבים אחרי מוסכמת AIA/NCS:
#   A=אדריכלות  S=קונסטרוקציה  I=פנים  P=אינסטלציה  E=חשמל
#   G=כללי/הערות  C=אתר  Q=ציוד
# ולכן הכללים הם לפי תבנית ולא רשימה שמית, וכך הם עובדים גם על
# פרויקט חדש שלא נראה קודם.

default:
  # ברירת מחדל כשאין התאמה לאף כלל
  fallback: hide

  show:
    - "A-WALL*"        # קירות
    - "A-DOOR*"        # דלתות
    - "A-GLAZ*"        # חלונות וקירות מסך
    - "A-FLOR"         # רצפה
    - "A-FLOR-HRAL*"   # מעקות
    - "A-ROOF*"        # גג ופרגולות
    - "I-FURN*"        # ריהוט — מופיע בייחוס
    - "S-COLS*"        # עמודים
    - "S-STRS*"        # מדרגות
    - "P-SANR*"        # כלים סניטריים — מופיעים בייחוס
    - "Q-CASE*"        # נגרות
    - "A-DETL-HDLN*"

  hide:
    - "*ANNO*"         # כל ההערות והמידות
    - "*DIMS*"
    - "*TEXT*"
    - "*-IDEN*"        # תגי דלתות וחלונות
    - "C-PROP-LINE"    # קו מגרש — 72 אלף פרימיטיבים של קו מקווקו
    - "A-FLOR-OVHD*"   # קווי תקרה — 124 אלף פרימיטיבים, מציף את התוכנית
    - "*PEOPLE*"
    - "G-IMPT"
    - "Defpoints"
    - "Layer0"
    - "A-DETL"         # פרטים — צפוף מדי לקנה המידה של השקופית
    - "A-GENM"         # מודלים גנריים מ-Revit
    - "A-DETL-GENF"
    - "Q-SPCQ"

  # שכבות התאורה מטופלות בנפרד: הן מקבלות הארה, לא קו.
  lighting:
    - "light *"
    - "Strip"

# החלטות שטרם אומתו מול הסטודיו
unknowns:
  - "A-WALL-PATT (הצללת קירות) מוצגת דרך A-WALL* — לבדוק אם רצוי."
  - "האם להציג ריהוט תמיד, או רק בחללים ציבוריים."
