# גיאומטריית השקופית — נמדדה מ-5 מצגות (295 שקופיות) ומקבצי ה-PSD.
# מקור: ניתוח PPTX + psd_map.py  (2026-08-31; הסקריפט בארכיון: _ארכיון/2026-10-25/סקריפטים/)

canvas:
  width_px: 2000          # כל 228 התמונות המרוכבות, וגם קנבס ה-PSD
  height_px: 1125
  slide_emu: [12192000, 6858000]     # 13.333 x 7.5 inch, 16:9
  background: "#000000"   # schemeClr tx1, מוגדר מפורשות בכל שקופית

# קו הכותרת הלבן — שכבת "קו עליון" ב-PSD
header_rule:
  x: 80
  y: 91
  width: 1841
  height: 6
  color: "#E0E0E0"

# ─── סגנון המצגת · D-050 ─────────────────────────────────────────
# כל מה שלמעלה ולמטה הוא הסגנון השחור, שנמדד ב-5 המצגות השחורות.
# סגנון אחר **דורס רק את מה שהוא משנה** (`slide.load_layout(style)`
# ממזג אותו מעל הבסיס). הבחירה היא של המצגת כולה, בהגדרות המצגת.
deck_styles:
  grey:
    label: "אפור"
    # נמדד ב-deck F (מצגות/מצגות - אפור),
    # 65 שקופיות, 19.10.2026. הרקע ב-slideMaster: srgbClr E1E1E1.
    canvas:
      background: "#E1E1E1"
    # הכותרת: x=84 (4.2%), top=92 (8.2%), אפורה — bg1 lumMod 50%.
    # 12pt בשורה הראשונה. במצגת ייחוס ו אין פס; גיא בחר שיהיה, באפור של
    # הכותרת, דק, ומתחתיה (אפשרות א, 19.10).
    header_rule:
      y: 137
      height: 2
      color: "#7F7F7F"
    title:
      color: "#7F7F7F"
      size_pt: 12
    # התצלומים במצגת ייחוס ו: y=208..976 ב-24 שקופיות, קצה ימני 1930 (96.5%).
    plan_panel:
      y: 208
      height: 768
    photo_area:
      y: 208
      height: 768
    photos_only:
      y: 208
      height: 768
    # ריבוע אפור מאחורי תצלום **מוצר** בלבד (גוף שצולם על רקע לבן).
    # צילום אווירה מקבל אותו בלי ריבוע. גיא, 19.10.
    photo_card:
      color: "#CCCCCC"
    plan_appearance:
      background: "#E1E1E1"
      # הקירות והקווים במצגת ייחוס ו: (90,90,90) — הצבע הכהה הנפוץ ביותר
      architecture_line: "#5A5A5A"
      wall_fill: "#5A5A5A"
      # ריהוט במילוי לבן. רק צורות סגורות בשכבות האלה; ריהוט שצויר
      # בקווים בודדים נשאר קו. שמות השכבות נמדדו ב-111 (2).dxf:
      # I-FURN = 5,127 צורות סגורות, P-SANR-FIXT = 175, Q-CASE.
      furniture_fill: "#FFFFFF"
      furniture_layers: ["I-FURN", "P-SANR-FIXT", "Q-CASE"]
    # ההארה: **מיזוג רגיל, לא Screen** — אי אפשר להבהיר רקע בהיר
    # ב-Screen כמעט בכלל. כויל מול גוף מבודד במצגת ייחוס ו שקופית 2
    # (751,889): RMS 0.37 רמות על r=4..74. החישוב בממשיים, כי ב-8
    # ביט זנב של 1-15 רמות נשבר למדרגות (scratchpad: fit_grey_glow2).
    #   alpha = min(1, gain * blur(mask, sigma));  פעמיים (stack 2)
    glow:
      blend: normal
      color: "#FCF5D4"         # (252, 245, 212)
      size: 72                 # sigma 28 = 72 x 0.39
      gain: 46.8
      stack: 2
      marker_radius_px: 2.0
      marker_color: "#DDC657"  # (221, 198, 87) — הנקודה הזהובה
      # השיא שנמדד (0.598). פס לינארי לא יעבור אותו, גם כשהוא מצטבר
      # לאורכו. "חזק" (D-051) מגדיל את `gain`, לא את התקרה.
      max_alpha: 0.6

# ─── חלוקת השקופית: תוכנית משמאל, תצלומים מימין ─────────────────
# נמדד על התמונות המרוכבות של שלוש מצגות. התצלומים תמיד בצד ימין,
# אף פעם לא למטה. מה שמשתנה הוא נקודת החלוקה, לפי רוחב התוכנית.
#
#   מצגת       תוכנית                  תצלומים
#   Deck B       4.0%-20.6%  (332px)     30.5%-96.0%  (1311px)
#   מצגת ייחוס א     4.0%-33.0%  (578px)     40.1%-95.7%  (1111px)
#   2024       4.2%-64.8%  (1212px)    67.8%-96.0%  ( 566px)
#
# שני קבועים: התוכנית מתחילה ב-4%, והתצלומים נגמרים ב-96% — אותו
# קו ימני כמו הכותרת (96.7%) וקו הכותרת. הכל מיושר לימין.

plan_panel:
  x: 81
  y: 167
  width: 332           # ברירת המחדל לבניין צר; נגזר בפועל מיחס התוכן
  height: 878
  max_width_narrow: 489    # כשהתוכן פורטרטי — משאיר מקום לתצלום רחב
  max_width_wide: 1212     # כשהתוכן רחב — נמדד במצגת 2024 (64.8%)
  wide_threshold_aspect: 1.4
  note: |
    בקבצי הייחוס העמודה מכילה קומה שלמה, לא חדר בודד.
    כל שקופית מדגישה תת-קבוצה של גופים בתוך אותה תוכנית קומה,
    באמצעות צורות סימון עם Outer Glow — ולא באמצעות חיתוך מחדש.

# אזור התצלומים — תמיד בצד ימין
photo_area:
  x_end: 1921          # 96.0%, מיושר עם הכותרת וקו הכותרת
  y: 167
  height: 878
  min_gap_from_plan: 60      # הפער המינימלי שנמדד (מצגת 2024)
  common_widths: [1311, 1111, 706, 592, 566]

# ─── שקופית תצלומים בלבד (D-035) ──────────────────────────────────
# נמדד במצגת ייחוס א, שקופיות 12, 14, 52, 57, 61, 63, 65, 93, 96, 102:
# כל התצלומים באותו גובה (~880), כל אחד ביחס שלו, רווחים שווים
# (19-31, לרוב ~24), והשורה ממורכזת — שוליים שווים משני הצדדים
# (71/71, 67/67, 81/88). שורה רחבה מדי מקטינה את הגובה עד שנכנסת.
# גיא: "מיושרים למרכז ובמרחקים שווים", עד 3 תצלומים.
photos_only:
  x: 80                # השוליים של קו הכותרת — 4%
  x_end: 1921          # 96%
  y: 160
  height: 880
  gap: 24
  max_photos: 3

# כותרת הטקסט
title:
  right_edge_pct: 96.7        # 96.4-96.9 בכל המצגות
  top_pct: 3.6                # 3.5-4.0
  font: "Assistant Light"
  font_bold: "Assistant bold"
  color: "#FFFFFF"
  size_pt: 14                 # מצגת ייחוס א משתמש ב-8 + 11 לשתי שורות
  structure: "חדר | קטגוריית תאורה | אופציה"

section_divider:
  text_top_pct: 38.2
  logo: {x_pct: 3.7, y_pct: 82.9, w_pct: 15.4, h_pct: 10.9}

# ─── סימון תת-אזור ───────────────────────────────────────────────
# מסכה צהובה שקופה על חלק מהאזור, בזוויות ישרות. מקור: מצגת ייחוס א,
# שקופיות 6, 44, 97, 105 (ועוד אחת חלשה יותר, 43).
#
# **נמדד ולא נוחש.** מעל רקע שחור טהור המסכה נותנת בדיוק
# (72, 64, 26) בארבע השקופיות. מודל המיזוג הוא alpha רגיל, וזה
# מאומת: ההפרשים r-g=8 ו-r-b=46 קבועים בכל 150,904 הפיקסלים
# שמתחת למסכה, ללא תלות בבהירות הקו שמתחת. פירוק:
#     0.30 x (240, 213, 87) = (72.0, 63.9, 26.1)  ->  (72, 64, 26)
# ה-alpha נגזר מכך שהקו הבהיר ביותר בשרטוט הוא 204 בשני הצדדים
# (204 מחוץ למסכה, ו-206 בערוץ הירוק מתחתיה). טווח אפשרי מתמטית:
# 0.28 (רוויה מלאה) עד 0.44 (הקו הבהיר ביותר תחת המסכה לבן).
# 0.30 הוא הפתרון היחיד בטווח שמייצר אדום עגול, 240 — אותו אדום
# כמו צהוב ההארה של המשרד (#F0EB61), בירוק ובכחול אחרים.
#
# **אין קו מתאר.** חתך דרך השפה עובר משחור ישירות ל-(72,64,26).
sub_area_mask:
  fill: "#F0D557"          # (240, 213, 87)
  opacity: 0.30
  over_black: [72, 64, 26] # מה שנמדד בפועל — זהו עוגן הבדיקה
  outline: false
  note: |
    המסכה נצרבת לתוך פאנל התוכנית ואינה צורת PPTX נפרדת, בניגוד
    לכותרת ולקו. הסיבה: היא מוגדרת בקואורדינטות השרטוט ומתארת
    אזור בתוכנית. צורה נפרדת הייתה מתנתקת מהתוכנית ברגע שמישהו
    מזיז אותה ב-PowerPoint, ומצביעה על כלום. אותו נימוק כמו ההארה.
    ההארה מצוירת **מעל** המסכה — היא האור, ומסכה שקופה לא אמורה
    לעמעם אותה.

# ─── מראה התוכנית ────────────────────────────────────────────────
# מחולץ משכבות "קרקע הכל" ו-"קרקע תאורה" של deck_b.psd
plan_appearance:
  background: "#000000"
  # התוכנית היא קרקע אפורה רכה, לא קו לבן חד. נמדד על הייחוס:
  # בהירות ממוצעת של הפיקסלים הלא-שחורים היא 47, בעוד ש-#E0E0E0
  # נתן 104 — התוכנית התחרתה בזוהר במקום לשמש לו רקע.
  # #8C8C8C מביא לטווח הנכון ועדיין נשאר קריא, וקריאוּת התוכנית
  # היא דרישה שאינה ניתנת למשא ומתן.
  architecture_line: "#8C8C8C"
  wall_fill: "#464646"
  lighting_layer_colors:          # שכבת התאורה מיוצאת בצבעי CAD
    - "#E000A0"   # מגנטה — הנפוץ ביותר
    - "#0060E0"   # כחול
    - "#00E040"   # ירוק
  desaturate: true
  # ── עובי ובהירות לכל שכבה (D-031) ──
  # גיא: "לדקק ולעבות שכבות... להבהיר ולהכהות — כדי לייצר ניגודיות
  # בין קירות לרהיטים". חל על הפרויקט כולו, לא על שקופית בודדת.
  # לא חל על שכבות התאורה: מה שנראה בהן הוא הזוהר, והוא מכויל.
  layer_style:
    # כופלי עובי הקו. "רגיל" = העובי שנמדד, ולכן 1. ארבע דרגות
    # ולא ערך חופשי — הבדל שנראה לעין, ומצגות שנראות אחידות.
    widths:
      thin:   {he: "דק",       factor: 0.4}
      normal: {he: "רגיל",     factor: 1.0}
      thick:  {he: "עבה",      factor: 2.0}
      xthick: {he: "עבה מאוד", factor: 3.2}
    # בהירות: -1 שחור, 0 ברירת המחדל (הצבעים שלמעלה), 1 לבן.
    # הקו והמילוי זזים יחד, כדי שקיר לא ייראה כקו בהיר על מילוי כהה.
    # ‎-90% נוסה ונמחק: השרטוט כמעט נעלם (השוואה על 111 (2), 13.10).
    # ‎-60% מרחיק שכבה לרקע ועדיין רואים אותה.
    brightness_min: -0.6
    brightness_max: 1.0
  note: |
    שכבת התאורה מיוצאת מאוטוקאד בצבעי CAD, ושכבת התאמה "Black & White"
    ב-PSD מנטרלת אותם לאפור בהרכבה הסופית. לכן בשקופית המוגמרת
    רואים קווי שיער לבנים בלבד, בלי צבע.
