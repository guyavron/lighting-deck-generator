<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הפקת מצגות תאורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --glow-y:#f0eb61; --bg:#0d0d0f; --panel:#17171b; --panel-2:#1f1f25;
    --line:#2e2e36; --ink:#ececf0; --muted:#8b8b96; --accent:#4a9eff;
    --danger:#ff6b6b; --ok:#5ecf8d;
  }
  *{box-sizing:border-box}
  html,body{height:100%; overflow:hidden}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Assistant',-apple-system,Segoe UI,Arial,sans-serif;
    font-weight:300; display:flex; flex-direction:column;
  }
  #savestate{font-size:12.5px; white-space:nowrap; padding:3px 9px;
             border-radius:6px; margin-inline-start:6px}
  #savestate.ok{color:var(--ok)}
  #savestate.busy{color:var(--muted)}
  #savestate.bad{color:#04121f; background:#ffb454; font-weight:600}
  /* צף מעל התוכן ולא דוחף אותו (B-09): פס שמופיע ברגע לחיצה לא מזיז
     את הכפתור שמתחת לעכבר. */
  #savebar{position:fixed; top:44px; left:0; right:0; z-index:55;
           box-shadow:0 6px 18px rgba(0,0,0,.5);
           background:#3a1d12; border-bottom:2px solid #ff8a4c; color:#ffe6d6;
           padding:10px 16px; font-size:13.5px; line-height:1.6;
           display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  #savebar b{color:#fff}
  #notice{position:fixed; top:62px; left:50%; transform:translateX(-50%); z-index:80;
          max-width:min(560px,90vw); padding:11px 16px; border-radius:9px;
          font-size:14px; line-height:1.5; cursor:pointer;
          background:#3a1d12; border:1px solid #ff8a4c; color:#ffe6d6;
          box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #undo{position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
        z-index:70; background:#22242c; border:1px solid var(--line);
        border-radius:10px; padding:10px 14px; font-size:13.5px;
        display:flex; gap:12px; align-items:center;
        box-shadow:0 6px 24px rgba(0,0,0,.45)}
  #undo button{font-size:13px; padding:4px 12px}
  #savebar button{font-size:12.5px; padding:4px 10px}
  #loadbox, #namebox{position:fixed; inset:0; z-index:60; align-items:center;
           justify-content:center; background:rgba(8,8,10,.55)}
  .nb-card{min-width:340px}
  .nb-in{font-size:15px; padding:8px 10px}
  .nb-btns{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap}
  .nb-text{display:flex; flex-direction:column; gap:6px; max-width:460px;
           font-size:13px; line-height:1.5; color:var(--ink)}
  .lb-card{background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:20px 24px; min-width:380px; max-width:520px;
           box-shadow:0 10px 40px rgba(0,0,0,.5); display:flex;
           flex-direction:column; gap:10px; font-size:14px}
  .lb-title{font-size:16px; margin-bottom:4px}
  .lb-step{display:flex; gap:10px; align-items:baseline; color:var(--muted)}
  .lb-step.now{color:var(--ink)}
  .lb-step.done{color:var(--ink)}
  .lb-step.done .lb-ic{color:var(--ok)}
  .lb-ic{width:16px; flex:none; text-align:center}
  .lb-note{color:var(--muted)}
  .lb-step.now .lb-note b{color:#ffd479; font-weight:600}
  .lb-spin{display:inline-block; width:11px; height:11px; border-radius:50%;
           border:2px solid var(--accent); border-top-color:transparent;
           animation:lbspin .9s linear infinite}
  @keyframes lbspin{to{transform:rotate(360deg)}}
  .lb-time{margin-top:6px; font-size:15px; font-variant-numeric:tabular-nums}
  .lb-hint{font-size:12.5px; color:var(--muted)}
  header{
    display:flex; gap:10px; align-items:center; padding:9px 16px;
    background:var(--panel); border-bottom:1px solid var(--line);
    flex-wrap:wrap; flex:none;
  }
  h1{font-size:15px; font-weight:600; margin:0 6px 0 0; white-space:nowrap}
  select,button,input{
    font-family:inherit; font-size:14px; border-radius:7px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    padding:6px 10px;
  }
  button{cursor:pointer; transition:.15s}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4; cursor:default}
  .primary{background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:600}
  .ghost{background:transparent}
  .danger{color:var(--danger); border-color:transparent; background:transparent; padding:3px 7px}
  #status{font-size:12.5px; color:var(--muted); margin-inline-start:auto; white-space:nowrap}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-inline-end:6px}

  /* בדיקת השמישות: בשורה אחת עם גלילה הצידה, כבר ב-5 אזורים חלק
     מהסרגל — לפעמים האזור הפתוח עצמו — היה מחוץ למסך בלי שום סימן.
     עכשיו הסרגל יורד שורה, וכל האזורים גלויים תמיד. */
  #tabs{
    display:none; gap:6px; padding:7px 16px; background:#131317;
    border-bottom:1px solid var(--line); flex-wrap:wrap; flex:none;
  }
  .tab{
    display:flex; align-items:center; gap:6px; padding:5px 11px;
    border:1px solid var(--line); border-radius:20px; cursor:pointer;
    font-size:13.5px; white-space:nowrap; background:var(--panel-2);
  }
  .tab.on{border-color:var(--accent); background:#12202f}
  .tab .sw{width:9px; height:9px; border-radius:50%; flex:none}
  /* מספר השקופיות — עיגול קטן במקום "3 שקופיות" */
  .tab .c{font-size:11px; color:var(--muted); background:rgba(255,255,255,.07);
          border-radius:9px; padding:0 6px; min-width:18px; text-align:center}
  .tb{border:0; background:transparent; color:var(--muted); font-size:12px;
      padding:1px 4px; border-radius:4px; line-height:1; cursor:pointer}
  .tb:hover{background:rgba(255,255,255,.1); color:#fff}
  .q-row{display:flex; gap:6px; align-items:center}
  .q{flex:1; background:#0f151d; border:1px solid var(--line); border-radius:6px;
     padding:6px 9px; font-size:12px; color:#cfe3ff; direction:ltr;
     text-align:left; overflow:auto; white-space:nowrap}
  .q-row button{font-size:12px; padding:5px 9px}
  /* תת-אזור מקונן תחת אביו — הזחה וקו מחבר, כדי שסדר הסרגל יקרא
     כמו סדר המצגת. */
  /* כשהסרגל יורד שורה, הזחה וקו מחבר נשברים בתחילת שורה — ולכן
     תת-אזור מסומן ב-▨ צהוב, והאב מופיע במעבר עכבר. */
  .tab .of{font-size:12px; color:var(--glow-y); opacity:.85}
  /* קבוצת "התחלת שקופית" — פעולות שכולן פותחות שקופית חדשה */
  /* B-18: שורה קטנה של כפתורים במקום חמישה כפתורים גדולים (240px) */
  .mk{margin:8px 0 12px; display:flex; flex-wrap:wrap; gap:5px}
  .mk button{flex:1 1 auto; font-size:12.5px; padding:5px 8px; white-space:nowrap}
  .f-fold{margin:2px 0 8px}
  .f-fold > summary{cursor:pointer; font-size:12.5px; color:var(--muted); padding:4px 2px}
  .ph-more{width:100%; margin-top:7px}
  /* ─── תצוגת המצגת ─── */
  #deckstage{padding:6px 0 20px}
  .dk-head{display:flex; align-items:center; gap:9px; font-size:13px;
           color:var(--muted); padding:4px 2px 12px}
  .dk-grid{display:grid; gap:14px;
           grid-template-columns:repeat(auto-fill, minmax(290px, 1fr))}
  .dk-card{border:1px solid var(--line); border-radius:9px; overflow:hidden;
           cursor:pointer; background:#0b0d11}
  .dk-card:hover{border-color:var(--accent)}
  .dk-card.cur{border-color:var(--glow-y); box-shadow:0 0 0 1px var(--glow-y)}
  .dk-img{aspect-ratio:16/9; background:#000; display:flex;
          align-items:center; justify-content:center}
  .dk-img img{width:100%; height:100%; object-fit:contain; display:block}
  .dk-cap{display:flex; gap:7px; align-items:baseline; padding:7px 9px 2px;
          font-size:12.5px; color:#e8eef6}
  .dk-cap .n{color:var(--muted); font-size:11px; min-width:16px}
  .dk-sub{padding:0 9px 8px; font-size:11.5px; color:var(--muted)}
  /* ניטרלי בכוונה — שקופית בלי תצלום יכולה להיות בדיוק מה שרצו */
  .dk-nophoto{margin-inline-start:7px; padding:0 6px; border:1px solid var(--line);
    border-radius:5px; color:var(--ink)}
  .dk-gap{color:var(--ink)}
  /* שקופית שלא תצא — לא ניטרלי: זו עבודה שתיעלם מהמצגת */
  .dk-stop{color:var(--danger); font-weight:600}
  .dk-block{margin:0 9px 9px; padding:5px 8px; border-radius:6px; font-size:12px;
            color:var(--danger); background:rgba(255,107,107,.1);
            border:1px solid rgba(255,107,107,.35)}
  .dk-card.blocked{border-color:rgba(255,107,107,.6)}
  /* גוף רחוק שנשאר מחוץ לתמונה — לא עוצר את ההפקה, אבל העובד חייב לדעת */
  .dk-far{margin:0 9px 9px; padding:5px 8px; border-radius:6px; font-size:12px;
          color:var(--ink); background:rgba(255,200,0,.1);
          border:1px solid rgba(255,200,0,.4)}
  .issue{margin-top:5px; padding:4px 8px; border-radius:5px; cursor:pointer;
    background:rgba(255,255,255,.04); color:var(--ink)}
  .issue:hover{background:rgba(255,255,255,.1); text-decoration:underline}
  .drop{margin-top:6px; border:1px dashed var(--line); border-radius:7px;
        padding:12px 9px; text-align:center; font-size:12px;
        color:var(--muted); cursor:pointer}
  .drop.on{border-color:var(--glow-y); color:#fff; background:rgba(240,235,97,.07)}
  /* בזרימה רגילה בתוך הבמה, לא absolute. ל-#stage אין
     position:relative, ולכן inset:0 נצמד לחלון כולו וכיסה גם את
     סרגל העריכה — בדיוק מה שהתצוגה אמורה להשאיר פתוח. */
  #pvstage{justify-content:center; padding:4px 0 10px; max-width:100%}
  /* B-18: הפקדים מעל השקופית ודבוקים לראש הבמה, והשקופית מתכווצת כך
     שתיכנס בגובה החלון. בלפטופ (695px) הפקדים קודם ירדו מתחת לקו. */
  .pv-inner{width:100%; max-width:1180px; min-width:0; display:flex;
            flex-direction:column-reverse; gap:9px}
  .pv-foot{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
           position:sticky; top:0; z-index:6; background:var(--bg); padding:4px 0}
  .pv-stage{background:#000; border:1px solid var(--line); border-radius:8px;
            aspect-ratio:16/9; position:relative; overflow:hidden;
            align-self:center; width:min(100%, max(420px, calc((100vh - 250px) * 16 / 9)))}
  .pv-stage .empty{position:absolute; inset:0; display:flex;
                   align-items:center; justify-content:center}

  /* ─── קנבס השקופית ─────────────────────────────────────────────
     2000x1125 — גודל השקופית שנמדד — ומוקטן ב-transform לגודל הבמה.
     **כל הקואורדינטות כאן הן קואורדינטות שקופית**, אותן שהשרת שולח
     ואותן שהייצוא מקבל. אין המרה נוספת בשום מקום, ולכן אין איפה
     שהתצוגה והמצגת ייפרדו. `direction:ltr` כי המספרים נמדדים
     משמאל, גם בממשק עברי. */
  .pv-canvas{position:absolute; top:0; left:0; width:2000px; height:1125px;
             transform-origin:0 0; direction:ltr; background:#000}
  .pv-canvas.busy{opacity:.5}
  .glow-sw{width:18px; height:18px; min-width:0; padding:0; border-radius:50%;
           border:1px solid #555; cursor:pointer}
  .glow-sw.on{outline:2px solid var(--accent, #4a9eff); outline-offset:1px}
  .pv-el{position:absolute; box-sizing:border-box}
  .pv-el img{width:100%; height:100%; display:block}
  .pv-el.pick{cursor:move}
  .pv-el.pick:hover{outline:2px dashed rgba(255,255,255,.45); outline-offset:0}
  .pv-el.sel{outline:2px solid var(--glow-y); outline-offset:0}
  /* יישור לימין בשני המקרים — כך נמדד בכל 5 מצגות הייחוס, וכך
     `_set_rtl` כותב ב-PPTX (algn="r" תמיד, rtl לפי שפת הטקסט). */
  .pv-title{color:#fff; text-align:right; white-space:pre-wrap;
            overflow:visible}
  .pv-el[data-editing]{cursor:text; outline:2px solid var(--glow-y)}
  .pv-el[data-editing] span{cursor:text; outline:none; display:inline-block;
                            min-width:12px}
  .pv-h{position:absolute; width:26px; height:26px; background:var(--glow-y);
        border:2px solid #000; border-radius:50%; z-index:3}
  .pv-h.nw{cursor:nwse-resize} .pv-h.ne{cursor:nesw-resize}
  .pv-h.sw{cursor:nesw-resize} .pv-h.se{cursor:nwse-resize}
  .pv-guide{position:absolute; background:var(--glow-y); opacity:.85; z-index:4}
  .pv-tip{position:absolute; z-index:5; background:rgba(0,0,0,.8); color:#fff;
          font-size:20px; padding:3px 8px; border-radius:5px; direction:ltr;
          white-space:nowrap; pointer-events:none}
  .pv-foot input.tt{flex:1; min-width:180px; background:#0f151d;
                    border:1px solid var(--line); border-radius:6px;
                    padding:6px 9px; font-size:13px; color:#e8eef6}

  main{flex:1; display:flex; min-height:0}
  #stage{flex:1; overflow:auto; padding:12px 16px 20px; min-width:0}
  #wrap{position:relative; line-height:0; margin:0 auto; width:max-content}
  #plan{display:block; background:#000; border:1px solid var(--line); border-radius:4px}
  #overlay{position:absolute; inset:0}
  #zoombar{
    position:sticky; top:-12px; z-index:5; display:flex; gap:6px; align-items:center;
    margin:-12px -16px 12px; padding:8px 16px 0; background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  #zoombar > button{margin-bottom:6px}
  .vtabs{display:flex; align-self:flex-end}
  .vtabs button{background:transparent; border:1px solid transparent;
    border-bottom:0; border-radius:8px 8px 0 0; margin-bottom:-1px;
    padding:8px 20px; font-size:13.5px; color:var(--muted)}
  .vtabs button:hover{color:var(--ink)}
  .vtabs button.on{background:var(--accent); border-color:var(--accent);
    color:#04121f; font-weight:600}
  .steps{display:flex; gap:6px; align-items:center}
  .step-sep{color:var(--muted); font-size:15px}
  #zoombar span{font-size:12.5px; color:var(--muted); min-width:44px; text-align:center}
  /* הודעת המצב צפה (B-09): הקופסה החיצונית דביקה ובגובה אפס, ולכן
     הופעת ההודעה לא דוחפת את התוכנית למטה */
  #modehintbox{position:sticky; top:44px; z-index:5; height:0}
  #modehint{
    position:absolute; left:50%; transform:translateX(-50%); top:0;
    width:max-content; max-width:90%;
    padding:6px 13px; border-radius:8px; font-size:13px; display:none;
  }
  #modehint.pick{display:block; background:#12202f; border:1px solid var(--accent)}

  aside{
    width:410px; flex:none; background:var(--panel);
    border-inline-start:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .side-head{padding:11px 14px; border-bottom:1px solid var(--line); flex:none}
  .side-body{flex:1; overflow-y:auto; padding:11px 13px}
  .side-foot{padding:12px 14px; border-top:1px solid var(--line); flex:none}
  .hint{font-size:12.5px; color:var(--muted); line-height:1.6}

  details.box{background:var(--panel-2); border:1px solid var(--line);
    border-radius:9px; margin-bottom:9px}
  details.box>summary{padding:9px 11px; cursor:pointer; font-size:13.5px;
    font-weight:600; list-style:none; display:flex; align-items:center; gap:8px}
  details.box>summary::-webkit-details-marker{display:none}
  details.box>summary .n{margin-inline-start:auto; font-size:12px;
    color:var(--muted); font-weight:400}
  .scroll-list{max-height:270px; overflow-y:auto; padding:0 11px 9px;
    border-top:1px solid var(--line)}
  .lrow{display:flex; align-items:center; gap:8px; padding:4px 2px; font-size:13px}
  .lrow input{width:15px; height:15px; accent-color:var(--accent); padding:0; flex:none}
  .lrow .lname{direction:ltr; unicode-bidi:isolate; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}
  .lrow .ln{font-size:11px; color:var(--muted); white-space:nowrap}
  .lrow.lit .lname{color:var(--glow-y)}
  /* עובי ובהירות לשכבה (D-031) — שורה שנייה מתחת לשם, רק לשכבה מוצגת */
  .lwrap{display:flex; align-items:center; gap:4px}
  .lwrap .lrow{flex:1; min-width:0}
  .ledit{padding:2px 8px; font-size:12px; flex:none; background:var(--panel);
         border:1px solid var(--line); color:var(--ink)}
  .ledit:hover, .ledit.on{border-color:var(--line); color:var(--ink)}
  .lsum{font-size:11px; color:var(--accent); white-space:nowrap; flex:none}
  .lsty{display:flex; align-items:center; gap:7px; padding:2px 25px 9px 2px;
        font-size:11.5px; color:var(--muted); flex-wrap:wrap}
  .lsty .seg button{padding:3px 6px; font-size:11.5px; white-space:nowrap}
  /* **ltr במכוון.** בדף מימין לשמאל הדפדפן הופך מחוון: ימינה הקטין
     את הערך. גיא הזיז ימינה כדי להבהיר, והשכבות הוכהו עד שנעלמו
     (12.10). שמאל = כהה, ימין = בהיר, כמו בכל תוכנת עריכה. */
  .lsty input[type=range]{flex:1; min-width:80px; accent-color:var(--accent);
        height:14px; padding:0; direction:ltr}
  .lsty .bv{min-width:38px; text-align:center; direction:ltr; color:var(--ink)}
  .lsty .rst{padding:2px 7px; font-size:12px}
  .lsty.changed{color:var(--ink)}

  .area{background:var(--panel-2); border:1px solid var(--line);
    border-radius:9px; margin-bottom:9px; overflow:hidden}
  .area.sel{border-color:var(--accent)}
  .area-head{display:flex; align-items:center; gap:8px; padding:8px 10px}
  .swatch{width:11px; height:11px; border-radius:3px; flex:none}
  .area-head input[type=text]{flex:1; background:transparent; border:none;
    padding:3px 4px; min-width:0; font-size:14px; font-weight:600;
    color:var(--ink); border-radius:4px}
  .area-head input[type=text]:focus{outline:1px solid var(--accent); background:#0e0e12}
  .count{font-size:12px; color:var(--muted); white-space:nowrap}

  .lit-layer{border:1px solid var(--line); border-radius:8px; margin-bottom:7px;
    background:var(--panel-2); overflow:hidden}
  .lit-head{display:flex; align-items:center; gap:9px; padding:8px 10px;
    cursor:pointer; font-size:14px}
  .lit-head:hover{background:#26262e}
  .lit-head input{width:16px; height:16px; accent-color:var(--glow-y); padding:0; flex:none}
  .lit-head .lay{direction:ltr; unicode-bidi:isolate; font-weight:600}
  .lit-head .n{margin-inline-start:auto; font-size:12px; color:var(--muted)}
  .lit-head .caret{font-size:11px; color:var(--muted)}
  .lit-blocks{padding:2px 10px 9px 30px; border-top:1px solid var(--line); display:none}
  .lit-layer.open .lit-blocks{display:block}
  .brow{display:flex; align-items:center; gap:8px; padding:4px 2px; font-size:13px;
    cursor:pointer; border-radius:5px}
  .brow:hover{background:#26262e}

<body>

<header>
  <h1>הפקת מצגות תאורה</h1>
  <select id="file"></select>
  <button id="pick" class="ghost">העלה DXF…</button>
  <input type="file" id="upl" accept=".dxf" hidden>
  <button id="load" class="primary">טען שרטוט</button>
  <!-- סקירת הבנק אינה תלויה בשרטוט, ולכן היא מחוץ לקבוצה שמופיעה
       רק אחרי טעינה. קודם היא הייתה בתוכה ולא נראתה כלל. -->
  <button id="toBank" class="ghost">סקירת בנק</button>
  <!-- שלושה שלבים, מסלול אחד (גיא, 12.10). המצגת היא שלב ולא תצוגה:
       מסתכלים על הכל, ואז מפיקים — ולכן כפתור ההפקה יושב שם. -->
  <span id="modebtns" class="steps" style="display:none">
    <button id="toAreas" class="ghost">1 · סימון אזורים</button>
    <span class="step-sep">‹</span>
    <button id="toWork" class="ghost">2 · עבודה</button>
    <span class="step-sep">‹</span>
    <button id="toDeck" class="ghost">3 · מצגת והפקה</button>
  </span>
  <span id="status"></span>
  <span id="savestate" title="מצב השמירה של הפרויקט"></span>
</header>
<!-- התראת שמירה (D-036): שרת לא זמין, פרויקט פגום, שינוי מחלון אחר.
     כל אחד מהם הוא מצב שבו עבודה עלולה ללכת לאיבוד, ולכן הוא בולט. -->
<div id="savebar" style="display:none"></div>
<!-- ביטול מחיקה (D-037) -->
<div id="undo" style="display:none"></div>
<div id="notice" style="display:none" title="לחץ לסגירה"></div>

<div id="tabs"></div>
<!-- חיווי טעינת שרטוט — השלבים מהשרת ושעון -->
<div id="loadbox" style="display:none"><div class="lb-card"></div></div>
<!-- שם לאזור / תת-אזור (askName) -->
<div id="namebox" style="display:none"></div>

<div id="bank" style="display:none"></div>


<main>
  <section id="stage">
    <!-- לשוניות צמודות לשפת הבמה ולא סרגל צף מעליה. הצף כיסה את
         השקופית, ו"תצוגה" נראתה ככפתור (גיא, 12.10). -->
    <div id="zoombar">
      <span class="vtabs" id="viewseg">
        <button class="on" data-view="plan">תוכנית</button>
        <button data-view="slide">שקופית</button>
      </span>
      <span style="flex:1"></span>
      <button class="ghost" id="zout" style="padding:5px 11px">−</button>
      <span id="zval">100%</span>
      <button class="ghost" id="zin" style="padding:5px 11px">+</button>
      <button class="ghost" id="zfit" style="padding:5px 11px">התאם למסך</button>
    </div>
    <div id="modehintbox"><div id="modehint"></div></div>
    <div id="wrap">
      <img id="plan" alt="">
      <canvas id="overlay"></canvas>
    </div>
    <div id="pvstage" style="display:none"></div>
    <div id="deckstage" style="display:none"></div>
  </section>

  <aside>
    <div class="side-head"><div class="hint" id="sidehint"></div></div>
    <div class="side-body" id="side"></div>
    <div class="side-foot">
      <div id="summary" class="hint" style="margin-bottom:8px"></div>
      <button id="build" class="primary" style="width:100%" disabled>הפק מצגת</button>
      <div id="result" style="margin-top:9px"></div>
    </div>
  </aside>

<script>
const COLORS = ['#4a9eff','#f0eb61','#5ecf8d','#ff9f5e','#c98bff','#ff6b9d','#6be3d0','#ffd479'];
const $ = s => document.querySelector(s);
const img = $('#plan'), cv = $('#overlay'), ctx = cv.getContext('2d');
const SEP = '';

let S = {
  name:null, mode:'areas',
  ovW:0, ovH:0, ovFixtures:[], layers:[], suggested:[], codeNames:{},
  areas:[], curArea:-1, curSlide:-1,
  view:null, zoom:1, drag:null, picking:false, warnHtml:'', seq:0,
};

/* ═══ זום ═══
   התמונה מוצגת בקנה מידה משתנה, אבל הקנבס שומר על רזולוציית המקור.
   כל המרה מהעכבר עוברת דרך היחס, אחרת המלבנים והלחיצות יזוזו. */
function planSize(){
  return (S.mode === 'work' && S.view) ? {w:S.view.w, h:S.view.h}
                                       : {w:S.ovW, h:S.ovH};
}
function applyZoom(){
  const p = planSize(); if(!p.w) return;
  S.zoom = Math.min(Math.max(S.zoom || 1, .15), 6);
  img.style.width = Math.round(p.w*S.zoom)+'px';
  img.style.height = Math.round(p.h*S.zoom)+'px';
  cv.style.width = img.style.width; cv.style.height = img.style.height;
  $('#zval').textContent = Math.round(S.zoom*100)+'%';
  render();
}
function fitZoom(){
  const p = planSize(); if(!p.w) return;
  const st = $('#stage');
  const z = Math.min((st.clientWidth-44)/p.w, (st.clientHeight-90)/p.h, 1);
  S.zoom = Math.min(Math.max(z, .15), 6);
  applyZoom();
}
$('#zin').onclick  = () => { S.zoom = Math.min(S.zoom*1.25, 6); applyZoom(); };
$('#zout').onclick = () => { S.zoom = Math.max(S.zoom/1.25, .15); applyZoom(); };
$('#zfit').onclick = fitZoom;
addEventListener('resize', () => { if(planSize().w) applyZoom(); });

function toCanvas(cx, cy){
  const r = cv.getBoundingClientRect();
  return {x:(cx-r.left)*(cv.width/r.width), y:(cy-r.top)*(cv.height/r.height)};
}
/* ─── תת-אזור · D-022 ─────────────────────────────────────────────

   המסכה מסומנת בקואורדינטות **השרטוט**, לא בפיקסלים. התוכנית
   מרונדרת בשלושה גדלים לפחות — סקירה, זום לאזור, ופאנל השקופית —
   ופוליגון בפיקסלים היה נכון באחד מהם ושגוי בשניים. */

function viewToWorld(px, py){
  const w = S.view && S.view.window; if(!w) return null;
  return [w[0] + (px / S.view.w) * (w[2] - w[0]),
          w[3] - (py / S.view.h) * (w[3] - w[1])];
}
function worldToView(wx, wy){
  const w = S.view && S.view.window; if(!w) return null;
  return [(wx - w[0]) / (w[2] - w[0]) * S.view.w,
          (w[3] - wy) / (w[3] - w[1]) * S.view.h];
}
/* אותו כלל שהשרת מיישם ב-`subarea.orthogonalize`: כל נקודה נצמדת
   לציר שבו התזוזה גדולה יותר. כאן זה לציור החי; מה שנצרב לתמונה
   עובר דרך השרת, ולכן מסכה עקומה אינה יכולה להגיע למצגת. */
function orthoNext(prev, pt){
  return (Math.abs(pt[0]-prev[0]) >= Math.abs(pt[1]-prev[1]))
    ? [pt[0], prev[1]] : [prev[0], pt[1]];
}
function subRing(pts){
  if(!pts || pts.length < 3) return pts || [];
  const a = pts[pts.length-1], b = pts[0];
  return (a[0] !== b[0] && a[1] !== b[1]) ? pts.concat([[b[0], a[1]]]) : pts;
}
function pointInPoly(poly, x, y){
  if(!poly || poly.length < 3) return true;      // אין סימון = הכל בפנים
  let inside = false;
  for(let i = 0, j = poly.length-1; i < poly.length; j = i++){
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if((yi > y) !== (yj > y)){
      const t = (yj === yi) ? 0 : (y - yi) / (yj - yi);
      if(x < xi + t * (xj - xi)) inside = !inside;
    }
  }
  return inside;
}

/* שם שרטוט לתצוגה, בלי ".dxf". סיומת לטינית צמודה לשם עברי בשורה
   עברית מתהפכת ("dxf · 56.8MB.בדיקה"), וממילא כל הרשימה DXF. */
function bareName(n){ return String(n || '').replace(/\.dxf$/i, ''); }

/* "אזור אחד", לא "1 אזורים". `one` כשהצורה ביחיד אינה בטבלה —
   למשל "שקופית אחת מאושרת". מ-2 ומעלה: המספר והמילה כמו שהם. */
const ONE = {'אזורים':'אזור אחד', 'שקופיות':'שקופית אחת', 'גופים':'גוף אחד',
             'סוגים':'סוג אחד', 'תצלומים':'תצלום אחד'};
function cnt(n, many, one){
  return n === 1 ? (one || ONE[many] || '1 ' + many) : n + ' ' + many;
}

/* שם לאזור או לתת-אזור — חלון של הכלי במקום `prompt()` של הדפדפן,
   שנפתח עם "localhost says" באנגלית ומשמאל לימין. Enter = אישור,
   Esc = ביטול (מחזיר null, כמו prompt). */
function askName(title, initial){
  return new Promise(resolve => {
    const box = $('#namebox');
    box.innerHTML = `<div class="lb-card nb-card">
        <b class="lb-title"></b>
        <input class="nb-in" type="text">
        <div class="nb-btns"><button class="primary" data-nbok>אישור</button>
          <button class="ghost" data-nbno>ביטול</button></div></div>`;
    box.querySelector('.lb-title').textContent = title;
    const inp = box.querySelector('.nb-in');
    limitName(inp);
    inp.value = initial || '';
    box.style.display = 'flex';
    const done = v => { box.style.display = 'none'; box.innerHTML = ''; resolve(v); };
    box.querySelector('[data-nbok]').onclick = () => done(inp.value);
    box.querySelector('[data-nbno]').onclick = () => done(null);
    box.onmousedown = e => { if(e.target === box) done(null); };   // לחיצה בחוץ
    inp.onkeydown = e => {
      if(e.key === 'Enter'){ e.preventDefault(); done(inp.value); }
      else if(e.key === 'Escape'){ e.preventDefault(); done(null); }
      e.stopPropagation();          // שלא יפעילו קיצורי מקלדת של הבמה
    };
    setTimeout(() => { inp.focus(); inp.select(); }, 0);
  });
}

/* חלון בחירה של הכלי, במקום `confirm()` של הדפדפן (B-07). אותו מראה כמו
   `askName`. הכפתורים: [{label, value, primary}]. Esc או לחיצה בחוץ — null,
   כלומר "לא להחליט עכשיו". `lines` — שורות טקסט (לא HTML). */
function askChoice(title, lines, buttons){
  return new Promise(resolve => {
    const box = $('#namebox');
    box.innerHTML = `<div class="lb-card nb-card">
        <b class="lb-title"></b><div class="nb-text"></div>
        <div class="nb-btns"></div></div>`;
    box.querySelector('.lb-title').textContent = title;
    const txt = box.querySelector('.nb-text');
    lines.forEach(l => { const d = document.createElement('div'); d.textContent = l; txt.appendChild(d); });
    const done = v => { box.style.display = 'none'; box.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => { if(e.key === 'Escape'){ e.preventDefault(); done(null); } };
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = b.primary ? 'primary' : 'ghost';
      el.textContent = b.label;
      el.dataset.choice = b.value;
      el.onclick = () => done(b.value);
      box.querySelector('.nb-btns').appendChild(el);
    });
    box.style.display = 'flex';
    box.onmousedown = e => { if(e.target === box) done(null); };
    document.addEventListener('keydown', onKey, true);
    const first = box.querySelector('.primary'); if(first) setTimeout(() => first.focus(), 0);
  });
}

/* אישור כן/לא בחלון של הכלי, במקום `confirm()` של הדפדפן (B-13).
   מחזיר true רק ב"כן"; Esc ולחיצה בחוץ = false. `safe` — כפתור הביטול הוא
   הבולט והמסומן (למחיקה ודריסה). `lines` — שורות טקסט, לא HTML. */
function askYes(title, lines, yes, no, safe){
  return askChoice(title, lines, [
    {label: yes || 'המשך', value: 'yes', primary: !safe},
    {label: no || 'ביטול', value: 'no', primary: !!safe}]).then(v => v === 'yes');
}

/* הודעת שגיאה בולטת (B-20): שורת המצב למעלה קטנה ונעלמת מהעין; שגיאות
   העלאה צריכות להיראות. נסגרת בלחיצה או אחרי 9 שניות. */
let _noticeTimer = null;
function showNotice(text){
  const el = $('#notice'); if(!el) return;
  el.textContent = text; el.style.display = 'block';
  clearTimeout(_noticeTimer);
  _noticeTimer = setTimeout(() => { el.style.display = 'none'; }, 9000);
  el.onclick = () => { el.style.display = 'none'; clearTimeout(_noticeTimer); };
}

/* מגבלת אורך לשם אזור וכותרת (B-21): 60 תווים. מעל זה השם גולש מהלשונית
   ומהסקירה ועוטף לכמה שורות בכותרת המצגת. מגבילים בשדה ומודיעים. */
const NAME_MAX = 60;
function limitName(el){
  el.maxLength = NAME_MAX;
  el.addEventListener('input', () => {
    if(el.value.length >= NAME_MAX)
      setStatus(`השם הוגבל ל-${NAME_MAX} תווים — שם ארוך יותר לא נכנס יפה בלשונית ובכותרת`, '#ffd479');
  });
}

function setStatus(t, c){
  $('#status').innerHTML = c ? '<span class="dot" style="background:'+c+'"></span>'+t : t;
}

/* ═══ קבצים ═══ */
async function listDrawings(){
  const r = await fetch('/api/drawings').then(r=>r.json());
  $('#file').innerHTML = r.files.map(f=>
    `<option value="${f.name}">${bareName(f.name)} · ${f.mb}MB</option>`).join('');
}
async function uploadFile(f){
  if(!f) return;
  if(!f.name.toLowerCase().endsWith('.dxf')){
    setStatus('יש להעלות קובץ DXF', '#ff6b6b');
    showNotice('אפשר להעלות רק קובץ DXF. ייצא את השרטוט מאוטוקאד כ-DXF ונסה שוב.'); return; }
  setStatus(`מעלה ${bareName(f.name)} (${(f.size/1e6).toFixed(1)}MB)…`, '#ffd479');
  const fd = new FormData(); fd.append('file', f);
  try{
    const r = await fetch('/api/upload', {method:'POST', body:fd});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || 'העלאה נכשלה');
    await listDrawings(); $('#file').value = d.name;
    // וטוענים מיד. אין סיבה לחכות ללחיצה נוספת אחרי שהקובץ כבר כאן.
    setStatus(d.existing
      ? `הקובץ כבר קיים כ-${d.name} — פותח אותו עם העבודה השמורה…`
      : `${d.name} הועלה — טוען…`, '#5ecf8d');
    $('#load').click();
  }catch(e){ setStatus('שגיאה: '+errText(e), '#ff6b6b'); showNotice(errText(e)); }
}
$('#pick').onclick = () => $('#upl').click();
$('#upl').onchange = e => uploadFile(e.target.files[0]);
let dragDepth = 0;
addEventListener('dragenter', e=>{e.preventDefault(); dragDepth++; document.body.classList.add('dragging');});
addEventListener('dragleave', e=>{e.preventDefault(); if(--dragDepth<=0) document.body.classList.remove('dragging');});
addEventListener('dragover', e=>e.preventDefault());
addEventListener('drop', e=>{e.preventDefault(); dragDepth=0;
  document.body.classList.remove('dragging'); uploadFile(e.dataTransfer.files[0]);});

$('#load').onclick = async () => {
  const name = $('#file').value; if(!name) return;
  // נקרא לפני הטעינה — הטעינה עצמה עוברת בשלב 1 ורושמת אותו (D-037)
  const place = readPlace(name);
  $('#load').disabled = true;
  setStatus('טוען וקורא את השרטוט…', '#ffd479');
  loadBoxStart(name);
  try{
    const d = await fetch('/api/load?name='+encodeURIComponent(name))
      .then(async r=>{
        // ההודעה של השרת היא בעברית ואומרת מה לעשות (B-04) — מציגים אותה
        if(!r.ok){
          let why = 'טעינה נכשלה';
          try{ why = (await r.json()).detail || why; }catch(_){}
          throw new Error(why);
        }
        return r.json(); })
      .finally(loadBoxStop);
    S.name = name; S.ovW = d.width; S.ovH = d.height;
    S.ovFixtures = d.fixtures; S.layers = (d.layers||[]).map(l=>({...l}));
    S.codeNames = d.code_names || {};
    S.areas = []; S.layerStyles = {}; S.deck = deckDefaults(); S.rev = 0; SAVE.blocked = ''; hideSaveBar();
    S.curArea = -1; S.curSlide = -1; S.view = null;
    S.suggested = d.suggested || []; S.mode = 'areas'; S.picking = false; S.subDraw = null; S.lightDraw = null; S.seq = 0;
    _ovMap = null;

    S.warnHtml = '';
    // **שרטוט בלי רקע — עוצרים ומסבירים** (D-037). בבדיקת השמישות 3
    // מתוך 4 השרטוטים היו כאלה, והשקופיות יצאו גופים זוהרים על שחור.
    // שורה צהובה קטנה לא עצרה אף אחד.
    S.noArch = !d.has_architecture; S.noArchOk = false;
    if(S.noArch){
      const cand = (d.hidden_candidates || []);
      S.warnHtml += `<div class="warn" style="font-size:13.5px; line-height:1.7; padding:11px 13px">
        <b style="font-size:14.5px">⚠ בשרטוט הזה אין רקע אדריכלי שיוצג</b><br>
        השקופיות יראו רק את גופי התאורה הזוהרים, על רקע שחור — בלי קירות ובלי חדרים.
        בדרך כלל זה אומר שהתוכנית האדריכלית מחוברת כ-XREF ולא "נצרבה" לקובץ.<br>
        <b>איך מתקנים באוטוקאד:</b> פקודה <b>XREF</b> ← לחיצה ימנית על כל קובץ מחובר ←
        <b>Bind</b> ← <b>Insert</b>. אחר כך שומרים DXF מחדש ומעלים אותו כאן.
        ${cand.length ? `<br>שכבות מוסתרות עם תוכן — אולי התוכנית באחת מהן (סמן אותה ברשימת השכבות):
          <b>${cand.map(c => c.name + ' (' + c.n.toLocaleString() + ')').join(' · ')}</b>` : ''}
      </div>`;
    }
    if(d.unmapped && d.unmapped.length) S.warnHtml +=
      `<div class="warn">יש גופי תאורה מסוג שהכלי עדיין לא מכיר: <b>${d.unmapped.join(', ')}</b>. אפשר לעבוד איתם כרגיל — הם יופיעו ברשימה לפי הקוד שלהם.</div>`;

    // שחזור עבודה קודמת
    let restored = 0;
    let pr = null;
    try{
      const res = await fetch('/api/project?drawing='+encodeURIComponent(name));
      if(!res.ok) throw new Error('HTTP ' + res.status);
      pr = await res.json();
    }catch(e){
      // **לא קראנו את הפרויקט — לא מתחילים מאפס.** קודם `catch` ריק
      // המשיך לפרויקט ריק, והשמירה הראשונה דרסה את העבודה (D-036).
      blockSaving('unreadable');
    }
    if(pr && pr.corrupt){ blockSaving('corrupt', pr.versions || []); }
    S.rev = (pr && pr.rev) || 0;
    try{
      if(pr && pr.found && pr.state && pr.state.areas && pr.state.areas.length){
        S.areas = pr.state.areas;
        // שמות שנוצרו לפני הגזירה האוטומטית נשארים תקועים על שם
        // השכבה ("קומת מגורים | light up"), כי retitle רץ רק בשינוי.
        // הפורמט המצטבר הישן ("– אופציה ב") סומן auto=false ולכן
        // לא היה מתרענן לעולם — הוא זוהה ומוחזר לגזירה.
        S.areas.forEach(a => {
          (a.slides||[]).forEach(sl => {
            sl.photos = sl.photos || []; sl.photoTags = sl.photoTags || [];
            sl.photoRooms = sl.photoRooms || []; sl.geom = sl.geom || {};
            // `sl.sub` הוא השדה של המודל הישן (D-022), שבו הפוליגון
            // ישב על השקופית. הוא כבר לא נקרא, אבל **אינו נמחק** —
            // הכלי לא הורס נתונים של אדם, גם כשהוא כבר לא מבין אותם.
            // מי שצייר פוליגון לפני D-023 יצייר אותו מחדש, והפעם
            // הוא ייצור תת-אזור בסרגל.
            sl.mask = !!sl.mask;
            if(/ – אופציה /.test(sl.title||'')) sl.auto = true;
          });
          a.poly = a.poly || []; a.parent = a.parent || '';
        });
        migrateAreas(); syncParents();
        S.areas.forEach(retitle);
        if(pr.state.layers) S.layers.forEach(l => l.on = pr.state.layers.includes(l.name));
        S.layerStyles = pr.state.layer_styles || {};
        S.deck = Object.assign(deckDefaults(), pr.state.deck || {});
        restored = S.areas.length;
        const ids = S.areas.flatMap(a=>(a.slides||[]).map(s=>s.id||0));
        S.seq = ids.length ? Math.max.apply(null, ids) : 0;
      }
    }catch(e){ blockSaving('unreadable'); }
    if(!S.areas.length) S.suggested.forEach(a => addArea(a.x0,a.y0,a.x1,a.y1,a.name,true));

    showOverview();
    // קודם מצב השמירה של מה שנטען, ורק אחר כך הצעת השחזור — שחזור
    // שנשמר מעדכן את השעה, ולא נדרס בשעה הישנה.
    if(SAVE.blocked) showSaveState('bad');
    else{
      // פרויקט חדש שעוד לא נשמר — אין "נשמר ✓" שקרי
      showSaveState(pr && pr.found ? 'ok' : '', pr && pr.state && pr.state.saved_at);
      await offerPending(name, pr && pr.state);
    }
    let msg = cnt(d.n_fixtures, 'גופים');
    if(d.dropped) msg += ' · ' + cnt(d.dropped, 'גופים רחוקים מהשרטוט לא נספרו', 'גוף אחד רחוק מהשרטוט לא נספר');
    S.statusBase = msg; S.statusAreas = S.areas.length;      // B-15: לעדכון אחרי מחיקה
    msg += restored ? ' · שוחזרו ' + cnt(restored, 'אזורים')
                : ' · ' + cnt(S.areas.length, 'אזורים מוצעים', 'אזור אחד מוצע');
    setStatus(msg, d.has_architecture ? '#5ecf8d' : '#ffd479');
    $('#modebtns').style.display = 'flex';
    if(restored && !SAVE.blocked) await returnToPlace(place);
  }catch(e){
    setStatus('שגיאה: '+errText(e), '#ff6b6b');
    // הטעינה נכשלה — על המסך נשאר הפרויקט הקודם, ולכן גם הבורר חוזר
    // אליו. אחרת הבורר מראה קובץ אחד והמסך אחר (B-04).
    if(S.name && $('#file').value !== S.name) $('#file').value = S.name;
  }
  $('#load').disabled = false;
};

/* ─── חיווי טעינה ────────────────────────────────────────────────
   בדיקת השמישות: טעינה ראשונה ~80 שניות, ועל המסך רק "טוען…" קטן
   בפינה. אין דרך לדעת אם הכלי עובד או תקוע, ועובד מרענן ומתחיל
   מההתחלה. כאן: השלבים האמיתיים מהשרת ושעון שזז כל שנייה.
   **אין פס אחוזים** — השלב הארוך אינו יודע כמה ממנו עבר, ופס
   שמתקדם לפי ניחוש היה משקר. */
const LOADBOX = {timer: null, show: null, t0: 0, p: null};

function loadBoxStart(name){
  loadBoxStop();
  LOADBOX.t0 = Date.now(); LOADBOX.p = {step: 1};
  // שרטוט שכבר בזיכרון חוזר מיד — לא להבהב תיבה לרבע שנייה
  LOADBOX.show = setTimeout(() => {
    $('#loadbox').style.display = 'flex'; loadBoxRender(name);
  }, 500);
  const poll = async () => {
    try{
      const p = await (await fetch('/api/load_progress?name=' +
                                   encodeURIComponent(name))).json();
      if(p.active) LOADBOX.p = p;
    }catch(e){}
    if($('#loadbox').style.display !== 'none') loadBoxRender(name);
  };
  poll();
  LOADBOX.timer = setInterval(poll, 1000);
}

function loadBoxStop(){
  clearTimeout(LOADBOX.show); clearInterval(LOADBOX.timer);
  LOADBOX.show = LOADBOX.timer = null;
  $('#loadbox').style.display = 'none';
}

function loadBoxRender(name){
  const p = LOADBOX.p || {step: 1};
  const sec = Math.round((Date.now() - LOADBOX.t0) / 1000);
  const known = p.first !== undefined;
  const steps = [
    ['קריאת השרטוט ומציאת גופי התאורה',
     p.n_fixtures ? cnt(p.n_fixtures, 'גופים') : ''],
    ['הכנת הקווים לציור',
     !known ? '' : p.first ? '<b>פעם ראשונה לשרטוט הזה — לוקח כדקה</b>'
                           : 'הוכן כבר בעבר — כמה שניות'],
    ['ציור תמונת הסקירה', ''],
  ];
  const box = $('#loadbox .lb-card');
  box.innerHTML = `<b class="lb-title">טוען את השרטוט <bdi></bdi></b>` +
    steps.map(([t, note], k) => {
      const n = k + 1, st = n < p.step ? 'done' : n === p.step ? 'now' : '';
      return `<div class="lb-step ${st}"><span class="lb-ic">${
        st === 'done' ? '✓' : st === 'now' ? '<i class="lb-spin"></i>' : '○'}</span>
        <span>${t}${note ? ' — <span class="lb-note">' + note + '</span>' : ''}</span></div>`;
    }).join('') +
    `<div class="lb-time">עברו ${sec} שניות</div>
     <div class="lb-hint">אפשר להשאיר את הדף פתוח ולחכות.${p.first ?
       ' בפעם הבאה הטעינה של השרטוט הזה תהיה מהירה יותר.' : ''}</div>`;
  // שם הקובץ כטקסט — הוא מגיע מהעלאה, לא מאיתנו. **בלי ".dxf"**:
  // סיומת לטינית צמודה לשם עברי בשורה עברית נקראת כאילו היא לפניו.
  box.querySelector('.lb-title bdi').textContent = bareName(name);
}

/* ═══ מצבים ═══ */
/* איזה שלב פעיל, ומה מוצג בכל אחד. המצגת היא שלב 3 גם כשהיא
   נפתחת מתוך העבודה — היא תמיד "מסתכלים לפני שמפיקים". */
function markSteps(){
  const st = S.deckOn ? 3 : (S.mode === 'work' ? 2 : 1);
  [['#toAreas',1],['#toWork',2],['#toDeck',3]].forEach(([id,n]) =>
    $(id).className = (n === st) ? 'primary' : 'ghost');
  $('#zoombar').style.display = st === 3 ? 'none' : '';
  // שקופית קיימת רק בתוך אזור, ולכן הלשוניות הן של שלב 2 בלבד
  $('#viewseg').style.display = st === 2 ? '' : 'none';
  $('#tabs').style.display = st === 2 ? 'flex' : 'none';
  $('#build').style.display = st === 3 ? '' : 'none';
  $('#result').style.display = st === 3 ? '' : 'none';
}

function showOverview(){
  // שלב 1 הוא תמיד התוכנית. מתצוגת שקופית או מצגת חוזרים אליה —
  // אחרת השקופית נשארה על המסך בזמן סימון אזורים (נתפס 13.10).
  if(S.deckOn || PREV.on) setView('plan');
  areaReq++;                       // מבטל רינדור אזור שעדיין בדרך
  S.mode = 'areas'; S.picking = false; S.subDraw = null; S.lightDraw = null; S.view = null;
  cv.width = S.ovW; cv.height = S.ovH;
  img.onload = fitZoom;
  img.src = planUrl();
  $('#tabs').style.display = 'none';
  $('#modehint').className = '';
  cv.style.cursor = 'crosshair';
  markSteps();
  renderSide();
}
function planUrl(){
  const on = S.layers.filter(l=>l.on).map(l=>l.name);
  return '/api/plan.png?name='+encodeURIComponent(S.name)+
         '&layers='+encodeURIComponent(on.join(SEP))+
         '&styles='+encodeURIComponent(JSON.stringify(stylesPayload()))+'&t='+Date.now();
}
/* תיבת הזום של אזור. לתת-אזור זו תיבת החוסמת של הפוליגון, בפיקסלי
   הסקירה — כי שם מסומנים האזורים ושם `/api/area.png` מצפה לקבל. */
function subViewBox(a){
  const poly = a.poly || [];
  if(poly.length < 3) return [a.x0, a.y0, a.x1, a.y1];
  const v = poly.map(p => ovWorldToPx(p[0], p[1])).filter(Boolean);
  if(!v.length) return [a.x0, a.y0, a.x1, a.y1];
  const xs = v.map(q=>q[0]), ys = v.map(q=>q[1]), pad = 10;
  return [Math.min(...xs)-pad, Math.min(...ys)-pad,
          Math.max(...xs)+pad, Math.max(...ys)+pad];
}
/* קואורדינטות שרטוט -> פיקסלי הסקירה. הסקירה שומרת את שני הצדדים
   של המיפוי בכל גוף (`x,y` בפיקסלים ו-`wx,wy` בעולם), ולכן אפשר
   לגזור אותו מהם בלי להוסיף שדה לשרת. */
let _ovMap = null;
function ovWorldToPx(wx, wy){
  if(!_ovMap){
    const f = S.ovFixtures;
    if(f.length < 2) return null;
    let a0 = f[0], b0 = f[0];
    f.forEach(p => { if(p.wx < a0.wx) a0 = p; if(p.wx > b0.wx) b0 = p; });
    let c0 = f[0], d0 = f[0];
    f.forEach(p => { if(p.wy < c0.wy) c0 = p; if(p.wy > d0.wy) d0 = p; });
    if(b0.wx === a0.wx || d0.wy === c0.wy) return null;
    const sx = (b0.x - a0.x) / (b0.wx - a0.wx);
    const sy = (d0.y - c0.y) / (d0.wy - c0.wy);
    _ovMap = {sx, sy, x0: a0.x - a0.wx * sx, y0: c0.y - c0.wy * sy};
  }
  return [_ovMap.x0 + wx * _ovMap.sx, _ovMap.y0 + wy * _ovMap.sy];
}

let areaReq = 0;
async function showArea(i){
  if(i<0 || i>=S.areas.length) return;
  const req = ++areaReq;
  S.mode = 'work'; S.curArea = i; S.picking = false; S.subDraw = null; S.lightDraw = null;
  const a = S.areas[i];
  setStatus('מרנדר אזור…', '#ffd479');
  const on = S.layers.filter(l=>l.on).map(l=>l.name);
  // תת-אזור מזוום לפוליגון שלו ולא לתיבת האב — זה מה שהופך אותו
  // לתחום עבודה. תיבת האב נשמרת ומשמשת רק את שקופית הפתיחה.
  const bx = subViewBox(a);
  const q = `/api/area.png?name=${encodeURIComponent(S.name)}`+
            `&x0=${bx[0]}&y0=${bx[1]}&x1=${bx[2]}&y1=${bx[3]}`+
            `&layers=${encodeURIComponent(on.join(SEP))}`+
            `&styles=${encodeURIComponent(JSON.stringify(stylesPayload()))}`+
            // תת-אזור: השרת חותך את התוכנית לצורה, כמו בשקופית
            `&poly=${encodeURIComponent(JSON.stringify(a.poly || []))}`;
  try{
    const d = await fetch(q).then(r=>r.json());
    // המשתמש הספיק לעבור מצב או אזור — התשובה הזו כבר לא רלוונטית
    if(req !== areaReq || S.mode !== 'work') return;
    S.view = {w:d.width, h:d.height, fixtures:d.fixtures, window:d.window};
    cv.width = d.width; cv.height = d.height;
    img.onload = fitZoom;
    img.src = d.png;
    if(!a.slides || !a.slides.length){ a.slides = a.slides||[]; addSlide(i); }
    S.curSlide = 0;
    markSteps();
    cv.style.cursor = 'default';
    setStatus(`אזור "${a.name}" · ${cnt(d.fixtures.length, 'גופים')} בתצוגה`, '#5ecf8d');
    renderTabs(); renderSide();
  }catch(e){
    if(req === areaReq) setStatus('שגיאה ברינדור האזור: '+errText(e), '#ff6b6b');
  }
}
$('#toAreas').onclick = () => showOverview();
$('#toBank').onclick = () => bankOpen();
$('#zoombar').querySelectorAll('[data-view]').forEach(b =>
  b.onclick = () => setView(b.dataset.view));

$('#toWork').onclick = async () => {
  if(!S.areas.length){ setStatus('סמן אזור אחד לפחות', '#ffd479'); return; }
  // אישור אחד לכל טעינה — כדי שאיש לא יבנה 50 שקופיות ריקות בלי לשים לב
  if(S.noArch && !S.noArchOk && S.mode !== 'work'){
    const shown = S.layers.filter(l => l.on && l.role !== 'lighting').length;
    if(!await askYes('בשרטוט הזה אין רקע אדריכלי', [
        'בשרטוט הזה אין רקע אדריכלי' + (shown ? '' : ' (אף שכבת רקע לא מסומנת)') +
        '. השקופיות יראו רק גופי תאורה על שחור.',
        'מומלץ לבצע BIND לשרטוט באוטוקאד ולהעלות מחדש.'],
        'להמשיך בכל זאת', 'חזרה', true)) return;
    S.noArchOk = true;
  }
  if(S.mode === 'work'){ setView(S.workView || 'plan'); return; }
  // **מתחילים תמיד מהאזור הראשון** — סדר הסרגל הוא סדר המצגת. קודם
  // נפתח "האזור הנוכחי", שבשלב 1 הוא האחרון שסומן (גיא, 13.10).
  showArea(0);
};
$('#toDeck').onclick = () => {
  if(!deckSlides().length){ setStatus('אין עדיין שקופיות — צור אותן בשלב 2', '#ffd479'); return; }
  setView('deck'); showRecentDecks();
};

/* ═══ אזורים ושקופיות ═══ */
function bounds(a){
  return {x0:Math.min(a.x0,a.x1), x1:Math.max(a.x0,a.x1),
          y0:Math.min(a.y0,a.y1), y1:Math.max(a.y0,a.y1)};
}
/* גופי האזור. **תת-אזור מצטמצם לפוליגון שלו** — הוא תחום עבודה
   ולא סימון על שקופית, ולכן הצמצום חל על הכל: הספירות בסרגל,
   הנקודות על התוכנית, והמסגור בשקופית. */
function ovFixturesIn(a){
  const b = bounds(a), out = [];
  const poly = subRing(a.poly || []);
  S.ovFixtures.forEach((f,i)=>{
    if(f.x>=b.x0 && f.x<=b.x1 && f.y>=b.y0 && f.y<=b.y1 &&
       pointInPoly(poly, f.wx, f.wy)) out.push({...f, i});
  });
  return out;
}
/* ─── זהות אזור (D-037) ───────────────────────────────────────────
   תת-אזור היה מקושר לאביו **לפי שם**. בדיקת השמישות (13.10) מצאה
   שני אזורים בשם "אזור 3" (השם נגזר ממספר האזורים, לא ממה שפנוי),
   ושינוי שם בשלב 1 ניתק את תת-האזורים. עכשיו לכל אזור מזהה קבוע,
   הקישור לפי מזהה, ו-`parent` (השם) רק נגזר ממנו — לתצוגה ולשרת. */
function newAreaId(){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function areaById(id){ return S.areas.find(x => x.id === id) || null; }
function isChildOf(x, a){ return !!x.parentId && x.parentId === a.id; }
function syncParents(){
  S.areas.forEach(x => {
    if(!x.parentId) return;
    const p = areaById(x.parentId);
    if(p) x.parent = p.name;
  });
}
/* שם שאינו תפוס. "אזור N" לפי המספר הפנוי הראשון; שם שהוקלד ותפוס
   מקבל " (2)", " (3)"... */
function uniqueName(base, except){
  const taken = new Set(S.areas.filter(x => x !== except).map(x => x.name));
  if(!taken.has(base)) return base;
  for(let k = 2; ; k++){ const n = `${base} (${k})`; if(!taken.has(n)) return n; }
}
// מספור רץ (B-16): המספר הבא אחרי הגבוה ביותר שקיים, ולא החור הראשון —
// אחרת אחרי מחיקת "אזור 1" האזור החדש נקרא שוב "אזור 1" ומתבלבל עם הישן.
function nextAreaName(prefix){
  const re = new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' (\\d+)$');
  let max = 0;
  S.areas.forEach(x => { const m = re.exec(x.name); if(m) max = Math.max(max, +m[1]); });
  return prefix + ' ' + (max + 1);
}
/* פרויקט ישן: מזהים לכל אזור, וקישור תת-אזור לאביו לפי השם שהיה
   (האב הוא האזור הקודם בסרגל עם השם הזה — כך נבנה הסדר). */
function migrateAreas(){
  S.areas.forEach(x => { if(!x.id) x.id = newAreaId(); });
  ensureLocks(true);           // פרויקט שנטען — שום דבר לא זז (D-047)
  S.areas.forEach((x, i) => {
    if(x.parentId || !x.parent) return;
    for(let j = i - 1; j >= 0; j--){
      if(S.areas[j].name === x.parent && !S.areas[j].parentId){
        x.parentId = S.areas[j].id; break;
      }
    }
  });
}

function addArea(x0,y0,x1,y1,name,quiet){
  S.areas.push({id: newAreaId(), x0,y0,x1,y1,
                name: name ? uniqueName(name) : nextAreaName('אזור'), slides:[]});
  S.curArea = S.areas.length-1;
  if(!quiet){ hideUndo(); save(); }     // B-17: "בטל" של אזור שנמחק לא נשאר ליד אזור חדש
}
/* השם נגזר מהבחירות ולא מוקלד מראש. השקופית מתוארת במה שמואר בה,
   וכשהמתכנן משנה שכבה או סוג גוף — השם עוקב. ברגע שהוא מקליד
   משהו משלו, הגזירה נעצרת ולא דורסת אותו.
   הכותרות בייחוס הן שם קטגוריה בעברית ("חדר שינה | אפלייט"),
   ולכן מתרגמים קוד בלוק לשם כשהוא מוכר. */
function hebName(code){ return S.codeNames[String(code).toUpperCase()] || ''; }
// שם לעובד ליד קוד גוף (B-14): "שקועים (SH)"; קוד שאין לו שם — הקוד עצמו
function codeLabel(code){ const h = hebName(code); return h ? h + ' (' + code + ')' : String(code); }

function lightingLabel(a, sl){
  const lit = [...litIndices(a, sl)];
  if(!lit.length) return '';
  const byCode = {};
  const fx = ovFixturesIn(a);
  const idx = {}; fx.forEach(f => idx[f.i] = f);
  lit.forEach(i => { const f = idx[i]; if(f) byCode[f.code] = (byCode[f.code]||0)+1; });
  const codes = Object.entries(byCode).sort((p,q)=>q[1]-p[1]).map(c=>c[0]);
  if(!codes.length) return '';
  // **בכותרת רק שמות עבריים** (B-05). קוד בלי שם (zb, AURA) הוא מילה
  // של השרטוט, ולקוח שרואה "שקועים + zb" לא יודע מה זה. קוד כזה לא נכנס
  // לכותרת; הוא רק מוסיף "ועוד", כדי שלא יֵרָאה שאין בשקופית אלא מה שנכתב.
  // "נבחרו ידנית" הוא מידע לעובד ולא ללקוח, ולכן יושב בממשק ולא כאן.
  const known = [], unknown = [];
  codes.forEach(c => {
    const n = hebName(c);
    if(!n) unknown.push(c);
    else if(known.indexOf(n) < 0) known.push(n);
  });
  if(!known.length) return 'גופי תאורה';
  let label = known.slice(0,2).join(' + ');
  if(known.length > 2 || unknown.length) label += ' ועוד';
  return label;
}

/* חתימה של מה שמואר — שתי שקופיות עם אותה חתימה הן אופציות,
   ומקבלות "אופציה א/ב/ג" אוטומטית במקום שכפול שם מצטבר. */
function litSignature(a, sl){
  if(sl.mask) return 'mask';          // אינה מתחרה על "אופציה א/ב"
  if(sl.picks && sl.picks.length) return 'pick:' + [...sl.picks].sort((x,y)=>x-y).join(',');
  return 'lay:' + (sl.layers||[]).slice().sort().join(',') +
         '|cod:' + (sl.codes||[]).slice().sort().join(',');
}
const OPTION_LETTERS = ['א','ב','ג','ד','ה','ו','ז','ח'];

/* ─── ביטול מחיקה (D-037) ────────────────────────────────────────
   בדיקת השמישות: שקופית — ואזור עם 30 שקופיות — נמחקו בלחיצה אחת,
   בלי שאלה ובלי דרך חזרה. אזור עם שקופיות שואל לפני; כל מחיקה
   מציעה "בטל" למשך 15 שניות. */
const UNDO = {timer: null, fn: null};
function offerUndo(text, fn){
  clearTimeout(UNDO.timer);
  UNDO.fn = fn;
  const el = $('#undo');
  el.innerHTML = `<span>${text}</span><button class="primary" data-undo>בטל מחיקה</button>`;
  el.style.display = 'flex';
  el.querySelector('[data-undo]').onclick = () => {
    const f = UNDO.fn; hideUndo();
    if(f) f();
  };
  UNDO.timer = setTimeout(hideUndo, 15000);
}
function hideUndo(){ clearTimeout(UNDO.timer); UNDO.fn = null; const el = $('#undo'); if(el) el.style.display = 'none'; }

/* ─── שקופית מאושרת (D-034) ──────────────────────────────────────
   גיא: "אפשרות של סימון וי על שקופית שסיימתי... וכל עוד יש וי אי
   אפשר לשנות". במצגת של 40-50 שקופיות העובד צריך לראות מה גמור,
   ולא לשבור אותו בטעות. זו נעילה מפני טעות ולא הרשאה: לחיצה נוספת
   על ✓ פותחת, בלי שאלות.

   שינוי כללי (שכבות, עובי ובהירות, שם אזור) **חל גם על המאושרות**
   — מצגת אחת, מראה אחד — אבל שואלים לפני (גיא בחר את זה, 13.10). */
function isDone(sl){ return !!(sl && sl.done); }
function doneCount(){
  return S.areas.reduce((n, a) => n + (a.slides||[]).filter(isDone).length, 0);
}
function lockedMsg(){
  setStatus('השקופית מאושרת ✓ — בטל את ה-✓ כדי לערוך אותה', '#ffd479');
}
/* true = להמשיך. שואל רק כשיש שקופיות מאושרות שהשינוי יגע בהן. */
/* ─── הגדרות המצגת ──────────────────────────────────────────────
   מה שנקבע פעם אחת לכל המצגת, בתחילת העבודה (שלב 1) ואפשר לשנות
   לפני ההפקה (שלב 3). נשמר בפרויקט ולא בשקופית. בינתיים רק הפס
   מתחת לכותרת; צבע הרקע יצטרף כאן. */
function deckDefaults(){ return {rule: true, style: 'black'}; }
function deckRule(){ return !S.deck || S.deck.rule !== false; }
/* סגנון המצגת (D-050). אפור = כמו מצגת ייחוס ו: רקע E1E1E1, ריהוט לבן,
   נקודות זהובות. הערכים עצמם ב-knowledge/layout.yaml, לא כאן. */
function deckStyle(){ return (S.deck && S.deck.style) || 'black'; }
function deckPanel(){
  const st = deckStyle();
  return `<div class="deckset" style="margin:0 0 12px; padding:9px 11px;
      border:1px solid var(--line, #333); border-radius:8px">
    <div style="font-weight:600; margin-bottom:6px">הגדרות המצגת</div>
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:7px">
      <span>רקע:</span>
      <span class="seg">
        <button class="${st==='black'?'on':''}" data-deckstyle="black">⬛ שחור</button>
        <button class="${st==='grey'?'on':''}" data-deckstyle="grey">◻ אפור</button>
      </span></div>
    <label style="display:flex; gap:7px; align-items:center; cursor:pointer">
      <input type="checkbox" data-deckrule ${deckRule() ? 'checked' : ''}>
      פס מתחת לכותרת</label>
  </div>`;
}
function wireDeckPanel(){
  document.querySelectorAll('[data-deckstyle]').forEach(el => el.onclick = async () => {
    const v = el.dataset.deckstyle;
    if(v === deckStyle()) return;
    if(!await confirmGlobal('החלפת רקע המצגת')) return;
    S.deck = Object.assign(deckDefaults(), S.deck || {}, {style: v});
    save(); renderSide();
    if(PREV.on) previewLoad(true);
    if(S.deckOn) setView('deck');
  });
  document.querySelectorAll('[data-deckrule]').forEach(el => el.onchange = async () => {
    if(!await confirmGlobal(el.checked ? 'הוספת הפס מתחת לכותרת' : 'הסרת הפס מתחת לכותרת')){
      el.checked = !el.checked; return;
    }
    S.deck = Object.assign(deckDefaults(), S.deck || {}, {rule: el.checked});
    save();
    if(PREV.on) previewLoad(true);
    if(S.deckOn) setView('deck');
  });
}

async function confirmGlobal(what){
  const n = doneCount();
  if(!n) return true;
  return askYes('שינוי שמשפיע על שקופיות מאושרות',
    [`${what} ישפיע גם על ${cnt(n, 'שקופיות מאושרות', 'שקופית אחת מאושרת')}.`],
    'להמשיך', 'ביטול', true);
}
function toggleDone(a, sl){
  if(!sl.done){
    // הכותרת ננעלת כמו שהיא. אחרת שקופית אחות חדשה הייתה משנה לה
    // את "אופציה א/ב" — שינוי בשקופית שאושרה, בלי שאיש נגע בה.
    sl.wasAuto = !!sl.auto; sl.auto = false; sl.done = true;
  }else{
    sl.done = false;
    if(sl.wasAuto){ sl.auto = true; retitle(a); }
    delete sl.wasAuto;
  }
  save(); renderSide(); renderTabs();
  if(PREV.on) previewRender();
}

function retitle(a){
  // מריצים על כל האזור, כי הוספה או שינוי משפיעים על מספור האופציות
  const groups = {};
  a.slides.forEach(sl => {
    const sig = litSignature(a, sl);
    (groups[sig] = groups[sig] || []).push(sl);
  });
  a.slides.forEach(sl => {
    if(!sl.auto) return;
    // **שקופית הפתיחה אינה שקופית הארה.** היא התוכנית המלאה של
    // האב עם המסכה, ושמה הוא "אב | תת-אזור" — כמו מצגת ייחוס א 97
    // ("Basement | Living Areas"). תווית הארה ואות אופציה עליה
    // גרמו לגיא לא לזהות שנוצרה שקופית נפרדת בכלל.
    if(sl.mask){
      sl.title = [a.parent, a.name].filter(Boolean).join(' | ');
      return;
    }
    // אין הארה שממנה נגזר שם. העובד מקליד את מה שהשקופית מראה.
    if(sl.photosOnly){ sl.title = a.name + ' | תצלומים'; return; }
    // שקופית שעוד לא נבחר בה דבר אינה "אופציה" של אף אחת אחרת —
    // גם לא של שקופית ריקה שנייה (D-042)
    if(!litIndices(a, sl).size && !(sl.layers||[]).length && !(sl.codes||[]).length){
      sl.title = a.name + ' | שקופית חדשה';
      return;
    }
    const parts = [a.name];
    const lab = lightingLabel(a, sl);
    if(lab) parts.push(lab);
    const peers = groups[litSignature(a, sl)];
    if(peers.length > 1){
      const k = peers.indexOf(sl);
      parts.push('אופציה ' + (OPTION_LETTERS[k] || (k+1)));
    }
    if(sl.photoName) parts.push(sl.photoName);   // ירחיב כשיהיו תצלומים
    sl.title = parts.join(' | ');
  });
}

// הודעת שגיאה לעובד (B-11). כשהשרת כבוי הדפדפן זורק TypeError עם
// "Failed to fetch" באנגלית; מתרגמים אותו להוראה שאפשר לפעול לפיה.
// שגיאות שהשרת עצמו החזיר כבר בעברית ועוברות כמו שהן.
const NO_SERVER = 'השרת לא עונה — בדוק שהמחשב של המשרד דולק וחלון השרת פתוח';
function errText(e){
  const m = (e && e.message) ? String(e.message) : String(e || '');
  if((e && e.name === 'TypeError') || /failed to fetch|networkerror|load failed/i.test(m))
    return NO_SERVER;
  return m;
}
// מניעת לחיצה כפולה (B-10): פעולה שנייה תוך חצי שנייה נבלעת
let _lastTap = 0;
function tapOnce(){
  const t = Date.now();
  if(t - _lastTap < 600) return false;
  _lastTap = t; return true;
}
function addSlide(ai){
  const a = S.areas[ai];
  const byLayer = {};
  ovFixturesIn(a).forEach(f => byLayer[f.layer] = (byLayer[f.layer]||0)+1);
  const ranked = Object.entries(byLayer).sort((p,q)=>q[1]-p[1]).map(x=>x[0]);
  // שכבה שעדיין לא נוצלה באזור, אם יש. אחרת כל שקופית חדשה הייתה
  // נופלת על אותה שכבה גדולה ומקבלת בדיוק את אותו שם ואותה הארה.
  const used = new Set(a.slides.flatMap(s => s.layers||[]));
  // **כשכל השכבות נוצלו — שקופית בלי הארה, לא העתק** (D-042). קודם
  // נלקחה שוב השכבה הגדולה, השקופית יצאה זהה לקיימת, ושתיהן הפכו
  // ל"אופציה א/ב" — גם כשהעובד פתח אותה לחדר אחר. "שקופית חדשה" =
  // משהו חדש; אופציה לאותה הארה נעשית בשכפול (⧉).
  const pick = ranked.find(l => !used.has(l));
  a.slides.push({
    id: ++S.seq, title: '', auto: true,
    layers: pick ? [pick] : [],    // ברירת מחדל: כל השכבה מוארת
    codes: [], picks: [], photos: [], photoTags: [], photoRooms: [],
    geom: {},                      // פריסה ידנית; ריק = הפריסה שנמדדה
    mask: false,                   // שקופית פתיחה של תת-אזור
  });
  S.curSlide = a.slides.length-1;
  retitle(a);
  save();
}
function areaFixtureSet(){
  const a = S.areas[S.curArea];
  return a ? new Set(ovFixturesIn(a).map(f=>f.i)) : new Set();
}
function curSlideObj(){
  const a = S.areas[S.curArea];
  return (a && a.slides && a.slides[S.curSlide]) ? a.slides[S.curSlide] : null;
}
/* שלוש רמות, לפי סדר עדיפות: בחירה ידנית > בלוק > שכבה.
   שכבה שלא נבחרה = לא מואר. רשימה ריקה מדליקה כלום, לא הכל —
   אחרת כיבוי כל התיבות היה מדליק את כל האזור, וזה מבלבל. */
function litIndices(a, sl){
  if(sl.photosOnly) return new Set();          // תצלומים בלבד — אין הארה
  if(sl.picks && sl.picks.length) return new Set(sl.picks);
  const lay = new Set((sl.layers||[]).map(x=>x.toLowerCase()));
  if(!lay.size) return new Set();
  const cod = new Set((sl.codes||[]).map(x=>x.toUpperCase()));
  // הצמצום לתת-אזור כבר נעשה ב-`ovFixturesIn`, כמו בשרת
  return new Set(ovFixturesIn(a).filter(f =>
    lay.has(f.layer.toLowerCase()) &&
    (!cod.size || cod.has(f.code.toUpperCase()))).map(f=>f.i));
}

/* ═══ עכבר ═══ */
let start = null;
cv.onmousedown = e => {
  if(S.mode !== 'areas') return;
  start = toCanvas(e.clientX, e.clientY);
};
cv.onmousemove = e => {
  if(S.lightDraw){
    const p = toCanvas(e.clientX, e.clientY);
    S.lightDraw.hover = [p.x, p.y];

  if(S.subDraw){
    const p = toCanvas(e.clientX, e.clientY);
    const w = viewToWorld(p.x, p.y);
    if(w) S.subDraw.hover = S.subDraw.pts.length
      ? orthoNext(S.subDraw.pts[S.subDraw.pts.length-1], w) : w;
    render();
    return;
  }
  if(!start) return;
  const p = toCanvas(e.clientX, e.clientY);
  S.drag = {x0:start.x, y0:start.y, x1:p.x, y1:p.y};
  render();
};
cv.ondblclick = () => { if(S.subDraw) subCommit(); else if(S.lightDraw) lightCommit(); };
addEventListener('keydown', e => {

/* ─── פוליגון הדלקה · D-049 ───────────────────────────────────────
   הסטודיו: פוליגון "שלא באמת יסמן את האזור, אלא פשוט ידליק את כל הגופים
   בפוליגון". לא תת-אזור (D-023): התוכנית נשארת שלמה, ואין שקופית
   חדשה. **כלי בחירה חד-פעמי** (אפשרות א) — מה שבתוכו נכנס לבחירה
   הידנית של השקופית (D-019), והפוליגון עצמו לא נשמר. אחר כך ממשיכים
   לתקן בלחיצה על גופים, כמו תמיד. הצורה חופשית, בכל זווית — היא
   בוחרת גופים ולא מופיעה בשקופית, אין סיבה לאלץ זוויות ישרות.
   הנקודות בקואורדינטות התצוגה, כמו הגופים ב-`S.view` — הן לא
   נשמרות, ולכן אין צורך בקואורדינטות שרטוט. */
function inPoly(x, y, poly){
  let inside = false;
  for(let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi))
      inside = !inside;
  }
  return inside;
}
/* פס לינארי בפנים אם אחת מנקודותיו בפנים — פס שחוצה את הגבול שייך
   לחדר שבו רוב העובד מסמן, וקל יותר לכבות אחד מאשר לחפש אותו. */
function fixtureInPoly(f, poly){
  if(f.kind === 'line' && f.pts && f.pts.length)
    return f.pts.some(q => inPoly(q[0], q[1], poly));
  return inPoly(f.x, f.y, poly);
}
function lightCancel(){
  S.lightDraw = null; cv.style.cursor = 'default';
  setStatus('הפוליגון בוטל', '#ffd479');
  renderSide(); render();
}
/* מה עושים עם הגופים שבפנים — חלון של הכלי, כמו `askName`. */
function askLightAction(groups, n){
  return new Promise(resolve => {
    const box = $('#namebox');
    const typeBtns = groups.length > 1 ? groups.map((g, k) =>
      `<button class="ghost" data-lt="${k}">הדלק רק: ${g.name} (${g.ids.length})</button>`).join('') : '';
    box.innerHTML = `<div class="lb-card nb-card">
        <b class="lb-title">${cnt(n, 'גופים', 'גוף אחד')} בתוך הפוליגון</b>
        <div class="hint" style="margin:6px 0 10px">"הדלק הכל" ו"כבה" משנים רק את מה שבתוך הפוליגון.
          "הדלק רק" משאיר בשקופית דולק <b>רק</b> את הסוג הזה שבתוך הפוליגון.
          אחר כך אפשר להמשיך לתקן בלחיצה על גופים.</div>
        <div class="nb-btns" style="flex-wrap:wrap; gap:6px">
          <button class="primary" data-lall>הדלק הכל (${n})</button>
          ${typeBtns}
          <button class="ghost" data-loff>כבה הכל בפוליגון</button>
          <button class="ghost" data-lno>ביטול</button></div></div>`;
    box.style.display = 'flex';
    const done = v => { box.style.display = 'none'; box.innerHTML = ''; resolve(v); };
    box.querySelector('[data-lall]').onclick = () => done({on: true, k: -1});
    box.querySelector('[data-loff]').onclick = () => done({on: false, k: -1});
    box.querySelector('[data-lno]').onclick = () => done(null);
    box.querySelectorAll('[data-lt]').forEach(b =>
      b.onclick = () => done({on: true, k: +b.dataset.lt}));
    box.onmousedown = e => { if(e.target === box) done(null); };
    box.onkeydown = e => { if(e.key === 'Escape') done(null); };
    setTimeout(() => box.querySelector('[data-lall]').focus(), 0);
  });
}
async function lightCommit(){
  const pts = S.lightDraw ? S.lightDraw.pts : [];
  S.lightDraw = null; cv.style.cursor = 'default';
  const a = S.areas[S.curArea], sl = curSlideObj();
  if(!a || !sl || !S.view || pts.length < 3){
    setStatus('הפוליגון בוטל — צריך שלוש נקודות לפחות', '#ffd479');
    renderSide(); render(); return;
  }
  if(isDone(sl)){ lockedMsg(); renderSide(); render(); return; }
  const inArea = areaFixtureSet();
  const info = {}; ovFixturesIn(a).forEach(f => info[f.i] = f);
  const ids = S.view.fixtures.filter(f => inArea.has(f.i) && fixtureInPoly(f, pts))
                            .map(f => f.i);
  if(!ids.length){
    setStatus('אין גופים של האזור בתוך הפוליגון', '#ffd479');
    renderSide(); render(); return;
  }
  // קבוצות לפי סוג — אותו שם שמופיע בכותרת ובצמצום לסוג גוף
  const byType = {};
  ids.forEach(i => {
    const f = info[i]; const name = (f && (hebName(f.code) || f.code)) || '?';
    (byType[name] = byType[name] || []).push(i);
  });
  const groups = Object.entries(byType).map(([name, g]) => ({name, ids: g}))
                       .sort((p, q) => q.ids.length - p.ids.length);
  renderSide(); render();          // שורת ההנחיה של השרטוט נעלמת
  const act = await askLightAction(groups, ids.length);
  if(!act){ setStatus('הפוליגון בוטל', '#ffd479'); renderSide(); render(); return; }
  const use = act.k >= 0 ? groups[act.k].ids : ids;
  // מתחילים ממה שדולק עכשיו, כמו לחיצה על גוף בודד (D-019).
  // **"רק" פירושו רק** (נתפס בהדמיית עובד, 19.10): "הדלק רק: פס לינארי"
  // השאיר דולקים גם גופים שדלקו קודם. הסטודיו: "מואר רק הפסים הלינאריים
  // בסלון". לכן בבחירת סוג מתחילים מאפס, ואחריו דולק רק הסוג הזה.
  const before = new Set((sl.picks && sl.picks.length) ? sl.picks : litIndices(a, sl));
  const cur = act.k >= 0 ? new Set() : new Set(before);
  let changed = 0;
  use.forEach(i => {
    if(act.on && !cur.has(i)){ cur.add(i); if(!before.has(i)) changed++; }
    else if(!act.on && cur.has(i)){ cur.delete(i); changed++; }
  });
  if(act.k >= 0) changed += [...before].filter(i => !cur.has(i)).length;
  sl.picks = Array.from(cur);
  // בחירה ידנית ריקה פירושה "לפי השכבות" — והשכבות היו מדליקות הכל
  // מחדש. מי שכיבה את כל מה שדלק ביקש שקופית בלי הארה.
  if(!sl.picks.length){ sl.layers = []; sl.codes = []; }
  retitle(a); save(); renderSide(); render();
  setStatus(act.k >= 0 ? ('דולקים עכשיו רק ' + cnt(use.length, 'גופים', 'גוף אחד') +
              ' · ' + groups[act.k].name + ' · אפשר להמשיך לתקן בלחיצה') :
            (act.on ? 'הודלקו ' : 'כובו ') + cnt(changed, 'גופים', 'גוף אחד') +
            (act.k >= 0 ? ' (' + groups[act.k].name + ')' : '') + ' · אפשר להמשיך לתקן בלחיצה',
            '#5ecf8d');
}

/* סגירת הפוליגון יוצרת **תת-אזור בסרגל**, לא סימון על שקופית.

   כך מצגת ייחוס א עובד: שקופית 97 מציגה את התוכנית המלאה עם המסכה,
   ו-98 כבר חתוכה לגוש שסומן. תת-האזור הוא תחום עבודה שנשארים בו
   עד שעוברים הלאה — ולכן מקומו בסרגל, לצד האזורים.

   שקופית הפתיחה היא **הראשונה של תת-האזור** ולא של האב: עם שני
   תת-אזורים באותו אזור, שתי שקופיות פתיחה היו מצטברות בסוף האב
   ומתנתקות מהשקופיות שהן מציגות. */
async function subCommit(){
  const parent = S.areas[S.curArea];
  const pts = S.subDraw ? S.subDraw.pts : [];
  S.subDraw = null;
  cv.style.cursor = 'default';
  if(!parent || pts.length < 3){
    setStatus('הסימון בוטל — צריך שלוש פינות לפחות', '#ffd479');
    renderSide(); render(); return;
  }
  if(!parent.id) parent.id = newAreaId();
  const typed = ((await askName('שם תת-האזור', nextAreaName('תת-אזור'))) || '').trim();
  if(!typed){ setStatus('הסימון בוטל', '#ffd479'); renderSide(); render(); return; }
  const name = uniqueName(typed);

  const sub = {
    id: newAreaId(), parentId: parent.id,
    name: name, parent: parent.name,
    x0: parent.x0, y0: parent.y0, x1: parent.x1, y1: parent.y1,
    poly: pts, slides: [],
  };
  // אחרי אחיו, וכולם אחרי האב — סדר הסרגל הוא סדר המצגת
  let at = S.curArea + 1;
  while(at < S.areas.length && isChildOf(S.areas[at], parent)) at++;
  S.areas.splice(at, 0, sub);
  // שקופית הפתיחה: התוכנית המלאה של האב עם המסכה, בלי הארה
  sub.slides.push({id: ++S.seq, title: '', auto: true, mask: true,
                   layers: [], codes: [], picks: [], photos: [],
                   photoTags: [], photoRooms: [], geom: {}});
  save(); renderTabs();
  /* **נכנסים לתת-האזור מיד, ובו רק שקופית הפתיחה** (גיא, 12.10 —
     הופך את D-026, שיצר גם שקופית עבודה מעצמו). מכאן מוסיפים
     שקופיות כרגיל, ונשארים בתת-האזור עד שעוברים לאזור אחר. */
  showArea(at).then(() => {
    S.curSlide = 0; setView('plan'); renderSide();
    setStatus(`נכנסת לתת-האזור "${name}" · נוצרה שקופית פתיחה · ` +
              `הוסף שקופיות ב"+ שקופית חדשה"`, '#5ecf8d');
  });
}
function subCancel(){
  S.subDraw = null; cv.style.cursor = 'default';
  setStatus('הסימון בוטל', '#ffd479');
  renderSide(); render();
}

addEventListener('mouseup', () => {
  if(S.drag && Math.abs(S.drag.x1-S.drag.x0)>14 && Math.abs(S.drag.y1-S.drag.y0)>14){
    addArea(S.drag.x0,S.drag.y0,S.drag.x1,S.drag.y1);
    renderSide();
  }
  start = null; S.drag = null; render();
});
cv.onclick = e => {
  if(S.lightDraw && S.view){
    const p = toCanvas(e.clientX, e.clientY);
    const pts = S.lightDraw.pts;
    if(pts.length >= 3 &&
       Math.hypot(pts[0][0]-p.x, pts[0][1]-p.y) < 12 / Math.max(S.zoom,.2)){
      lightCommit(); return;
    }
    pts.push([p.x, p.y]);
    S.lightDraw.hover = null;
    render(); renderSide();
    return;
  }
  if(S.subDraw && S.view){
    const p = toCanvas(e.clientX, e.clientY);
    const w = viewToWorld(p.x, p.y);
    if(!w) return;
    const pts = S.subDraw.pts;
    // לחיצה על הנקודה הראשונה סוגרת. הסף בפיקסלים ולא ביחידות
    // שרטוט, כי הוא מתאר כמה קל לפגוע בה על המסך.
    if(pts.length >= 3){
      const f = worldToView(pts[0][0], pts[0][1]);
      if(f && Math.hypot(f[0]-p.x, f[1]-p.y) < 12 / Math.max(S.zoom,.2)){
        subCommit(); return;
      }
    }
    pts.push(pts.length ? orthoNext(pts[pts.length-1], w) : w);
    S.subDraw.hover = null;
    render(); renderSide();
    return;
  }
  if(S.mode !== 'work' || !S.picking || !S.view) return;
  if(isDone(curSlideObj())){ lockedMsg(); return; }
  const p = toCanvas(e.clientX, e.clientY);
  // רק גופים שבתוך האזור. חלון התצוגה מורחב ליחס ממדים וסופח
  // גופים מקומות שכנות — הם הקשר ויזואלי, לא חלק מהאזור.
  const inArea = areaFixtureSet();
  let best = -1, bd = Math.pow(14/Math.max(S.zoom,.2), 2);
  // מרחק מנקודה לקטע — פס נבחר בלחיצה בכל מקום לאורכו, לא רק
  // במרכזו. בלי זה פס באורך 1425 יחידות כמעט לא ניתן ללחיצה.
  const segDist2 = (ax,ay,bx,by,px,py) => {
    const dx = bx-ax, dy = by-ay, L = dx*dx + dy*dy;
    const t = L ? Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / L)) : 0;
    const qx = ax + t*dx, qy = ay + t*dy;
    return (px-qx)*(px-qx) + (py-qy)*(py-qy);
  };
  S.view.fixtures.forEach(f => {
    if(!inArea.has(f.i)) return;
    let d;
    if(f.kind === 'line' && f.pts && f.pts.length > 1){
      d = Infinity;
      for(let k = 1; k < f.pts.length; k++)
        d = Math.min(d, segDist2(f.pts[k-1][0], f.pts[k-1][1],
                                 f.pts[k][0], f.pts[k][1], p.x, p.y));
    }else{
      d = Math.pow(f.x-p.x,2) + Math.pow(f.y-p.y,2);
    }
    if(d < bd){ bd = d; best = f.i; }
  });
  if(best < 0) return;
  const a = S.areas[S.curArea], sl = curSlideObj(); if(!sl) return;
  if(!sl.picks || !sl.picks.length) sl.picks = Array.from(litIndices(a, sl));
  const at = sl.picks.indexOf(best);
  if(at >= 0) sl.picks.splice(at,1); else sl.picks.push(best);
  retitle(a);
  save(); renderSide();
};

function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(S.mode === 'areas'){
    S.ovFixtures.forEach(f=>{
      ctx.fillStyle='rgba(240,235,97,.8)';
      ctx.beginPath(); ctx.arc(f.x,f.y,1.7,0,7); ctx.fill();
    });
    S.areas.forEach((a,i)=>{
      const c = COLORS[i%COLORS.length], b = bounds(a);
      ctx.strokeStyle=c; ctx.lineWidth = i===S.curArea?2.5:1.4;
      ctx.setLineDash(i===S.curArea?[]:[5,4]);
      ctx.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
      ctx.setLineDash([]);
      ctx.fillStyle = c+'14'; ctx.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
      ctx.fillStyle=c; ctx.font='600 13px Assistant, Arial'; ctx.textAlign='right';
      ctx.fillText(a.name, b.x1-6, b.y0+17);
    });
    if(S.drag){
      ctx.strokeStyle='#fff'; ctx.setLineDash([4,4]); ctx.lineWidth=1.2;
      ctx.strokeRect(Math.min(S.drag.x0,S.drag.x1), Math.min(S.drag.y0,S.drag.y1),
        Math.abs(S.drag.x1-S.drag.x0), Math.abs(S.drag.y1-S.drag.y0));
      ctx.setLineDash([]);
    }
    return;
  }
  if(!S.view) return;
  const a = S.areas[S.curArea], sl = curSlideObj();
  const lit = sl ? litIndices(a, sl) : new Set();
  const inArea = areaFixtureSet();

  // ── תת-אזור ──
  // אותו צבע ואותה שקיפות שנצרבים לפאנל (knowledge/layout.yaml):
  // 30% מעל #F0D557. הסימון כאן אינו הדמיה של הסימון — הוא אותו דבר.
  const drawRing = pts => {
    const v = pts.map(p => worldToView(p[0], p[1])).filter(Boolean);
    if(v.length < 2) return null;
    ctx.beginPath();
    ctx.moveTo(v[0][0], v[0][1]);
    v.slice(1).forEach(q => ctx.lineTo(q[0], q[1]));
    return v;
  };
  // הפוליגון שייך לאזור. התוכנית כבר חתוכה אליו בשרת, ולכן כאן רק
  // קו גבול דק — מילוי צהוב על כל משטח העבודה הסתיר את השרטוט.
  const committed = subRing((a && a.poly) || []);
  if(committed.length >= 3 && drawRing(committed)){
    ctx.closePath();
    ctx.strokeStyle = 'rgba(240,213,87,.55)';
    ctx.lineWidth = 1.5 / Math.max(S.zoom, .2); ctx.stroke();
  }
  if(S.subDraw && S.subDraw.pts.length){
    const live = S.subDraw.hover
      ? S.subDraw.pts.concat([S.subDraw.hover]) : S.subDraw.pts;
    const v = drawRing(live);
    if(v){
      ctx.strokeStyle = '#f0d557'; ctx.lineWidth = 2 / Math.max(S.zoom, .2);
      ctx.setLineDash([7, 5]); ctx.stroke(); ctx.setLineDash([]);
      if(live.length >= 3){
        ctx.closePath(); ctx.fillStyle = 'rgba(240,213,87,.18)'; ctx.fill();
      }
      // הנקודה הראשונה מודגשת — לחיצה עליה סוגרת את הטבעת
      const r = 6 / Math.max(S.zoom, .2);
      ctx.fillStyle = '#f0d557';
      ctx.beginPath(); ctx.arc(v[0][0], v[0][1], r, 0, 7); ctx.fill();
    }
  }

  // פוליגון הדלקה — תכלת, כדי שלא יתבלבל עם תת-אזור הצהוב
  if(S.lightDraw && S.lightDraw.pts.length){
    const live = S.lightDraw.hover
      ? S.lightDraw.pts.concat([S.lightDraw.hover]) : S.lightDraw.pts;
    ctx.beginPath(); ctx.moveTo(live[0][0], live[0][1]);
    live.slice(1).forEach(q => ctx.lineTo(q[0], q[1]));
    ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 2 / Math.max(S.zoom, .2);
    ctx.setLineDash([7, 5]); ctx.stroke(); ctx.setLineDash([]);
    if(live.length >= 3){
      ctx.closePath(); ctx.fillStyle = 'rgba(127,212,255,.14)'; ctx.fill();
    }
    const r = 6 / Math.max(S.zoom, .2);
    ctx.fillStyle = '#7fd4ff';
    ctx.beginPath(); ctx.arc(live[0][0], live[0][1], r, 0, 7); ctx.fill();
  }

  /* **לא כל גוף הוא נקודה** (D-024). פס לינארי מצויר כפס לכל אורכו
     וגוף מנופח כעיגול בגודלו, כי זה מה שהם בשרטוט וזה מה שייצא
     בשקופית. נקודה בודדת במרכז פס באורך 1425 יחידות אינה אומרת
     לעובד דבר על מה הוא מדליק. */
  const strokeRun = (f, w) => {
    ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(f.pts[0][0], f.pts[0][1]);
    f.pts.slice(1).forEach(q => ctx.lineTo(q[0], q[1]));
    ctx.stroke();
  };
  // בתת-אזור גם הגופים נחתכים לצורה — פס שמרכזו בפנים היה נמתח
  // החוצה אל השחור.
  ctx.save();
  if(committed.length >= 3 && drawRing(committed)){ ctx.closePath(); ctx.clip(); }
  S.view.fixtures.forEach(f=>{
    const line = f.kind === 'line' && f.pts && f.pts.length > 1;
    const disc = f.kind === 'circle' && f.r > 0;
    if(!inArea.has(f.i)){
      // בתת-אזור התוכנית חתוכה לצורה, וגופים מחוצה לה היו מרחפים
      // על השחור. רואים רק את מה ששרטטנו (גיא, 12.10).
      if(committed.length >= 3) return;
      // הקשר בלבד — שייך לקומה שכנה, אינו לחיץ
      if(line){ ctx.strokeStyle = 'rgba(120,120,130,.18)'; strokeRun(f, 2); return; }
      ctx.fillStyle = 'rgba(120,120,130,.18)';
      ctx.beginPath(); ctx.arc(f.x, f.y, disc ? Math.max(f.r,1.6) : 1.6, 0, 7); ctx.fill();
      return;
    }
    const on = lit.has(f.i);
    const col = on ? '#f0eb61' : 'rgba(160,160,170,.55)';
    if(line){
      ctx.strokeStyle = col; strokeRun(f, on ? 4 : 2.2);
      if(on){ ctx.strokeStyle = 'rgba(240,235,97,.35)'; strokeRun(f, 11); }
      return;
    }
    ctx.fillStyle = col;
    const r = disc ? Math.max(f.r, on ? 4 : 2.4) : (on ? 4 : 2.4);
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();
    if(on){
      ctx.strokeStyle='rgba(240,235,97,.5)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(f.x, f.y, r + 4, 0, 7); ctx.stroke();
    }
  });
  ctx.restore();
}

/* ═══ סרגל אזורים ═══ */
/* שם האזור ניתן לעריכה גם באמצע העבודה. מישהו מהצוות טועה, או
   שהעובד מחליט לשנות אחרי שראה את השקופיות — ואין סיבה לחזור
   לשלב 1 בשביל זה. */
async function renameArea(i){
  const a = S.areas[i];
  const name = await askName('שם האזור', a.name);
  if(name === null) return;
  const t = name.trim();
  if(!t) return;
  // שם האזור הוא חלק מהכותרת של כל שקופית בו — גם של המאושרות
  if(t !== a.name && (a.slides||[]).some(isDone) &&
     !await askYes('שינוי שם האזור', ['שינוי השם ישנה את הכותרות של השקופיות המאושרות באזור.'], 'להמשיך', 'ביטול', true)) return;
  // תת-האזורים מצביעים על האב בשמו — שינוי שם חייב לגרור אותם,
  // אחרת הם מתייתמים והקינון בסרגל נשבר.
  const u = uniqueName(t, a);
  if(u !== t) setStatus(`כבר יש אזור בשם "${t}" — נקרא "${u}"`, '#ffd479');
  a.name = u;
  syncParents();
  S.areas.forEach(x => { if(isChildOf(x, a) || x === a) retitle(x); });
  save(); renderTabs(); renderSide();
}

/* ─── תצוגת השקופית ──────────────────────────────────────────────

   גיא: "הייתי רוצה שישר כשבוחרים תמונה זה יראה את השקופית. בנוסף
   לא יכולתי לערוך אותה וגם לא יכולתי לצאת."

   שלושת הדברים הם אותה טעות: בניתי אותה כחלון שמכסה את המסך.
   חלון כזה חוסם את סרגל העריכה בדיוק כשצריך אותו, ומחייב לצאת
   ולחזור על כל שינוי.

   עכשיו זו **תצוגה של הבמה**, לצד התוכנית. סרגל העריכה נשאר פתוח,
   כל שינוי — תצלום, שכבה, כותרת, פריסה — מרענן אותה מיד, ואין מה
   לסגור: מחליפים חזרה ל"תוכנית".

   התמונה עצמה מגיעה מהשרת ומצוירת באותה גיאומטריה שמייצרת את
   ה-PPTX, ולכן היא לא יכולה להראות משהו אחר ממה שייצא. */

const PREV = {on:false, busy:false, err:'', seq:0, timer:null, sig:'',
              scene:null, panel:'', panelKey:'', panelSize:null, panelRot:0,
              sel:null, k:1, drag:null};

/* נקודת גופן אחת בקואורדינטות הקנבס. השקופית היא 7.5 אינץ' = 540
   נקודות לגובה, והקנבס 1125 פיקסלים. אותה המרה שהייצוא עושה. */
const PT_PX = 1125 / 540;

function slidePayload(a, sl){
  return {
    drawing: S.name,
    layers: S.layers.filter(l=>l.on).map(l=>l.name),
    layer_styles: stylesPayload(),
    title_rule: deckRule(),
    deck_style: deckStyle(),
    area: {name:a.name, x0:a.x0, y0:a.y0, x1:a.x1, y1:a.y1, slides:[],
           poly: a.poly || [], parent: a.parent || '',
           plan_lock: lockPayload(a),
           parent_box: a.parent ? [a.x0, a.y0, a.x1, a.y1] : []},
    slide: {title: sl.title||'', layers_lit: sl.layers||[],
            codes: sl.codes||[], picks: sl.picks||[],
            photos: sl.photos||[], geom: sl.geom || {},
            mask: !!sl.mask,
            photos_only: !!sl.photosOnly,
            plan_free: !!sl.planFree,
            glow: sl.glow || {},
            type: (sl.layers||[])[0] || ''},
    wide: (sl.wide === undefined || sl.wide === null) ? -1 : (sl.wide ? 1 : 0),
  };
}

function setView(v){
  PREV.on = (v === 'slide');
  const deck = (v === 'deck');
  S.deckOn = deck;
  if(!deck) S.workView = v;          // לאן חוזרים משלב 3
  $('#wrap').style.display = (PREV.on || deck) ? 'none' : '';
  $('#pvstage').style.display = PREV.on ? 'flex' : 'none';
  $('#deckstage').style.display = deck ? 'block' : 'none';
  // זום שייך לתוכנית בלבד. בשתי התצוגות האחרות הוא חסר משמעות.
  ['zout','zval','zin','zfit'].forEach(id => {
    const el = $('#' + id); if(el) el.style.display = (PREV.on||deck) ? 'none' : '';
  });
  $('#zoombar').querySelectorAll('[data-view]').forEach(b =>
    b.classList.toggle('on', b.dataset.view === v));
  markSteps();
  renderSide();
  if(deck) deckOpen();
  else if(PREV.on) previewLoad();
  else previewRender();
}

/* ─── תצוגת המצגת ────────────────────────────────────────────────

   גיא: "אין לי דרך להסתכל בצורה נוחה על כל מה שכבר הכנתי, או
   חזרה אחורה לשקופית שעשיתי מקודם."

   כל השקופיות, בסדר שבו הן ייוצאו, כתמונות אמיתיות. לחיצה קופצת
   לשקופית. התמונות מגיעות מ-`/api/preview.png` — **אותו מסלול
   שמרכיב את השקופית בשרת**, ולכן הן לא יכולות להראות משהו אחר
   ממה שייצא.

   נטענות אחת-אחת ולא במקביל: כל שקופית עולה רינדור הארה, ועשרים
   בקשות בבת אחת היו חונקות שרת מקומי. */

const DECK = {seq: 0, checkSeq: 0, cache: {}};

function deckCountText(){
  const n = deckSlides().length, d = doneCount();
  return d ? `✓ ${d} מתוך ${n} מאושרות` : 'אף שקופית עוד לא אושרה';
}

function deckSlides(){
  const out = [];
  S.areas.forEach((a, ai) => (a.slides||[]).forEach((sl, si) =>
    out.push({a, ai, sl, si})));
  return out;
}

function deckOpen(){
  const box = $('#deckstage');
  const rows = deckSlides();
  if(!rows.length){
    box.innerHTML = '<div class="empty" style="padding:40px">אין עדיין שקופיות</div>';
    return;
  }
  box.innerHTML = `<div class="dk-head">
      <b>${cnt(rows.length, 'שקופיות')}</b> · <span class="dk-ok" data-dkcount>${deckCountText()}</span>
      <span class="dk-stop" data-dkstop></span>
      <span class="dk-gap" data-dkgap></span>
      · בסדר שבו הן ייוצאו · לחץ כדי לקפוץ
      <span style="flex:1"></span>
      <button class="ghost" data-dkreload>רענן הכל</button></div>
    <div class="dk-grid">${rows.map((r, i) => `
      <div class="dk-card ${r.ai===S.curArea && r.si===S.curSlide ? 'cur':''} ${isDone(r.sl)?'ok':''}"
           data-dk="${i}">
        <div class="dk-img" data-dki="${i}"><span class="hint">ממתין…</span></div>
