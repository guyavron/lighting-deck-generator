        <div class="dk-cap"><span class="n">${i+1}</span>
          <span data-dkt="${i}">${r.sl.title || '(ללא כותרת)'}</span>
          <button class="dk-tick ${isDone(r.sl)?'on':''}" data-dkok="${i}"
                  title="${isDone(r.sl)?'מאושרת — לחץ לביטול':'סמן כגמורה'}">✓</button></div>
        <div class="dk-sub">${r.a.parent ? '▨ ' : ''}${r.a.name}${
          r.sl.mask ? ' · שקופית פתיחה' : ''}<span class="dk-nophoto" data-dkn="${i}"
          style="display:none">בלי תצלום</span></div>
        <div class="dk-block" data-dkb="${i}" style="display:none"></div>
        <div class="dk-far" data-dkf="${i}" style="display:none"></div>
      </div>`).join('')}</div>`;
  /* ✓ מהיר בשלב 3 (גיא, 13.10) — בלי להיכנס לכל שקופית. הלחיצה
     אינה קופצת לשקופית, ולא טוענים מחדש את כל התמונות. */
  box.querySelectorAll('[data-dkok]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const i = +b.dataset.dkok, r = rows[i];
    toggleDone(r.a, r.sl);
    b.classList.toggle('on', isDone(r.sl));
    b.title = isDone(r.sl) ? 'מאושרת — לחץ לביטול' : 'סמן כגמורה';
    b.closest('.dk-card').classList.toggle('ok', isDone(r.sl));
    const t = box.querySelector(`[data-dkt="${i}"]`);
    if(t) t.textContent = r.sl.title || '(ללא כותרת)';
    const c = box.querySelector('[data-dkcount]');
    if(c) c.textContent = deckCountText();
    deckCheck(rows);                 // ✓ על שקופית בלי תצלום מוריד אותה מהרשימה
  });
  box.querySelectorAll('[data-dk]').forEach(el => el.onclick = () => {
    const r = rows[+el.dataset.dk];
    jumpToSlide(r.ai, r.si);
  });
  const rl = box.querySelector('[data-dkreload]');
  if(rl) rl.onclick = () => { DECK.cache = {}; deckOpen(); };
  deckCheck(rows);
  deckFill(rows, ++DECK.seq);
}

/* פותח שקופית בשלב 2, בתצוגת שקופית — מכרטיס בשלב 3 או משורה
   ברשימת מה שחסר אחרי ההפקה. */
function jumpToSlide(ai, si){
  const go = () => { S.curSlide = si; renderSide(); setView('slide'); };
  if(S.curArea !== ai || S.mode !== 'work') showArea(ai).then(go);
  else go();
}

/* "בלי תצלום" על הכרטיסים, לפני ההפקה. השרת מחליט ולא הדפדפן:
   שקופית בלי תצלום שנבחר עדיין מקבלת את ברירת המחדל של הקטגוריה,
   ורק השרת יודע אם יש כזו. שקופית פתיחה ושקופית מאושרת — לא נספרות. */
async function deckCheck(rows){
  const my = ++DECK.checkSeq;
  let d;
  try{
    const r = await fetch('/api/deck_check', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(buildPayload())});
    if(!r.ok) return;
    d = await r.json();
  }catch(e){ return; }
  if(my !== DECK.checkSeq || !S.deckOn) return;
  const miss = new Set((d.no_photo || []).map(x => x.area + ':' + x.slide));
  // שקופית שלא תצא במצגת (D-045) — אותו כלל שההפקה מדלגת לפיו
  const stop = {};
  (d.blocked || []).forEach(x => stop[x.area + ':' + x.slide] = x.reason);
  rows.forEach((r, i) => {
    const k = r.ai + ':' + r.si;
    const el = document.querySelector(`[data-dkn="${i}"]`);
    if(el) el.style.display = miss.has(k) ? '' : 'none';
    const bl = document.querySelector(`[data-dkb="${i}"]`);
    if(bl){
      bl.style.display = stop[k] ? '' : 'none';
      bl.textContent = stop[k] ? 'לא תצא במצגת — ' + stop[k] : '';
    }
    const card = document.querySelector(`[data-dk="${i}"]`);
    if(card) card.classList.toggle('blocked', !!stop[k]);
  });
  // גוף רחוק שהמסגור השאיר מחוץ לתמונה (B-02)
  const farBy = {};
  (d.far || []).forEach(x => farBy[x.area + ':' + x.slide] = x.count);
  rows.forEach((r, i) => {
    const fe = document.querySelector(`[data-dkf="${i}"]`);
    if(!fe) return;
    const n = farBy[r.ai + ':' + r.si];
    fe.style.display = n ? '' : 'none';
    fe.textContent = !n ? '' :
      (n === 1 ? 'גוף אחד חורג מהאזור שגזרת ונחתך בקצה' :
                 n + ' גופים חורגים מהאזור שגזרת ונחתכים בקצה') +
      ' — הגדל את האזור בשלב 1 כדי שייראו במלואם.';
  });
  const nb = Object.keys(stop).length;
  const g = document.querySelector('[data-dkgap]');
  if(g) g.textContent = !miss.size ? '' :
    `· ${cnt(miss.size, 'שקופיות')} בלי תצלום`;
  const s = document.querySelector('[data-dkstop]');
  if(s) s.textContent = !nb ? '' :
    '· ' + cnt(nb, 'שקופיות לא ייצאו במצגת', 'שקופית אחת לא תצא במצגת');
}

async function deckFill(rows, my){
  for(let i = 0; i < rows.length; i++){
    if(my !== DECK.seq) return;                 // עברו לתצוגה אחרת
    const r = rows[i];
    const body = JSON.stringify(slidePayload(r.a, r.sl));
    const slot = document.querySelector(`[data-dki="${i}"]`);
    if(!slot) return;
    if(DECK.cache[body]){ slot.innerHTML = `<img src="${DECK.cache[body]}">`; continue; }
    slot.innerHTML = '<span class="hint">מרכיב…</span>';
    try{
      const res = await fetch('/api/preview.png', {method:'POST',
        headers:{'Content-Type':'application/json'}, body});
      if(!res.ok) throw new Error((await res.json()).detail || 'נכשל');
      const url = URL.createObjectURL(await res.blob());
      DECK.cache[body] = url;
      if(my !== DECK.seq) return;
      const again = document.querySelector(`[data-dki="${i}"]`);
      if(again) again.innerHTML = `<img src="${url}">`;
    }catch(e){
      const again = document.querySelector(`[data-dki="${i}"]`);
      if(again) again.innerHTML = `<span class="hint" style="color:var(--warn)">${errText(e)}</span>`;
    }
  }
}

/* מרענן אחרי כל שינוי, בהשהיה קצרה — בחירת תצלום, שכבה, כותרת.
   בלי זה היה צריך לצאת ולחזור כדי לראות מה השתנה.

   **גם כשהתצוגה סגורה.** הרינדור הראשון של אזור עולה כמה שניות
   (השרת מריץ מחדש את ההקלטה כולה), ולכן הוא נעשה מראש בזמן
   שהעובד עוד בוחר. כשהוא עובר לשקופית — היא כבר שם. */
function previewTouch(){
  if(S.mode !== 'work' || S.curArea < 0 || !curSlideObj()) return;
  clearTimeout(PREV.timer);
  PREV.timer = setTimeout(previewLoad, 220);
}

function previewLoad(force){
  const a = S.areas[S.curArea], sl = curSlideObj();
  if(!a || !sl){ PREV.err = 'בחר שקופית'; PREV.scene = null;
                 previewRender(); return; }
  const p = slidePayload(a, sl);
  const body = JSON.stringify(p);
  // `renderSide` רץ על כל הקלדה ועל כל לחיצה. בלי חתימה, אותה
  // שקופית בדיוק הייתה נשלחת שוב ושוב לשרת.
  if(!force && body === PREV.sig && PREV.scene && !PREV.busy){
    previewRender(); return;
  }
  PREV.sig = body;
  const my = ++PREV.seq;
  PREV.busy = true; PREV.err = '';
  previewRender();
  // הפאנל שכבר בידנו לא נשלח שוב. הזזת תצלום אינה משנה בו פיקסל,
  // ולכן היא עולה תשובת JSON קטנה ולא תמונה.
  fetch('/api/slide', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({have_panel: PREV.panelKey}, p))})
    .then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(
      new Error(j.detail || 'התצוגה נכשלה'))))
    .then(d => {
      if(my !== PREV.seq) return;      // תשובה מאוחרת לא דורסת חדשה
      if(!d.reuse && d.panel){
        PREV.panel = d.panel;
        PREV.panelSize = d.panel_size || null;
        // הסיבוב שהפאנל שבידנו כבר מגלם. `_scene` מסובב את הרסטר
        // עצמו, ולכן התמונה שהגיעה כבר מסובבת.
        PREV.panelRot = planSrc(S.areas[S.curArea], curSlideObj()).rot;
      }
      PREV.panelKey = d.panel_key;
      PREV.scene = d;
      PREV.busy = false;
      previewRender();
    })
    .catch(e => {
      if(my !== PREV.seq) return;
      PREV.busy = false; PREV.err = errText(e); PREV.sig = '';
      previewRender();
    });
}

/* ─── הרכבת השקופית בדפדפן ────────────────────────────────────────

   גיא: "למה אני לא יכול להזיז את השרטוט ואת התמונה ולסדר כמו שאני
   רוצה?" תמונה מוכנה מהשרת אינה ניתנת לגרירה, ולכן השרת שולח את
   פאנל התוכנית המואר ואת **המספרים**, והשקופית מורכבת כאן.

   כל המספרים בקואורדינטות השקופית (2000x1125) — אותן שהשרת חישב
   ב-`slide.resolve` ואותן שהייצוא מקבל. הדפדפן אינו מחשב פריסה
   לבדו: מה שהעובד גורר נרשם כדריסה ונשלח בחזרה, והשרת מחזיר את
   הפריסה המלאה. אחרת היו שוב שני חישובים שיכולים להיפרד. */

function previewRender(){
  const host = $('#pvstage');
  if(!host || !PREV.on) return;
  const a = S.areas[S.curArea], sl = curSlideObj();
  const src = planSrc(a, sl);
  const wide = src.wide;
  const n = sl ? (sl.photos||[]).length : 0;
  const locked = planLocked(a, sl);
  // "אפס פריסה" נוגע רק במה ששייך לשקופית. בשקופית נעולה התוכנית
  // שייכת לאזור, ולכן היא אינה נחשבת "סודרה כאן".
  const moved = sl && sl.geom && ((!locked && (sl.geom.plan || sl.geom.rot)) ||
                sl.geom.title || (sl.geom.photos||[]).some(Boolean));
  const rot = src.rot;
  const pt = titlePt(sl);

  if(!host.querySelector('.pv-inner')){
    host.innerHTML = '<div class="pv-inner"><div class="pv-stage" id="pvbox">' +
                     '<div class="pv-canvas" id="pvcanvas"></div></div>' +
                     '<div class="pv-foot" id="pvfoot"></div></div>';
  }
  // הרגל נבנה מחדש בכל רענון, וזה הורג את שדה הכותרת באמצע הקלדה:
  // `renderSide` רץ על כל תו ומגיע לכאן. שומרים את הסמן ומחזירים.
  const wasTitle = document.activeElement &&
                   document.activeElement.id === 'pvtitle';
  const caret = wasTitle ? document.activeElement.selectionStart : 0;
  $('#pvfoot').innerHTML = `
      <span class="hint">${a ? a.name : ''} · שקופית ${S.curSlide+1}
        ${a ? 'מתוך ' + a.slides.length : ''}</span>
      <button class="ghost" data-pvprev>‹</button>
      <button class="ghost" data-pvnext>›</button>
      <input class="tt" id="pvtitle" type="text" placeholder="נגזר מהבחירות"
             value="${(sl && sl.title || '').replace(/"/g,'&quot;')}">
      <span class="seg">
        <button data-pvpt="-1" title="הקטן כותרת">א−</button>
        <button data-pvpt="1" title="הגדל כותרת">א+</button>
      </span>
      <span class="hint">${pt.toFixed(pt % 1 ? 1 : 0)}pt</span>
      ${sl && sl.photosOnly ? '' : `<span class="seg">
        <button class="${wide===undefined||wide===null?'on':''}" data-pvwide="auto">אוטומטי</button>
        <button class="${wide===false?'on':''}" data-pvwide="0">צרה</button>
        <button class="${wide===true?'on':''}" data-pvwide="1">רחבה</button>
      </span>
      <button class="ghost" data-pvspin title="סובב את התוכנית ב-90&#176;">
        ⟳ סובב תוכנית${rot ? ' · ' + rot + '&#176;' : ''}</button>`}
      ${lockFoot(a, sl)}
      ${glowFoot(sl)}
      ${n>1 ? '<button class="ghost" data-pvrot>החלף סדר תצלומים</button>' : ''}
      ${sl && sl.geom && sl.geom.title && Object.keys(sl.geom.title).length ?
        '<button class="ghost" data-pvtreset title="הכותרת חוזרת למקומה ולגודלה המקוריים. הטקסט נשאר">↺ אפס כותרת</button>' : ''}
      ${moved ? '<button class="ghost" data-pvreset>אפס פריסה</button>' : ''}
      <span style="flex:1"></span>
      <span class="hint">${PREV.busy ? 'מעדכן…' : PREV.err ? '' :
        'גרור להזזה · פינות לשינוי גודל · לחיצה כפולה על הכותרת עורכת אותה'}</span>
      ${PREV.busy ? '<span class="hint" style="color:var(--glow-y)">מרנדר תוכנית — 5 שניות. הכותרת והתצלומים ניתנים לעריכה בינתיים.</span>' : ''}`;
  drawScene();
  wirePreview();
  if(wasTitle){
    const ti = $('#pvtitle');
    if(ti){ ti.focus(); try{ ti.setSelectionRange(caret, caret); }catch(e){} }
  }
}

function titlePt(sl){
  const ov = sl && sl.geom && sl.geom.title;
  if(ov && ov.pt) return ov.pt;
  if(PREV.scene && PREV.scene.title) return PREV.scene.title.sizes[0];
  return 14;
}

function pendingSwap(sl){
  if(!PREV.busy || PREV.panelRot === undefined) return false;
  const now = planSrc(S.areas[S.curArea], sl).rot;
  const d = ((now - PREV.panelRot) % 360 + 360) % 360;
  return d === 90 || d === 270;
}

function sameRatio(a, b){
  return Math.abs((a[2] / a[3]) / (b[2] / b[3]) - 1) <= 0.02;
}

/* התיבות שמצוירות כרגע. הדריסה גוברת, ואחרת מה שהשרת חישב. */
function sceneRects(){
  const sc = PREV.scene, sl = curSlideObj();
  if(!sc || !sl) return null;
  const ov = sl.geom || {};
  const ovp = ov.photos || [];
  const planOv = planSrc(S.areas[S.curArea], sl).plan;
  return {
    // דריסה ביחס שאינו של הרסטר אינה מצוירת — השרת כבר תיקן אותה
    // (`slide._locked_plan`) והתיבה שלו היא מה שייצא.
    plan: !sc.plan ? null : (function(){
      // רבע סיבוב שעוד בדרך מהשרת: התיבה האוטומטית הישנה מסובבת
      // סביב מרכזה, וזה היחס שהדריסה נמדדת מולו.
      let auto = sc.plan, ref = sc.auto_plan;
      if(pendingSwap(sl)){
        const [x, y, w, h] = sc.plan;
        auto = [x + w/2 - h/2, y + h/2 - w/2, h, w];
        ref = [0, 0, sc.auto_plan[3], sc.auto_plan[2]];
      }
      return (planOv && sameRatio(planOv, ref) ? planOv : auto).slice();
    })(),
    photos: (sc.photos || []).map((b,i) => (ovp[i] || b || null)),
    title: (function(){
      const t = sc.title.box.slice();
      const o = ov.title || {};
      if(o.x !== undefined) t[0] = o.x;
      if(o.y !== undefined) t[1] = o.y;
      if(o.w !== undefined) t[2] = o.w;
      t[3] = titlePt(sl) * 1.2 * PT_PX + 6;
      return t;
    })(),
  };
}

function drawScene(){
  const box = $('#pvbox'), cv = $('#pvcanvas');
  if(!box || !cv) return;
  // בנייה מחדש באמצע הקלדה בכותרת מוחקת את מה שנכתב יחד עם הסמן
  if(cv.querySelector('[data-editing]')) return;
  box.querySelectorAll('.empty').forEach(e => e.remove());
  const sc = PREV.scene, sl = curSlideObj();
  if(!sc || !sl){
    cv.style.display = 'none';
    box.insertAdjacentHTML('beforeend',
      `<div class="empty">${PREV.err || 'מרכיב שקופית…'}</div>`);
    return;
  }
  cv.style.display = '';
  PREV.k = box.clientWidth / sc.canvas[0];
  cv.style.transform = 'scale(' + PREV.k + ')';

  const r = sceneRects();
  const rotNow = planSrc(S.areas[S.curArea], sl).rot;
  const stale = PREV.busy && PREV.panelRot !== undefined &&
                PREV.panelRot !== rotNow;
  // התוכנית היא מסגרת ובתוכה התמונה. המסגרת היא התיבה האמיתית
  // תמיד — גם כשהתמונה שבתוכה מסובבת זמנית — ולכן גרירה, ידיות
  // ושמירה קוראות ממנה מספרים נכונים. קודם התמונה המסובבת עצמה
  // הייתה הרכיב, ו-left/top שלה היו מרכז ולא פינה: הידיות נפלו
  // במקום הלא נכון, וגרירה באמצע הרינדור שמרה תיבה ביחס שגוי.
  // שקופית תצלומים בלבד: אין תוכנית לצייר (D-035)
  let h = !r.plan ? '' : `<div class="pv-el pick" data-el="plan" style="overflow:hidden">` +
          `<img src="${PREV.panel}" alt="" draggable="false"></div>`;
  // ריבוע מאחורי תצלום מוצר — רק בסגנון שמגדיר אותו (D-050)
  (sc.frames || []).forEach((fb, i) => {
    if(!fb || !(sc.cards || [])[i] || !(sc.look || {}).card) return;
    h += `<div class="pv-el" data-el="card${i}" style="background:${sc.look.card};
      left:${fb[0]}px; top:${fb[1]}px; width:${fb[2]}px; height:${fb[3]}px"></div>`;
  });
  (sc.photo_ids || []).forEach((id,i) => {
    if(!r.photos[i]) return;
    h += `<img class="pv-el pick" data-el="ph${i}" alt=""
               src="/api/photos/img?id=${encodeURIComponent(id)}">`;
  });
  // פס כבוי בהגדרות המצגת — השרת מחזיר null, ואין מה לצייר
  const look = sc.look || {};
  if(sc.rule) h += `<div class="pv-el" data-el="rule" style="background:${look.rule || '#e0e0e0'}"></div>`;
  h += `<div class="pv-el pick pv-title" data-el="title"><span></span></div>`;
  h += `<div id="pvguides"></div>`;
  cv.innerHTML = h;
  cv.style.background = look.background || '#000';

  const planEl = cv.querySelector('[data-el="plan"]');
  const planImg = planEl && planEl.querySelector('img');
  if(planEl) place(planEl, r.plan);
  if(planEl && stale && PREV.panelSize){
    /* **רבע סיבוב לוקח 5.2 שניות** — זו הרצת ההקלטה של ה-DXF
       מחדש, נמדד. עד שהיא חוזרת, מתיחת הפאנל הישן לתיבה החדשה
       הפכה תוכנית 1212x350 לרצועה 253x878: מטושטשת ומעוותת.
       במקום זה מסובבים את התמונה שכבר בידנו — סיבוב אמיתי של
       הפאנל האמיתי, רק ממודגם מחדש — ומחליפים כשהחדה מגיעה. */
    // אחוזים ולא פיקסלים: התמונה גדלה עם המסגרת גם תוך כדי גרירה.
    const delta = ((rotNow - PREV.panelRot) % 360 + 360) % 360;
    const swap = (delta === 90 || delta === 270);
    const W = r.plan[2], H = r.plan[3];
    Object.assign(planImg.style, {
      position: 'absolute', left: '50%', top: '50%',
      width: (swap ? H / W * 100 : 100) + '%',
      height: (swap ? W / H * 100 : 100) + '%',
      transform: `translate(-50%,-50%) rotate(${delta}deg)`,
      opacity: '.55'});
  }
  r.photos.forEach((b,i) => {
    const el = cv.querySelector('[data-el="ph' + i + '"]');
    if(el && b) place(el, b);
  });
  place(cv.querySelector('[data-el="rule"]'), sc.rule);

  const t = cv.querySelector('[data-el="title"]');
  place(t, r.title);
  const pt = titlePt(sl);
  const text = (sl.title || '').split('|').map(x=>x.trim())
                 .filter(Boolean).join(' | ');
  const heb = /[֐-׿]/.test(text);
  // הצד נקבע בשרת לפי שפת הכותרת (`slide.title_is_rtl`) — אותו צד
  // שייכתב במצגת. עברית מימין, אנגלית משמאל.
  t.style.textAlign = (sc.title && sc.title.rtl === false) ? 'left' : 'right';
  t.style.color = (sc.look && sc.look.title) || '#fff';
  t.style.fontFamily = "'" + (sc.font || 'Assistant Light') +
                       "','Assistant',Arial,sans-serif";
  t.style.fontWeight = '300';
  t.style.fontSize = (pt * PT_PX) + 'px';
  t.style.lineHeight = '1.2';
  t.style.direction = heb ? 'rtl' : 'ltr';
  t.querySelector('span').textContent = text;

  if(PREV.sel) markSelected();
  wireScene();
}

function place(el, b){
  if(!el || !b) return;
  el.style.left = b[0] + 'px'; el.style.top = b[1] + 'px';
  el.style.width = b[2] + 'px'; el.style.height = b[3] + 'px';
}

function markSelected(){
  const cv = $('#pvcanvas'); if(!cv) return;
  cv.querySelectorAll('.pv-el').forEach(e => e.classList.remove('sel'));
  cv.querySelectorAll('.pv-h').forEach(e => e.remove());
  const el = PREV.sel && cv.querySelector('[data-el="' + PREV.sel + '"]');
  if(!el) return;
  el.classList.add('sel');
  // הידיות יושבות על הקנבס ולא בתוך הרכיב — רכיב <img> אינו מכיל
  // ילדים, וידית בתוך תמונה פשוט לא תוצג.
  const b = [parseFloat(el.style.left), parseFloat(el.style.top),
             parseFloat(el.style.width), parseFloat(el.style.height)];
  [['nw',0,0],['ne',1,0],['sw',0,1],['se',1,1]].forEach(([k,fx,fy]) => {
    const d = document.createElement('div');
    d.className = 'pv-h ' + k; d.dataset.h = k;
    d.style.left = (b[0] + fx*b[2] - 13) + 'px';
    d.style.top  = (b[1] + fy*b[3] - 13) + 'px';
    // **הידית מחווטת כאן, ברגע שהיא נוצרת.** קודם החיווט היה רק
    // ב-`wireScene`, שרץ בציור מחדש של השקופית — ידיות שנוצרו
    // בלחיצה לא הגיבו עד הציור הבא. גיא: "אי אפשר לשנות את הממדים
    // ... זה עובד רק לאחר זמן או לאחר שמזיזים".
    d.onpointerdown = ev => {
      if(ev.button || !PREV.sel) return;
      ev.stopPropagation();
      beginDrag(ev, PREV.sel, k);
    };
    cv.appendChild(d);
  });
}

/* ─── גרירה ושינוי גודל ───────────────────────────────────────────
   יחס הממדים נעול תמיד. תוכנית מתוחה היא בדיוק הבאג שהתצוגה
   הזו נבנתה כדי למנוע, ותצלום מתוח גרוע לא פחות. */

function rectOf(name){
  const el = $('#pvcanvas').querySelector('[data-el="' + name + '"]');
  return el ? [parseFloat(el.style.left), parseFloat(el.style.top),
               parseFloat(el.style.width), parseFloat(el.style.height)] : null;
}

/* ─── נעילת התוכנית לאזור · D-047 ────────────────────────────────
   הסטודיו: "התוכנית תינעל על המיקום והגודל שבחרתי בשקף הראשון, כדי
   למנוע קפיצות בין שקופיות בהצגה ללקוח." המיקום, הגודל, הסיבוב
   וה-wide שייכים לאזור (`a.planLock`), וכל שקופית בו מקבלת אותם —
   חוץ משקופית ששוחררה ("רק כאן", `sl.planFree`), שקופית פתיחה של
   תת-אזור (תוכנית אחרת) ותצלומים-בלבד (אין תוכנית). השרת מחיל את
   זה (`server._plan_layout`), והדפדפן רק מראה ושואל. */
function wideToLock(w){ return (w === undefined || w === null) ? -1 : (w ? 1 : 0); }
function wideFromLock(v){ return v === 1 ? true : v === 0 ? false : undefined; }
function canLock(sl){ return !!sl && !sl.mask && !sl.photosOnly; }
function planLocked(a, sl){ return !!(a && a.planLock && canLock(sl) && !sl.planFree); }
function planSrc(a, sl){
  if(planLocked(a, sl)){
    const L = a.planLock;
    return {plan: L.plan, rot: L.rot || 0, wide: wideFromLock(L.wide), align: L.align || 'left'};
  }
  const g = (sl && sl.geom) || {};
  return {plan: g.plan, rot: g.rot || 0, wide: sl ? sl.wide : undefined, align: 'left'};
}
function lockPayload(a){
  ensureLocks();
  const L = a.planLock || {};
  const out = {align: L.align || 'left', wide: L.wide === undefined ? -1 : L.wide};
  if(L.plan) out.plan = L.plan;
  if(L.rot) out.rot = L.rot;
  return out;
}
/* אזור בלי נעילה — חדש, או מפרויקט שנשמר לפני D-047. הנעילה נלקחת
   מהשקופית הראשונה, ושקופית שסודרה אחרת ממנה **נשארת משוחררת**
   עם הסידור שלה (גיא, 18.10): שום דבר שמישהו סידר לא זז מעצמו. */
function ensureLocks(existing){
  S.areas.forEach(a => {
    if(a.planLock) return;
    const f = (a.slides || []).find(canLock);
    const g = (f && f.geom) || {};
    const L = {align: 'left', wide: wideToLock(f && f.wide)};
    if(g.plan) L.plan = g.plan.slice();
    if(g.rot) L.rot = g.rot;
    a.planLock = L;
    (a.slides || []).forEach(sl => {
      if(!canLock(sl)) return;
      /* **פרויקט קיים: שקופית בלי תצלום נשארת משוחררת** — גם הראשונה.
         לפני הנעילה תוכנית בלי תצלום נפרשה על כל רוחב השקופית, ובנעילה
         היא הייתה מתכווצת. נתפס בבדיקה על פרויקט אמיתי (19.10): 4
         שקופיות מאושרות היו מתכווצות מ-1840 ל-1212. משוחררת = בדיוק
         כמו קודם. באזור חדש (`existing` לא דלוק) זה לא חל — שקופית
         חדשה עוד ריקה מתצלומים, והיא אמורה להינעל. */
      if(existing && !(sl.photos || []).length){ sl.planFree = true; return; }
      if(sl === f) return;
      const h = sl.geom || {};
      if(JSON.stringify(h.plan || null) !== JSON.stringify(L.plan || null) ||
         (h.rot || 0) !== (L.rot || 0) || wideToLock(sl.wide) !== L.wide)
        sl.planFree = true;
    });
  });
}
function areaDoneCount(a){ return (a.slides || []).filter(x => canLock(x) && !x.planFree && isDone(x)).length; }

/* "רק כאן, או בכל האזור?" — חלון של הכלי, כמו `askName`. */
function askScope(nDone, title, hint){
  return new Promise(resolve => {
    const box = $('#namebox');
    box.innerHTML = `<div class="lb-card nb-card">
        <b class="lb-title">${title || 'להזיז את התוכנית רק בשקופית הזו, או בכל האזור?'}</b>
        <div class="hint" style="margin:6px 0 10px">${nDone ?
          'בכל האזור ישפיע גם על ' + cnt(nDone, 'שקופיות מאושרות', 'שקופית אחת מאושרת') + '.' :
          (hint || 'שקופית שמוזזת רק כאן משתחררת מהנעילה, ואפשר להחזיר אותה בכל רגע.')}</div>
        <div class="nb-btns"><button class="primary" data-sarea>בכל האזור</button>
          <button class="ghost" data-shere>רק כאן</button>
          <button class="ghost" data-sno>ביטול</button></div></div>`;
    box.style.display = 'flex';
    const done = v => { box.style.display = 'none'; box.innerHTML = ''; resolve(v); };
    box.querySelector('[data-sarea]').onclick = () => done('area');
    box.querySelector('[data-shere]').onclick = () => done('here');
    box.querySelector('[data-sno]').onclick = () => done(null);
    box.onmousedown = e => { if(e.target === box) done(null); };
    box.onkeydown = e => { if(e.key === 'Escape') done(null); };
    setTimeout(() => box.querySelector('[data-sarea]').focus(), 0);
  });
}

/* כל שינוי בתוכנית עובר כאן. `mutate` מקבל עותק {plan, rot, wide,
   align} ומשנה אותו; שם השינוי נוחת נקבע לפי ההיקף שנבחר. */
async function planEdit(a, sl, mutate){
  if(!a || !sl) return;
  const cur = planSrc(a, sl);
  const t = {plan: cur.plan ? cur.plan.slice() : undefined, rot: cur.rot,
             wide: cur.wide, align: cur.align};
  mutate(t);
  let scope = 'here';
  if(planLocked(a, sl)){
    scope = await askScope(areaDoneCount(a));
    if(!scope){ previewRender(); return; }       // ביטול — התוכנית חוזרת
  }
  if(scope === 'area'){
    const L = {align: t.align || 'left', wide: wideToLock(t.wide)};
    if(t.plan) L.plan = t.plan;
    if(t.rot) L.rot = t.rot;
    a.planLock = L;
  }else{
    // "רק כאן" או שקופית שכבר משוחררת/מחוץ לנעילה
    if(planLocked(a, sl)) sl.planFree = true;
    sl.geom = sl.geom || {};
    if(t.plan) sl.geom.plan = t.plan; else delete sl.geom.plan;
    if(t.rot) sl.geom.rot = t.rot; else delete sl.geom.rot;
    sl.wide = t.wide;
  }
  save(); renderSide(); previewLoad(true);
}

/* ─── הזוהר של השקופית · D-051 ────────────────────────────────────
   צבע, גודל ועוצמה — רק מה שנמדד ודרגות קבועות (knowledge/glow.yaml,
   `per_slide`). אחרי שינוי מציעים להחיל על כל שקופיות האזור. */
function glowFoot(sl){
  const sc = PREV.scene;
  if(!sl || sl.photosOnly || sl.mask || !sc || !sc.glow_options) return '';
  const o = sc.glow_options, g = sl.glow || {};
  const cur = (g.color || sc.glow_default || '').toUpperCase();
  const sw = (o.colors || []).map(c => `<button class="glow-sw ${c.color.toUpperCase()===cur?'on':''}"
      data-glowc="${c.color}" title="${c.name}" aria-label="${c.name}" style="background:${c.color}"></button>`).join('');
  const seg = (key, vals) => '<span class="seg">' + Object.entries(vals || {}).map(([k, v]) =>
      `<button class="${(g[key] || 'normal')===k?'on':''}" data-glow${key}="${k}">${v.he}</button>`).join('') + '</span>';
  const touched = g.color || (g.size && g.size !== 'normal') || (g.power && g.power !== 'normal');
  return `<span class="glowfoot" style="display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap">
      <span class="hint">זוהר:</span>${sw}
      <span class="hint">גודל</span>${seg('size', o.sizes)}
      <span class="hint">עוצמה</span>${seg('power', o.power)}
      ${touched ? '<button class="ghost" data-glowreset title="חזרה לזוהר של הסגנון">↺</button>' : ''}</span>`;
}
async function glowEdit(a, sl, patch){
  if(!a || !sl) return;
  if(isDone(sl)){ lockedMsg(); return; }
  const next = Object.assign({}, sl.glow || {}, patch);
  Object.keys(next).forEach(k => { if(!next[k] || next[k] === 'normal') delete next[k]; });
  sl.glow = next;
  save(); previewLoad(true);
  // הצעה להחיל על כל האזור — רק כשיש בו עוד שקופיות עם הארה
  const others = (a.slides || []).filter(x => x !== sl && canLock(x));
  if(!others.length) return;
  const nDone = others.filter(isDone).length;
  const scope = await askScope(nDone, 'להחיל את הזוהר הזה גם על שאר שקופיות האזור?',
    'כל שקופית באזור תקבל אותו צבע, גודל ועוצמה. אפשר לשנות כל אחת אחר כך.');
  if(scope !== 'area') return;
  others.forEach(x => { x.glow = Object.assign({}, next); });
  save(); renderSide();
  setStatus('הזוהר הוחל על ' + cnt(others.length + 1, 'שקופיות') + ' באזור', '#5ecf8d');
}

function lockFoot(a, sl){
  if(!a || !canLock(sl) || !a.planLock) return '';
  if(sl.planFree)
    return `<span class="hint" title="התוכנית בשקופית הזו לא עוקבת אחרי האזור">🔓 משוחררת</span>
      <button class="ghost" data-pvrelock>↺ החזר למקום הנעול</button>`;
  const al = (a.planLock.align || 'left');
  return `<span class="hint" title="מיקום, גודל וסיבוב התוכנית משותפים לכל שקופיות האזור">🔒 נעולה לאזור</span>
    <span class="seg">
      <button class="${al==='left'?'on':''}" data-pvalign="left" title="צמוד לפינה השמאלית העליונה">שמאלה</button>
      <button class="${al==='center'?'on':''}" data-pvalign="center" title="באמצע החלק השמאלי של השקופית">מרכז</button>
    </span>`;
}

function setOverride(sl, name, b){
  sl.geom = sl.geom || {};
  if(name === 'plan') sl.geom.plan = b.map(Math.round);
  else if(name === 'title'){
    const cur = sl.geom.title || {};
    sl.geom.title = Object.assign({}, cur,
      {x: Math.round(b[0]), y: Math.round(b[1]), w: Math.round(b[2])});
  } else {
    const i = +name.slice(2);
    const n = (PREV.scene.photos || []).length;
    sl.geom.photos = sl.geom.photos || [];
    while(sl.geom.photos.length < n) sl.geom.photos.push(null);
    sl.geom.photos[i] = b.map(Math.round);
  }
}

/* קווי העזר: קצוות השקופית שנמדדו, ושולי הרכיבים האחרים. */
function guidesFor(name){
  const sc = PREV.scene, r = sceneRects();
  const ap = sc.auto_plan;
  // קווי העזר של הפס נשארים גם כשהוא כבוי: אלה השוליים שנמדדו (4%-96%)
  const rl = sc.rule || sc.rule_guide;
  const gx = [rl[0], rl[0] + rl[2], sc.canvas[0]/2];
  const gy = [rl[1], rl[1] + rl[3], sc.canvas[1]/2];
  if(ap){ gx.push(ap[0]); gy.push(ap[1], ap[1] + ap[3]); }
  const others = [];
  if(name !== 'plan' && r.plan) others.push(r.plan);
  r.photos.forEach((b,i) => { if(b && name !== 'ph'+i) others.push(b); });
  if(name !== 'title') others.push(r.title);
  others.forEach(b => { gx.push(b[0], b[0]+b[2]); gy.push(b[1], b[1]+b[3]); });
  return {x: gx, y: gy};
}

function snap(name, b){
  const g = guidesFor(name), TOL = 9, hit = [];
  const tryAxis = (vals, cands, idx) => {
    let best = null;
    cands.forEach(([off, v]) => vals.forEach(t => {
      const d = Math.abs(v - t);
      if(d <= TOL && (!best || d < best.d)) best = {d, t, off};
    }));
    if(best){ b[idx] = best.t - best.off; hit.push([idx, best.t]); }
  };
  tryAxis(g.x, [[0, b[0]], [b[2], b[0]+b[2]], [b[2]/2, b[0]+b[2]/2]], 0);
  tryAxis(g.y, [[0, b[1]], [b[3], b[1]+b[3]], [b[3]/2, b[1]+b[3]/2]], 1);
  return hit;
}

function showGuides(hits){
  const box = $('#pvguides'); if(!box) return;
  const sc = PREV.scene;
  box.innerHTML = hits.map(([idx, t]) => idx === 0
    ? `<div class="pv-guide" style="left:${t}px;top:0;width:2px;height:${sc.canvas[1]}px"></div>`
    : `<div class="pv-guide" style="top:${t}px;left:0;height:2px;width:${sc.canvas[0]}px"></div>`
  ).join('');
}

function beginDrag(ev, name, mode){
  const sl = curSlideObj(); if(!sl || !PREV.scene) return;
  ev.preventDefault();
  const r0 = rectOf(name); if(!r0) return;
  const el = $('#pvcanvas').querySelector('[data-el="' + name + '"]');
  const sx = ev.clientX, sy = ev.clientY;
  const pt0 = titlePt(sl);
  delete el.dataset.pt;
  const tip = document.createElement('div');
  tip.className = 'pv-tip'; $('#pvcanvas').appendChild(tip);
  PREV.drag = true;

  /* **לחיצה אינה גרירה.** בלי סף תזוזה, עצם הבחירה של רכיב הייתה
     מריצה את ההצמדה לקווי העזר ומזיזה אותו בכמה פיקסלים — הרכיב
     "קפץ" מעצמו, ונקבע כדריסה בלי שאיש הזיז אותו. הסף גם מאפשר
     ללחוץ לחיצה כפולה על הכותרת בלי להזיז אותה. */
  const THRESH = 3;
  let moved = false;

  const onMove = e => {
    if(!moved){
      if(Math.abs(e.clientX - sx) < THRESH && Math.abs(e.clientY - sy) < THRESH)
        return;
      moved = true;
    }
    const dx = (e.clientX - sx) / PREV.k, dy = (e.clientY - sy) / PREV.k;
    let b = r0.slice(), hits = [];
    if(mode === 'move'){
      b[0] = r0[0] + dx; b[1] = r0[1] + dy;
      hits = snap(name, b);
      // רכיב שנגרר לגמרי אל מחוץ לשקופית נעלם, והעובד נשאר בלי
      // דרך לתפוס אותו בחזרה. משאירים תמיד פיסה אחוזה.
      const KEEP = 60, cw = PREV.scene.canvas[0], ch = PREV.scene.canvas[1];
      b[0] = Math.min(cw - KEEP, Math.max(KEEP - b[2], b[0]));
      b[1] = Math.min(ch - KEEP, Math.max(KEEP - b[3], b[1]));
    }else{
      // שינוי גודל אחיד סביב הפינה הנגדית — היחס נשמר תמיד
      const sw = 1 + (mode.includes('e') ? dx : -dx) / r0[2];
      const sh = 1 + (mode.includes('s') ? dy : -dy) / r0[3];
      const k = Math.max(0.08, (sw + sh) / 2);
      b[2] = Math.max(30, r0[2] * k); b[3] = Math.max(20, r0[3] * k);
      b[0] = mode.includes('w') ? r0[0] + r0[2] - b[2] : r0[0];
      b[1] = mode.includes('n') ? r0[1] + r0[3] - b[3] : r0[1];
      if(name === 'title'){
        const pt = Math.min(60, Math.max(6, pt0 * (b[2] / r0[2])));
        el.style.fontSize = (pt * PT_PX) + 'px';
        b[3] = pt * 1.2 * PT_PX + 6;
        el.dataset.pt = pt;
      }
    }
    place(el, b);
    showGuides(hits);
    tip.textContent = Math.round(b[2]) + ' × ' + Math.round(b[3]) +
                      '  ·  ' + Math.round(b[0]) + ', ' + Math.round(b[1]);
    tip.style.left = Math.min(b[0], PREV.scene.canvas[0] - 260) + 'px';
    tip.style.top = Math.max(0, b[1] - 34) + 'px';
    markSelected();
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    tip.remove(); showGuides([]);
    PREV.drag = false;
    if(!moved) return;                 // נבחר בלבד, לא סודר
    const b = rectOf(name);
    if(name === 'title' && el.dataset.pt){
      const sl2 = curSlideObj();
      sl2.geom = sl2.geom || {};
      sl2.geom.title = Object.assign({}, sl2.geom.title || {},
                                     {pt: +(+el.dataset.pt).toFixed(1)});
    }
    if(name === 'plan'){
      planEdit(S.areas[S.curArea], curSlideObj(), t => { t.plan = b.map(Math.round); });
      return;
    }
    setOverride(curSlideObj(), name, b);
    save();
    // סבב אחד לשרת: התיבות של מה שלא נגררה עשויות לזרום מחדש
    // (תצלומים נגזרים מהתוכנית). הפאנל לא נשלח שוב.
    previewLoad(true);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* ─── עריכת הכותרת על השקופית ──────────────────────────────────
   גיא: "לא היה אפשר לערוך את המלל של הכותרת."
   השדה ברגל השקופית עבד, אבל הוא לא המקום שבו מחפשים אותו —
   מי שרואה כותרת על שקופית לוחץ עליה. לחיצה כפולה פותחת אותה
   לעריכה **במקומה**, בגודל ובגופן שבהם היא תודפס. */

function editTitle(el){
  const sl = curSlideObj(); if(!sl) return;
  const span = el.querySelector('span');
  el.dataset.editing = '1';
  el.classList.add('sel');
  span.contentEditable = 'true';
  span.spellcheck = false;
  span.focus();
  const rng = document.createRange();
  rng.selectNodeContents(span);
  const selc = window.getSelection();
  selc.removeAllRanges(); selc.addRange(rng);

  const before = sl.title;
  const stop = commit => {
    if(!el.dataset.editing) return;
    delete el.dataset.editing;
    span.contentEditable = 'false';
    const sl2 = curSlideObj();
    if(sl2){
      const t = commit ? span.textContent.trim() : before;
      sl2.title = t;
      // ריקון מחזיר לשם האוטומטי — אותו כלל כמו בשדות האחרים
      sl2.auto = (t === '');
      if(sl2.auto) retitle(S.areas[S.curArea]);
      save();
    }
    previewLoad(true);
  };
  span.onblur = () => stop(true);
  span.onkeydown = e => {
    e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); span.blur(); }
    else if(e.key === 'Escape'){ span.textContent = before; span.blur(); }
  };
  // הטקסט משתנה מול העיניים, ולכן אין צורך לצייר אותו מחדש —
  // אבל המצב חייב להתעדכן, אחרת רענון באמצע עריכה יאבד אותו.
  span.oninput = () => {
    const sl2 = curSlideObj();
    if(sl2){ sl2.title = span.textContent.trim(); sl2.auto = false; }
  };
}

function wireScene(){
  const cv = $('#pvcanvas'); if(!cv) return;
  if(isDone(curSlideObj())){
    // מאושרת: אין גרירה, אין ידיות, אין עריכת כותרת
    cv.querySelectorAll('.pv-el.pick').forEach(el => {
      el.style.cursor = 'not-allowed';
      el.onpointerdown = ev => { ev.preventDefault(); lockedMsg(); };
    });
    PREV.sel = null;
    return;
  }
  cv.querySelectorAll('.pv-el.pick').forEach(el => {
    el.onpointerdown = ev => {
      if(ev.button || el.dataset.editing) return;
      PREV.sel = el.dataset.el; markSelected();
      beginDrag(ev, el.dataset.el, 'move');
    };
  });
  const t = cv.querySelector('[data-el="title"]');
  if(t) t.ondblclick = ev => { ev.preventDefault(); editTitle(t); };
  const box = $('#pvbox');
  box.onpointerdown = ev => {
    if(ev.target === box || ev.target === cv){ PREV.sel = null; markSelected(); }
  };
}

function wirePreview(){
  const box = $('#pvfoot');
  if(!box) return;
  if(isDone(curSlideObj())){
    // ניווט בין שקופיות עדיין עובד; כל השאר נעול
    box.querySelectorAll('button:not([data-pvprev]):not([data-pvnext]), input')
       .forEach(el => { el.disabled = true; el.title = 'השקופית מאושרת'; });
  }
  box.querySelectorAll('[data-pvwide]').forEach(b => b.onclick = () => {
    const sl = curSlideObj(); if(!sl) return;
    const v = b.dataset.pvwide;
    // כפיית פריסה מרנדרת את התוכנית מחדש בגודל אחר, ולכן דריסה
    // שנקבעה על הפריסה הקודמת כבר לא מתארת אותה.
    planEdit(S.areas[S.curArea], sl, t => {
      t.wide = v === 'auto' ? undefined : (v === '1'); delete t.plan; });
  });
  const rot = box.querySelector('[data-pvrot]');
  if(rot) rot.onclick = () => {
    // מחליף איזה תצלום יושב בתיבה הגדולה
    const sl = curSlideObj();
    sl.photos = (sl.photos||[]).slice(1).concat((sl.photos||[]).slice(0,1));
    if(sl.geom) delete sl.geom.photos;
    save(); renderSide(); previewLoad(true);
  };
  const spin = box.querySelector('[data-pvspin]');
  if(spin) spin.onclick = () => {
    const sl = curSlideObj(); if(!sl) return;
    planEdit(S.areas[S.curArea], sl, t => {
      const before = t.rot || 0;
      t.rot = (before + 90) % 360;
      // רבע סיבוב מחליף רוחב וגובה. תיבה שהעובד קבע נשמרת במקומה
      // עם המידות מוחלפות, במקום לקפוץ חזרה לפריסה האוטומטית —
      // הוא סידר אותה, וסיבוב אינו בקשה לבטל את הסידור.
      // הסיבוב סביב המרכז, כמו שמסובבים דף. סביב הפינה, תוכנית
      // רחבה שהפכה לעמודה בגובה מלא יצאה מתחתית השקופית ("קפצה").
      // ואם אחרי הסיבוב היא גדולה מהשקופית — מקטינים ומזיזים פנימה.
      if(t.plan){
        const [x, y, w, hh] = t.plan;
        const cx = x + w / 2, cy = y + hh / 2;
        const [CW, CH] = (PREV.scene && PREV.scene.canvas) || [2000, 1125];
        const k = Math.min(1, CW / hh, CH / w);
        const nw = hh * k, nh = w * k;
        const nx = Math.min(Math.max(cx - nw / 2, 0), CW - nw);
        const ny = Math.min(Math.max(cy - nh / 2, 0), CH - nh);
        t.plan = [nx, ny, nw, nh].map(Math.round);
      }
    });
  };
  // כותרת שזזה בטעות חוזרת למקום שנמדד — רק היא, בלי לגעת בתוכנית
  // ובתצלומים. הטקסט אינו חלק מהפריסה ונשאר.
  const trst = box.querySelector('[data-pvtreset]');
  if(trst) trst.onclick = () => {
    const sl = curSlideObj(); if(!sl || !sl.geom) return;
    delete sl.geom.title;
    if(PREV.sel === 'title') PREV.sel = null;
    save(); previewLoad(true);
  };
  const rst = box.querySelector('[data-pvreset]');
  if(rst) rst.onclick = () => {
    const sl = curSlideObj();
    sl.geom = {}; PREV.sel = null;
    // בשקופית משוחררת "אפס" מחזיר אותה גם לנעילה — אחרת היא הייתה
    // נשארת משוחררת עם פריסה אוטומטית, ושוב קופצת.
    if(sl.planFree){ sl.planFree = false; delete sl.wide; }
    save(); previewLoad(true);
  };
  box.querySelectorAll('[data-glowc]').forEach(b => b.onclick = () =>
    glowEdit(S.areas[S.curArea], curSlideObj(), {color: b.dataset.glowc}));
  box.querySelectorAll('[data-glowsize]').forEach(b => b.onclick = () =>
    glowEdit(S.areas[S.curArea], curSlideObj(), {size: b.dataset.glowsize}));
  box.querySelectorAll('[data-glowpower]').forEach(b => b.onclick = () =>
    glowEdit(S.areas[S.curArea], curSlideObj(), {power: b.dataset.glowpower}));
  const gr = box.querySelector('[data-glowreset]');
  if(gr) gr.onclick = () => {
    const sl = curSlideObj(); if(!sl || isDone(sl)) return;
    sl.glow = {}; save(); previewLoad(true);
  };
  box.querySelectorAll('[data-pvalign]').forEach(b => b.onclick = () => {
    const sl = curSlideObj(); if(!sl) return;
    const v = b.dataset.pvalign;
    // יישור מבטל מיקום שנגרר — היישור הוא המיקום
    planEdit(S.areas[S.curArea], sl, t => { t.align = v; delete t.plan; });
  });
  const back = box.querySelector('[data-pvrelock]');
  if(back) back.onclick = () => {
    const sl = curSlideObj(); if(!sl) return;
    sl.planFree = false;
    if(sl.geom){ delete sl.geom.plan; delete sl.geom.rot; }
    delete sl.wide;
    save(); previewLoad(true);
  };
  box.querySelectorAll('[data-pvpt]').forEach(b => b.onclick = () => {
    const sl = curSlideObj(); if(!sl) return;
    const pt = Math.min(60, Math.max(6, titlePt(sl) + (+b.dataset.pvpt)));
    sl.geom = sl.geom || {};
    sl.geom.title = Object.assign({}, sl.geom.title || {}, {pt});
    save(); previewLoad(true);
  });
  const ti = box.querySelector('#pvtitle');
  if(ti) ti.oninput = () => {
    const a = S.areas[S.curArea], sl = curSlideObj();
    if(!sl) return;
    sl.title = ti.value;
    // ריקון השדה מחזיר את השם האוטומטי — אותו כלל כמו בסרגל
    sl.auto = (ti.value.trim() === '');
    if(sl.auto) retitle(a);
    // הכותרת מצוירת כאן, ולכן היא משתנה תוך כדי הקלדה בלי סבב לשרת
    const t = $('#pvcanvas') && $('#pvcanvas').querySelector('[data-el="title"] span');
    if(t) t.textContent = (sl.title||'').split('|').map(x=>x.trim())
                            .filter(Boolean).join(' | ');
    save();
    clearTimeout(PREV.timer);
    PREV.timer = setTimeout(() => { renderSide(); }, 500);
  };
  const step = d => {
    const a = S.areas[S.curArea];
    const i = S.curSlide + d;
    if(!a || i < 0 || i >= a.slides.length) return;
    S.curSlide = i; PREV.sel = null; save(); renderSide(); previewLoad(true);
  };
  const pb = box.querySelector('[data-pvprev]');
  const nb = box.querySelector('[data-pvnext]');
  if(pb) pb.onclick = () => step(-1);
  if(nb) nb.onclick = () => step(1);
}

// הקנבס מוקטן לרוחב הבמה. שינוי גודל חלון משנה את הקנה, ובלי זה
// הידיות היו יושבות במקום אחר מהרכיב.
window.addEventListener('resize', () => { if(PREV.on) drawScene(); });

function renderTabs(){
  // סדר הטאבים הוא סדר השקופיות בייצוא, ולכן הוא ניתן לשינוי:
  // גיא עבד מאזור 3 לאחור וקיבל מצגת הפוכה.
  // לשונית קצרה: הכפתורים רק על האזור הפתוח — שם עובדים עליו.
  $('#tabs').innerHTML = S.areas.map((a,i)=>{
    const n = (a.slides||[]).length;
    return `
    <div class="tab ${i===S.curArea?'on':''} ${a.parent?'sub':''}" data-tab="${i}"
         title="${(a.parent ? 'תת-אזור בתוך ' + a.parent + ' · ' : '') +
                  cnt(n, 'שקופיות')}">
      <span class="sw" style="background:${COLORS[i%COLORS.length]}"></span>
      ${a.parent ? '<span class="of">▨</span>' : ''}
      <span>${a.name}</span>
      <span class="c">${n}</span>
      ${i === S.curArea ? `
      <button class="tb" data-amove="${i}" data-dir="-1" title="הקדם">‹</button>
      <button class="tb" data-amove="${i}" data-dir="1" title="אחר">›</button>
      <button class="tb" data-aren="${i}" title="שנה שם">שם</button>` : ''}
    </div>`;}).join('');
  $('#tabs').querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = e => { if(e.target.closest('.tb')) return;
                        showArea(+el.dataset.tab); };
  });
  $('#tabs').querySelectorAll('[data-aren]').forEach(el=>{
    el.onclick = e => { e.stopPropagation(); renameArea(+el.dataset.aren); };
  });
  $('#tabs').querySelectorAll('[data-amove]').forEach(el=>{
    el.onclick = e => {
      e.stopPropagation();
      const i = +el.dataset.amove, j = i + (+el.dataset.dir);
      if(j < 0 || j >= S.areas.length) return;
      const cur = S.areas[S.curArea];
      [S.areas[i], S.areas[j]] = [S.areas[j], S.areas[i]];
      S.curArea = S.areas.indexOf(cur);
      save(); renderTabs();
    };
  });
}

/* ═══ סרגל צד ═══ */
/* ── מאגר התצלומים ──────────────────────────────────────────────
   הטקסונומיה של המשרד מערבבת צירים בכוונה: "שקועים" הוא סוג התקנה,
   "אי מטבח" מיקום, "אווירה" כוונה. לכן אין כאן אשף עם מסכים —
   התוצאות מוצגות מיד, והצמצום קורה תוך כדי.

   שני כללים:
   • השרטוט עונה על מה שהוא יודע. הקטגוריה נגזרת מהבלוק, ולא נשאלת.
   • שבב שלא מפצל לא מוצג. השרת מחשב את זה על התוצאות שעל המסך. */

function dominantCategory(a, sl){
  const lit = [...litIndices(a, sl)];
  if(!lit.length) return {cat:'', code:''};
  const idx = {}; ovFixturesIn(a).forEach(f => idx[f.i] = f);
  const byCode = {};
  lit.forEach(i => { const f = idx[i]; if(f) byCode[f.code] = (byCode[f.code]||0)+1; });
  const top = Object.entries(byCode).sort((p,q)=>q[1]-p[1])[0];
  if(!top) return {cat:'', code:''};
  return {cat: hebName(top[0]) || '', code: top[0]};
}

/* כל הקטגוריות שדולקות בשקופית — לא רק הנפוצה. שקופית של שקועים
   ופסים מסננת לשניהם (D-048). */
function litCategories(a, sl){
  const idx = {}; ovFixturesIn(a).forEach(f => idx[f.i] = f);
  const out = [];
  [...litIndices(a, sl)].forEach(i => {
    const f = idx[i]; const c = f && hebName(f.code);
    if(c && !out.includes(c)) out.push(c);
  });
  return out;
}
/* האם הסינון עדיין אוטומטי. שקופית שהעובד נגע בשבבים שלה — לא.
   שקופית ישנה עם שבבים שנבחרו לפני D-048 נחשבת כנגועה. */
function photoAutoOn(sl){
  return sl.photoAuto === undefined ? !(sl.photoTags || []).length : !!sl.photoAuto;
}
/* לחיצה ראשונה על שבב הופכת את מה שסומן אוטומטית לבחירה של העובד,
   ומאז השרטוט כבר לא משנה את הסינון של השקופית הזו. */
function photoTakeOver(sl){
  if(!photoAutoOn(sl)) return;
  const auto = (S.photo && S.photo.auto_tags) || [];
  sl.photoTags = (sl.photoTags || []).concat(auto.filter(t => !(sl.photoTags || []).includes(t)));
  sl.photoAuto = false;
}

function photoPanel(a, sl){
  const chosen = sl.photos || [];
  return `<div class="ph-sec">
    <div class="hint" style="margin:14px 0 6px">
      תצלומים בשקופית — <b style="color:var(--glow-y)">${chosen.length} מתוך 3</b></div>
    <div id="photobox"><div class="hint" style="padding:8px 3px">טוען מאגר…</div></div>
  </div>`;
}

let photoReq = 0;
const PH_PAGE = 24;     // B-18: 245 תמונות ברצף יצרו פאנל של 11,000px
function loadPhotos(a, sl){
  // השרטוט אינו נשלח כמסנן. `category` נשלח רק כדי להעלות למעלה
  // תצלום שכבר נבחר פעם לאותה קטגוריה — זיכרון, לא הנחה.
  const {cat} = dominantCategory(a, sl);
  // D-048: מה שדולק מסמן את סוג ההתקנה, עד שהעובד נוגע בשבבים
  const q = new URLSearchParams({category:cat,
    tags:(sl.photoTags||[]).join('|'),
    rooms:(sl.photoRooms||[]).join('|'),
    text:(S.photoText||''),
    lit: litCategories(a, sl).join('|'),
    auto: photoAutoOn(sl) ? 1 : 0});
  const qs = q.toString();                       // B-18: חיפוש חדש מתחיל שוב מ-24
  if(qs !== S.phLastQ){ S.phLastQ = qs; S.phLimit = PH_PAGE; }
  const my = ++photoReq;
  fetch('/api/photos/search?' + q).then(r=>r.json()).then(d=>{
    if(my !== photoReq) return;      // תשובה מאוחרת לא דורסת מצב חדש
    S.photo = d;
    const lab = $('.ph-sec > .hint');
    if(lab) lab.innerHTML = 'תצלומים בשקופית — <b style="color:var(--glow-y)">' +
      ((sl.photos||[]).length) + ' מתוך 3</b> · ' + d.results.length +
      ' מתוך ' + d.total + ' בספריה';
    renderPhotos(a, sl);
    sideRestore();
  }).catch(()=>{
    const b = $('#photobox');
    if(b) b.innerHTML = '<div class="hint" style="padding:8px 3px">המאגר לא נטען</div>';
  });
}

function renderPhotos(a, sl){
  const box = $('#photobox');
  if(!box || !S.photo) return;
  const d = S.photo;
  const chosen = sl.photos || [];

  let h = '';
  // B-18: הסינון מקופל, עם סיכום של מה שפעיל. מצב הפתיחה נשמר בין רענונים.
  const nOn = (d.filters||[]).reduce((n, g) => n + g.values.filter(v => v.on).length, 0);
  h += `<details class="f-fold" data-ffold ${S.filtOpen ? 'open' : ''}>
    <summary>סינון תצלומים${nOn ? ' · ' + nOn + ' פעילים' : ''}</summary>`;
  // אוצר המילים המלא, תמיד — לא רק מה שמפצל כרגע. פאנל סינון
  // אמור להראות מה עומד לרשות העובד, לא לחשוף אפשרויות בהדרגה.
  // ספירה של אפס אינה תקלה אלא מצב התיוג, ולכן היא מוצגת.
  (d.filters||[]).forEach(g => {
    const hint = g.filters ? (g.multi ? 'בחירה מרובה' : 'בחירה יחידה')
                           : 'תגית בלבד — לא מסננת';
    h += `<div class="f-sec"><div class="f-head">${g.label}
      <span class="f-hint">· ${hint}</span>
      ${g.tagged ? '' : '<span class="f-hint">· טרם תויג</span>'}</div>
      <div class="chips">` +
      g.values.map(v => {
        const attr = g.filters ? 'data-tag' : 'data-room';
        const cls = 'chip' + (v.on ? ' on' : '') + (v.n ? '' : ' zero');
        return `<span class="${cls}" ${attr}="${v.tag}" data-facet="${g.facet}"` +
               (g.multi ? '' : ' data-single') + `>${v.tag}` +
               (v.n ? `<i>${v.n}</i>` : '') + `</span>`;
      }).join('') + `</div></div>`;
  });
  if((d.auto_tags||[]).length)
    h += `<div class="hint" style="padding:0 0 6px">סומן לפי מה שדולק בשקופית:
      <b>${d.auto_tags.join(' · ')}</b>. לחיצה על שבב מורידה או מוסיפה.</div>`;
  if((sl.photoTags||[]).length || (sl.photoRooms||[]).length || (d.auto_tags||[]).length)
    h += `<div class="chips" style="margin:2px 0 8px">
      <span class="chip clear" data-cleartags>נקה את כל הסינון</span></div>`;
  h += `<div class="hint" style="padding:0 0 6px; opacity:.65">
    החלל אינו מסנן — לחיצה עליו מקדמת תצלומים מאותו חלל לראש
    הרשימה, ואינה מסתירה דבר. שקוע מחדר שינה מתאים גם לסלון.</div>`;
  h += `</details>`;

  h += `<input class="ph-search" placeholder="חיפוש חופשי בשם, יצרן או תגית"
          value="${(S.photoText||'').replace(/"/g,'&quot;')}" data-phtext>`;

  const rs = d.results || [];
  if(!rs.length) h += '<div class="hint" style="padding:8px 3px">אין התאמה. נסה לנקות שבבים, או הדבק קישור למטה.</div>';

  let drew = false, drewUntagged = false;
  h += '<div class="ph-grid">';
  // רק 24 הראשונים, ובנוסף תמיד מה שכבר נבחר — כדי שבחירה לא תיעלם
  const limit = S.phLimit || PH_PAGE;
  const shown = rs.filter((r, i) => i < limit || chosen.indexOf(r.id) >= 0);
  shown.forEach((r,i) => {
    // D-048: מה שעוד לא תויג לסוג התקנה — מתחת לקו, ולא נעלם
    if(r.untagged && !drewUntagged){
      drewUntagged = true;
      h += `</div><div class="ph-div">עוד לא תויגו לסוג התקנה — ייתכן שמתאימים</div><div class="ph-grid">`;
    }
    // קו בין מה שהשרטוט התאים לבין שאר המאגר. קטגוריה דלה
    // (ספוטים = 2 נכסים) לא יכולה להיות קיר.
    if(!r.direct && !drew && d.n_direct > 0){
      drew = true;
      h += `</div><div class="ph-div">שאר המאגר</div><div class="ph-grid">`;
    }
    const k = chosen.indexOf(r.id);
    h += `<div class="ph ${k>=0?'sel':''}" data-ph="${r.id}"
        title="${r.name}${r.install?' · '+r.install:''}${(r.rooms&&r.rooms.length)?' · שימש ב'+r.rooms.join(', '):''}${r.manufacturer?' · '+r.manufacturer:''}">
      <img src="/api/photos/img?id=${r.id}" loading="lazy" alt="">
      ${k>=0?`<b class="ph-n">${k+1}</b>`:''}
      ${r.n_projects>1?`<i class="ph-r" title="בשימוש ב-${r.n_projects} פרויקטים">${r.n_projects}×</i>`:''}
    </div>`;
  });
  h += '</div>';
  if(shown.length < rs.length)
    h += `<button class="ghost ph-more" data-phmore>הצג עוד (מוצגים ${shown.length} מתוך ${rs.length})</button>`;

  // שאילתה מוכנה באנגלית מהשבבים שנבחרו. אתרי היצרנים והתוצאות
  // הטובות באנגלית; חיפוש בעברית מחזיר חנויות מקומיות.
  const q = d.query_en || '';
  h += `<details class="box" style="margin-top:9px" ${rs.length?'':'open'}>
    <summary>אין מתאים? חפש באינטרנט והוסף</summary>
    <div style="padding:8px 11px">` +
    (q ? `<div class="hint" style="padding:0 0 4px">העתק והדבק בגוגל תמונות:</div>
      <div class="q-row"><code class="q">${q}</code>
        <button class="ghost" data-qcopy>העתק</button>
        <button class="ghost" data-qopen>פתח</button></div>` : '') +
    `<div class="hint" style="padding:8px 0 6px">
        על התמונה שמצאת — <b>קליק ימני ← "העתק כתובת תמונה"</b>, והדבק כאן.
        קישור לעמוד מוצר לא יעבוד; צריך את כתובת התמונה עצמה.</div>
      <input class="ph-search" placeholder="https://... .jpg" data-phurl>
      <div class="drop" data-phdrop>
        או גרור לכאן קובץ תמונה מהמחשב
        <input type="file" accept="image/*" hidden data-phfile>
      </div>
      <button class="ghost" style="width:100%; margin-top:6px" data-phfetch>הוסף למאגר</button>
      <div class="hint" id="phmsg" style="padding:6px 0 0"></div>
    </div></details>`;

  box.innerHTML = h;
  wirePhotos(a, sl);
}

function wirePhotos(a, sl){
  const box = $('#photobox');
  const reload = () => loadPhotos(a, sl);

  // ערכי הציר הנוכחי, כדי שבחירה יחידה תחליף ולא תצטבר
  const valuesOf = f => ((S.photo.filters||[]).find(g=>g.facet===f)||{values:[]})
                          .values.map(v=>v.tag);
  box.querySelectorAll('[data-tag]').forEach(el => el.onclick = () => {
    photoTakeOver(sl);
    const t = el.dataset.tag, cur = sl.photoTags || [];
    if(cur.includes(t)) sl.photoTags = cur.filter(x => x !== t);
    else if(el.hasAttribute('data-single')){
      // ציר של בחירה יחידה: הערך החדש מחליף את הקודם באותו ציר
      const mine = new Set(valuesOf(el.dataset.facet));
      sl.photoTags = cur.filter(x => !mine.has(x)).concat([t]);
    } else sl.photoTags = cur.concat([t]);
    save(); reload();
  });
  // חלל מקדם ואינו מסנן — אותה לחיצה, משמעות אחרת
  box.querySelectorAll('[data-room]').forEach(el => el.onclick = () => {
    const t = el.dataset.room, cur = sl.photoRooms || [];
    sl.photoRooms = cur.includes(t) ? cur.filter(x=>x!==t) : cur.concat([t]);
    save(); reload();
  });
  const ff = box.querySelector('[data-ffold]');
  if(ff) ff.ontoggle = () => { S.filtOpen = ff.open; };
  const pm = box.querySelector('[data-phmore]');
  if(pm) pm.onclick = () => { S.phLimit = (S.phLimit || PH_PAGE) + PH_PAGE; renderPhotos(a, sl); };
  const ct = box.querySelector('[data-cleartags]');
  if(ct) ct.onclick = () => {
    sl.photoTags = []; sl.photoRooms = []; sl.photoAuto = false; save(); reload(); };

  const tx = box.querySelector('[data-phtext]');
  if(tx){
    tx.oninput = () => { S.photoText = tx.value;
      clearTimeout(S.phTimer); S.phTimer = setTimeout(reload, 300); };
  }

  box.querySelectorAll('[data-ph]').forEach(el => el.onclick = () => {
    const id = el.dataset.ph;
    sl.photos = sl.photos || [];
    const k = sl.photos.indexOf(id);
    if(k >= 0) sl.photos.splice(k, 1);
    else if(sl.photos.length < 3){
      // **לא נרשם כאן.** לחיצה היא ניסיון; רק מה שיצא במצגת נזכר
      // במאגר (D-038). קודם כל לחיצה נרשמה — סשן אחד רשם 113 "בחירות".
      sl.photos.push(id);
    }
    const r = (S.photo.results||[]).find(x => x.id === id);
    sl.photoName = (sl.photos||[]).length === 1 && r ? photoLabel(r) : '';
    retitle(a); save(); renderSide();
    // גיא: "ברגע שבוחרים תמונה יהיה מוצג במקום של השרטוט וההארה
    // את השקופית." בחירת תצלום היא הרגע שבו יש מה להראות.
    if(k < 0 && !PREV.on) setView('slide');
  });

  const qc = box.querySelector('[data-qcopy]');
  if(qc) qc.onclick = () => {
    const t = box.querySelector('.q').textContent;
    navigator.clipboard.writeText(t).then(()=>{ qc.textContent='הועתק'; })
      .catch(()=>{ qc.textContent='העתק ידנית'; });
  };
  const qo = box.querySelector('[data-qopen]');
  if(qo) qo.onclick = () => {
    const t = box.querySelector('.q').textContent;
    window.open('https://www.google.com/search?tbm=isch&q=' +
                encodeURIComponent(t), '_blank');
  };

  // גרירת קובץ — עוקפת אתרים שחוסמים הורדה ישירה
  const dz = box.querySelector('[data-phdrop]');
  const fi = box.querySelector('[data-phfile]');
  if(dz){
    const send = f => {
      if(!f) return;
      const msg = box.querySelector('#phmsg');
      msg.textContent = 'מעלה…';
      const fd = new FormData();
      fd.append('file', f);
      fd.append('category', dominantCategory(a, sl).cat || '');
      fd.append('tags', (sl.photoTags||[]).join('|'));
      fetch('/api/photos/upload', {method:'POST', body:fd})
        .then(r=>r.json().then(j=>({ok:r.ok, j})))
        .then(({ok,j})=>{
          if(!ok) throw new Error(j.detail || 'ההעלאה נכשלה');
          msg.textContent = 'נוסף למאגר: ' + j.name;
          photoAdded(a, sl, j.id);
        })
        .catch(e => { msg.textContent = 'שגיאה: ' + errText(e); });
    };
    dz.onclick = () => fi.click();
    fi.onchange = e => send(e.target.files[0]);
    dz.ondragover = e => { e.preventDefault(); e.stopPropagation();
                           dz.classList.add('on'); };
    dz.ondragleave = () => dz.classList.remove('on');
    dz.ondrop = e => {
      e.preventDefault(); e.stopPropagation();   // אחרת מטפל ה-DXF תופס
      dz.classList.remove('on');
      send(e.dataTransfer.files[0]);
    };
  }

  const fb = box.querySelector('[data-phfetch]');
  if(fb) fb.onclick = () => {
    const u = box.querySelector('[data-phurl]');
    const msg = box.querySelector('#phmsg');
    if(!u || !u.value.trim()) return;
    msg.textContent = 'מוריד…';
    const {cat} = dominantCategory(a, sl);
    fetch('/api/photos/fetch', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url:u.value.trim(), category:cat,
                            tags: sl.photoTags||[]})})
      .then(r => r.json().then(j => ({ok:r.ok, j})))
      .then(({ok, j}) => {
        if(!ok){ msg.textContent = j.detail || 'ההורדה נכשלה'; return; }
        msg.textContent = 'נוסף למאגר';
        photoAdded(a, sl, j.id);
      }).catch(e => { msg.textContent = errText(e); });
  };
}

/* תמונה חדשה מהאינטרנט או מגרירה נכנסת לשקופית ומוצגת מיד (גיא, 25.10).
   קודם רק `loadPhotos` רץ: הרשת סימנה אותה, אבל תצוגת השקופית לא התרעננה
   עד ביטול ולחיצה שנייה. כאן עושים בדיוק מה שלחיצה על תמונה עושה. */
function photoAdded(a, sl, id){
  sl.photos = sl.photos || [];
  if(sl.photos.indexOf(id) < 0 && sl.photos.length < 3) sl.photos.push(id);
  sl.photoName = '';
  retitle(a); save(); renderSide();
  setStatus('התמונה נוספה למאגר ולשקופית', '#5ecf8d');   // ההודעה בפאנל נמחקת ברענון
  if(!PREV.on) setView('slide');
}

/* שם קצר לתצלום, לשימוש בכותרת השקופית. שם קובץ של צילום
   סטודיו (PROJECT_055) אינו מוסיף מידע לכותרת; שם מוצר כן. */
function photoLabel(r){
  /* רק שם שאומר משהו ללקוח נכנס לכותרת.

     שם קובץ מהבנק — image41, Layer 18, PROJECT_055 — אינו שם של גוף,
     והוא הפך כותרות לשלוש שורות של רעש. נשאר רק שם יצרן, שהוא
     המידע היחיד שהלקוח מזהה. */
  if(r.manufacturer) return r.manufacturer;
  return '';
}

/* **הסרגל נבנה מחדש בכל שינוי, ומיקום הגלילה נשמר.** גיא (13.10):
   "כל פעם שאני לוחץ על תמונה הסרגל קופץ למעלה ואז צריך לגלגל חזרה
   למטה לתמונות". נשמר כל עוד נשארים באותה שקופית; מעבר שקופית
   מתחיל מלמעלה. התצלומים נטענים אחרי הבנייה ומאריכים את הסרגל,
   ולכן המיקום מוחזר גם אחרי שהם מגיעים (`loadPhotos`). */
const SIDE = {key: '', top: 0, pending: false};
function sideKey(){ return [S.deckOn ? 'deck' : S.mode, S.curArea, S.curSlide].join(':'); }
function sideRestore(){
  const box = $('#side');
  if(box && SIDE.key === sideKey()) box.scrollTop = SIDE.top;
  SIDE.pending = false;
}
/* ─── חזרה למקום (D-037) ─────────────────────────────────────────
   בדיקת השמישות: למחרת העובד נחת בשלב 1 וחיפש את האזור והשקופית.
   המקום נשמר **בדפדפן**, לא בפרויקט — הוא של העובד, ושני עובדים על
   אותו פרויקט לא יזיזו זה את זה (וגם לא ייצרו התנגשות שמירה). */
function placeKey(name){ return 'lighting-place:' + (name || S.name); }
function rememberPlace(){
  if(!S.name || !S.areas.length) return;
  try{ localStorage.setItem('lighting-last', S.name); }catch(e){}   // B-12
  const a = S.areas[S.curArea];
  try{
    localStorage.setItem(placeKey(), JSON.stringify({
      step: S.deckOn ? 3 : (S.mode === 'work' ? 2 : 1),
      areaId: a ? a.id : null, slide: S.curSlide,
      view: PREV.on ? 'slide' : 'plan'}));
  }catch(e){}
}
function readPlace(name){
  try{ return JSON.parse(localStorage.getItem(placeKey(name)) || 'null'); }catch(e){ return null; }
}
async function returnToPlace(p){
  if(!p || p.step < 2) return;
  const i = S.areas.findIndex(x => x.id === p.areaId);
  if(i < 0) return;
  await showArea(i);
  const a = S.areas[i];
  S.curSlide = Math.max(0, Math.min(p.slide || 0, a.slides.length - 1));
  renderSide(); renderTabs();
  setView(p.step === 3 ? 'deck' : (p.view === 'slide' ? 'slide' : 'plan'));
  const sl = a.slides[S.curSlide];
  setStatus(`חזרת למקום שבו עצרת: ${a.name}` +
            (p.step === 3 ? ' · שלב 3' : ` · שקופית ${S.curSlide + 1}` +
             (sl && sl.title ? ` — ${sl.title}` : '')), '#5ecf8d');
}

function renderSide(){
  // כל שינוי בסרגל משתקף מיד בשקופית — תצלום, שכבה, כותרת.
  previewTouch();
  rememberPlace();
  const box = $('#side');
  const key = sideKey();
  // בנייה שנייה לפני שהתצלומים הגיעו קוראת מיקום מקוצץ — שומרים את המקורי
  if(SIDE.key !== key) SIDE.top = 0;
  else if(!SIDE.pending) SIDE.top = box.scrollTop;
  SIDE.key = key;
  if(!S.name){
    box.innerHTML = '<div class="empty">טען שרטוט כדי להתחיל</div>';
    $('#sidehint').textContent = ''; updateSummary(); return;
  }
  if(S.deckOn) renderDeckSide(box);
  else if(S.mode === 'areas') renderAreasMode(box);
  else renderWorkMode(box);
  box.scrollTop = SIDE.top;
  // הסרגל עוד קצר מדי (התצלומים בדרך) — לא לשמור את המיקום המקוצץ
  SIDE.pending = box.scrollTop < SIDE.top - 2;
}

function renderDeckSide(box){
  $('#sidehint').textContent = 'שלב 3 מתוך 3 — מצגת והפקה';
  const n = deckSlides().length;
  box.innerHTML = `<div class="hint" style="line-height:1.7">
      ${cnt(n, 'שקופיות')}, בסדר שבו הן ייצאו.<br>
      לחיצה על שקופית מחזירה לעבודה עליה.<br>
      כשהכל נראה נכון — הפק למטה.</div>` + deckPanel();
  wireDeckPanel();
  updateSummary();
}

/* ─── סקירת הבנק ─────────────────────────────────────────────────

   פסילה היא מוצא אחרון. גיא: "אם הקריטריונים לא נכונים — שהעובד
   יתקן ויאשר. אם החיתוך לא טוב — שיתקן. אם לא יכול — להסתיר ולשמור."

   ולכן הכרטיס מציע שלוש פעולות בסדר הזה: תיקון תגיות, תיקון חיתוך,
   ורק אז הסתרה. הקובץ נשאר על הדיסק תמיד — אין מסלול מחיקה. */

const BANK = {assets:[], criteria:[], who:'', total:0, reviewed:0,
  status:'all', tags:{}, q:'', showFilters:false, human:0};

function bankOpen(){
  try{ BANK.who = BANK.who || localStorage.getItem('reviewer') || ''; }catch(e){}
  $('#bank').style.display = 'block';
  bankLoad();
}
function bankClose(){ $('#bank').style.display = 'none'; }

function bankLoad(){
  fetch('/api/bank')
    .then(r=>r.json()).then(d=>{
      BANK.assets = d.assets; BANK.criteria = d.criteria;
      BANK.total = d.total; BANK.reviewed = d.reviewed;
      BANK.human = d.assets.filter(function(x){ return x.by_human; }).length;
      bankRender();
    }).catch(()=>{ $('#bank').innerHTML =
      '<div class="empty">הבנק לא נטען</div>'; });
}

function bankPost(url, body){
  return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)}).then(r=>r.json());
}

function bankVisible(){
  // הסינון קורה בדפדפן: כל הבנק כבר בזיכרון, ואין טעם לסבב שרת
  // על כל לחיצת שבב.
  return BANK.assets.filter(function(a){
    // "אושרו" פירושו אושר על ידי אדם. תיוג אוטומטי אינו אישור,
    // אחרת מי שסוקר לא יודע מה נשאר לו לעבור עליו.
    if(BANK.status === 'new'  && a.by_human) return false;
    if(BANK.status === 'done' && !a.by_human) return false;
    for(const f in BANK.tags){
      const want = BANK.tags[f];
      if(!want.length) continue;
      const have = a.tags[f] || [];
      if(!want.every(function(t){ return have.indexOf(t) >= 0; })) return false;
    }
    if(BANK.q){
      const q = BANK.q.toLowerCase();
      const hay = [a.name].concat(Object.keys(a.tags)
        .reduce(function(acc,k){ return acc.concat(a.tags[k]||[]); }, []));
      if(!hay.some(function(x){ return String(x).toLowerCase().indexOf(q) >= 0; }))
        return false;
    }
    return true;
  });
}

function bankRender(){
  const el = $('#bank');
  const rows = bankVisible();
  const active = Object.keys(BANK.tags)
    .reduce(function(n,f){ return n + BANK.tags[f].length; }, 0);

  let h = '<div class="bk-head">' +
    '<b style="font-size:15px">סקירת בנק התצלומים</b>' +
    '<span class="hint">' + BANK.total + ' תויגו · ' + BANK.human +
      ' אושרו על ידי אדם · ' + (BANK.total - BANK.human) +
      ' ממתינים</span>' +
    '<span class="seg">' +
      ['all', 'new', 'done'].map(function(k){
        const lbl = {all:'הכל', new:'ממתין לאדם', done:'אושר על ידי אדם'}[k];
        return '<button class="' + (BANK.status===k?'on':'') +
               '" data-status="' + k + '">' + lbl + '</button>';
      }).join('') + '</span>' +
    '<input id="bkq" placeholder="חיפוש בשם או בתגית" value="' + (BANK.q||'') +
      '" style="width:170px;padding:5px 9px;font-size:12px">' +
    '<button class="ghost" id="bkfilters">' +
      (BANK.showFilters ? 'הסתר סינון' : 'סינון לפי תגיות') +
      (active ? ' (' + active + ')' : '') + '</button>' +
    '<span style="flex:1"></span>' +
    '<input id="bkwho" placeholder="השם שלך" value="' + (BANK.who||'') +
      '" style="width:130px;padding:5px 9px;font-size:12px">' +
    '<button class="ghost" id="bkclose">חזרה לעבודה</button>' +
    '<div id="bkmsg" class="bk-msg"></div>' +
    '</div>';

  if(BANK.showFilters){
    h += '<div class="bk-filters">';
    BANK.criteria.forEach(function(c){
      const on = BANK.tags[c.facet] || [];
      h += '<div class="f-head" style="margin-top:5px">' + c.label + '</div>' +
           '<div class="chips">';
      c.values.forEach(function(v){
        // ספירה על מה שמוצג כרגע, כדי שהמספר לא ישקר
        const n = rows.filter(function(a){
          return (a.tags[c.facet]||[]).indexOf(v.tag) >= 0; }).length;
        h += '<span class="chip' + (on.indexOf(v.tag)>=0?' on':'') +
             (n ? '' : ' zero') + '" data-bfilter="' + c.facet +
             '" data-val="' + v.tag + '">' + v.tag +
             (n ? '<i>' + n + '</i>' : '') + '</span>';
      });
      h += '</div>';
    });
    if(active) h += '<div class="chips" style="margin-top:6px">' +
      '<span class="chip clear" data-bclear>נקה סינון</span></div>';
    h += '</div>';
  }

  h += '<div class="hint" style="margin:9px 2px 11px">מוצגים ' +
       rows.length + ' מתוך ' + BANK.total + '</div>';

  if(!rows.length){
    h += '<div class="empty">' + (
      BANK.status === 'done' ? 'עוד לא אושר דבר על ידי אדם. הכל תויג אוטומטית וממתין לעין.' :
      BANK.status === 'new'  ? 'הכל עבר עין אנושית.' :
      'אין תצלומים שמתאימים לסינון') + '</div>';
    el.innerHTML = h; wireBankHead(); return;
  }

  h += '<div class="bk-grid">' + rows.map(function(a){
    const cls = a.by_human ? 'ok' : 'prop';
    let tagRow = '';
    BANK.criteria.forEach(function(c){
      if(c.facet === 'room') return;
      (a.tags[c.facet]||[]).forEach(function(t){
        tagRow += '<span class="bk-t ' + cls + '">' + t + '</span>';
      });
    });
    let rooms = '';
    (a.tags.room||[]).forEach(function(t){
      rooms += '<span class="bk-t">' + t + '</span>'; });
    return '<div class="bk-card ' + (a.by_human?'done':'') + ' ' +
      (a.hidden?'hid':'') + '" data-bk="' + a.id + '">' +
      '<img src="/api/photos/img?id=' + a.id + '" loading="lazy">' +
      '<div class="bk-body">' +
        '<div class="bk-name" title="' + a.name + '">' + a.name + '</div>' +
        '<div class="bk-row">' + (tagRow ||
          '<span class="hint" style="font-size:10.5px">בלי תגיות</span>') + '</div>' +
        '<div class="bk-row">' + rooms + '</div>' +
        '<div class="bk-acts">' +
          '<button class="ghost" data-edit="' + a.id + '">תגיות</button>' +
          '<button class="ghost" data-crop="' + a.id + '">חיתוך</button>' +
          '<button class="' + (a.by_human?'ghost':'primary') + '" data-ok="' +
            a.id + '">' + (a.by_human?'אושר':'אשר') + '</button></div>' +
        '<div class="bk-acts"><button class="ghost" data-hide="' + a.id +
          '" style="font-size:10.5px">' +
          (a.hidden?'החזר לחיפוש':'הסתר') + '</button></div>' +
      '</div></div>';
  }).join('') + '</div>';

  el.innerHTML = h;
  wireBankHead();
  wireBankCards();
}

/* הודעה במקום קפיצה.

   קודם, לחיצה על "אשר" בלי שם קפצה לראש העמוד כדי למקד את שדה
   השם — ומי שלחץ נשאר בלי לדעת אם אושר או לא. עכשיו ההודעה
   מופיעה במקום, והמסך לא זז. */
function bankSay(text){
  const m = $('#bkmsg');
  if(!m) return;
  m.textContent = text;
  m.classList.add('on');
  clearTimeout(bankSay._t);
  bankSay._t = setTimeout(function(){ m.classList.remove('on'); }, 4000);
}

function wireBankHead(){
  const w = $('#bkwho');
  if(w) w.oninput = function(){
    BANK.who = w.value;
    try{ localStorage.setItem('reviewer', w.value); }catch(e){}
  };
  const x = $('#bkclose');
  if(x) x.onclick = bankClose;

  $('#bank').querySelectorAll('[data-status]').forEach(function(b){
    b.onclick = function(){ BANK.status = b.dataset.status; bankRender(); };
  });
  const f = $('#bkfilters');
  if(f) f.onclick = function(){ BANK.showFilters = !BANK.showFilters; bankRender(); };

  const q = $('#bkq');
  if(q) q.oninput = function(){
    clearTimeout(q._t);
    q._t = setTimeout(function(){
      const pos = q.selectionStart;
      BANK.q = q.value; bankRender();
      const nq = $('#bkq');
      if(nq){ nq.focus(); nq.setSelectionRange(pos, pos); }
    }, 260);
  };

  $('#bank').querySelectorAll('[data-bfilter]').forEach(function(el){
    el.onclick = function(){
      const f = el.dataset.bfilter, v = el.dataset.val;
      const cur = BANK.tags[f] || [];
      BANK.tags[f] = cur.indexOf(v) >= 0
        ? cur.filter(function(x){ return x !== v; })
        : cur.concat([v]);
      bankRender();
    };
  });
  const c = $('#bank').querySelector('[data-bclear]');
  if(c) c.onclick = function(){ BANK.tags = {}; bankRender(); };
}


function wireBankCards(){
  const root = $('#bank');
  root.querySelectorAll('[data-ok]').forEach(function(b){
    b.onclick = function(){
      // מי אישר חשוב: המשרד רב-משתמשי, וכשתתגלה תגית שגויה בעוד
      // חצי שנה צריך לדעת למי לפנות.
      if(!BANK.who){ bankSay('כתוב את שמך למעלה לפני האישור — לא אושר.'); return; }
      const a = BANK.assets.find(function(x){ return x.id===b.dataset.ok; });
      bankPost('/api/bank/tags',
        {asset_id:a.id, values:{}, by:BANK.who, approve:true})
        .then(function(){ a.reviewed = true; a.by_human = true;
                          BANK.human++; bankRender(); });
    };
  });
  root.querySelectorAll('[data-hide]').forEach(function(b){
    b.onclick = function(){
      const a = BANK.assets.find(function(x){ return x.id===b.dataset.hide; });
      bankPost('/api/bank/hide',
        {asset_id:a.id, hidden:!a.hidden, by:BANK.who})
        .then(function(){ a.hidden = !a.hidden; bankRender(); });
    };
  });
  root.querySelectorAll('[data-edit]').forEach(function(b){
    b.onclick = function(){ bankEdit(b.dataset.edit); }; });
  root.querySelectorAll('[data-crop]').forEach(function(b){
    b.onclick = function(){ cropOpen(b.dataset.crop); }; });
}

/* עריכת תגיות — אותו אוצר מילים שבפאנל הסינון, כדי שלא יהיו שתי
   שפות לאותו דבר. */
function bankEdit(id){
  const a = BANK.assets.find(function(x){ return x.id===id; });
  const card = $('#bank').querySelector('[data-bk="' + id + '"] .bk-body');
  if(!card) return;
  let h = '<div class="bk-name">' + a.name + '</div>';
  BANK.criteria.forEach(function(c){
    const on = a.tags[c.facet] || [];
    h += '<div class="f-head" style="margin-top:6px">' + c.label +
      '<span class="f-hint">· ' +
      (c.filters ? (c.multi?'מרובה':'יחידה') : 'תגית') + '</span></div><div class="chips">';
    c.values.forEach(function(v){
      h += '<span class="chip' + (on.indexOf(v.tag)>=0?' on':'') +
        '" data-set="' + c.facet + '" data-val="' + v.tag + '"' +
        (c.multi?'':' data-one') + '>' + v.tag + '</span>';
    });
    h += '</div>';
  });
  h += '<div class="bk-acts" style="margin-top:9px">' +
    '<button class="primary" data-save="' + id + '">שמור ואשר</button>' +
    '<button class="ghost" data-cancel>ביטול</button></div>';
  card.innerHTML = h;

  const draft = {};
  BANK.criteria.forEach(function(c){ draft[c.facet] = (a.tags[c.facet]||[]).slice(); });
  card.querySelectorAll('[data-set]').forEach(function(el){
    el.onclick = function(){
      const f = el.dataset.set, v = el.dataset.val, cur = draft[f];
      if(cur.indexOf(v) >= 0) draft[f] = cur.filter(function(x){ return x!==v; });
      else if(el.hasAttribute('data-one')) draft[f] = [v];
      else draft[f] = cur.concat([v]);
      card.querySelectorAll('[data-set="' + f + '"]').forEach(function(e){
        e.classList.toggle('on', draft[f].indexOf(e.dataset.val) >= 0); });
    };
  });
  card.querySelector('[data-cancel]').onclick = bankRender;
  card.querySelector('[data-save]').onclick = function(){
    if(!BANK.who){ bankSay('כתוב את שמך למעלה לפני האישור — לא נשמר.'); return; }
    bankPost('/api/bank/tags',
      {asset_id:id, values:draft, by:BANK.who, approve:true})
      .then(function(){
        a.tags = draft;
        a.reviewed = true; a.by_human = true; BANK.human++;
        bankRender();
      });
  };
}

/* עורך החיתוך פועל תמיד על התמונה המלאה (full=1). אי אפשר לתקן
   קופסה בזמן שמסתכלים על התוצאה שלה. */
function cropOpen(id){
  let box = $('#cropper');
  if(!box){
    box = document.createElement('div');
    box.id = 'cropper';
    box.innerHTML = '<div><div id="cropbox"><img id="cropimg">' +
      '<div id="cropsel"></div></div>' +
      '<div style="display:flex;gap:8px;margin-top:11px;justify-content:center">' +
      '<button class="primary" id="cropsave">שמור חיתוך</button>' +
      '<button class="ghost" id="cropreset">בטל חיתוך</button>' +
      '<button class="ghost" id="cropx">סגור</button></div></div>';
    document.body.appendChild(box);
  }
  box.style.display = 'flex';
  const img = $('#cropimg'), sel = $('#cropsel');
  img.onload = function(){
    const w = img.clientWidth, h = img.clientHeight;
    sel.style.left = (w*0.5) + 'px';
    sel.style.top = (h*0.1) + 'px';
    sel.style.width = (w*0.42) + 'px';
    sel.style.height = (h*0.75) + 'px';
  };
  img.src = '/api/photos/img?id=' + id + '&full=1&t=' + Date.now();

  let drag = null;
  $('#cropbox').onmousedown = function(e){
    const r = $('#cropbox').getBoundingClientRect();
    drag = {x:e.clientX-r.left, y:e.clientY-r.top, r:r};
    sel.style.left = drag.x + 'px'; sel.style.top = drag.y + 'px';
    sel.style.width = '2px'; sel.style.height = '2px';
    e.preventDefault();
  };
  window.onmousemove = function(e){
    if(!drag) return;
    const x = e.clientX-drag.r.left, y = e.clientY-drag.r.top;
    sel.style.left = Math.min(x,drag.x) + 'px';
    sel.style.top = Math.min(y,drag.y) + 'px';
    sel.style.width = Math.abs(x-drag.x) + 'px';
    sel.style.height = Math.abs(y-drag.y) + 'px';
  };
  window.onmouseup = function(){ drag = null; };

  $('#cropsave').onclick = function(){
    const sx = img.naturalWidth/img.clientWidth;
    const sy = img.naturalHeight/img.clientHeight;
    bankPost('/api/bank/crop', {asset_id:id, by:BANK.who,
      x: Math.round(parseFloat(sel.style.left)*sx),
      y: Math.round(parseFloat(sel.style.top)*sy),
      w: Math.round(parseFloat(sel.style.width)*sx),
      h: Math.round(parseFloat(sel.style.height)*sy)})
      .then(function(){ box.style.display='none'; bankLoad(); });
  };
  $('#cropreset').onclick = function(){
    fetch('/api/bank/crop?asset_id=' + id, {method:'DELETE'})
      .then(function(){ box.style.display='none'; bankLoad(); });
  };
  $('#cropx').onclick = function(){ box.style.display='none'; };
}


function renderAreasMode(box){
  $('#sidehint').innerHTML =
    'שלב 1 מתוך 3 — <b>סימון אזורים</b>. גרור מלבן על התוכנית לכל אזור ותן לו שם. ' +
    'כשסיימת את כולם, לחץ <b>"2 · עבודה"</b> למעלה — שם נבנות השקופיות ושם ' +
    'מופיעות לשוניות האזורים.';
  let html = S.warnHtml + deckPanel() + layersPanel();
  html += S.areas.length ? S.areas.map((a,i)=>{
    const n = ovFixturesIn(a).length;
    return `<div class="area ${i===S.curArea?'sel':''}">
      <div class="area-head">
        <span class="swatch" style="background:${COLORS[i%COLORS.length]}"></span>
        <input type="text" value="${a.name.replace(/"/g,'&quot;')}" data-an="${i}">
        <span class="count">${cnt(n, 'גופים')}</span>
        <button class="danger" data-ad="${i}">✕</button>
      </div></div>`;
  }).join('') : '<div class="empty">גרור מלבן על התוכנית<br>כדי להגדיר אזור ראשון</div>';
  box.innerHTML = html;
  wireDeckPanel();
  wireLayers();
  box.querySelectorAll('[data-an]').forEach(el=>{
    limitName(el);
    el.onfocus = () => setTimeout(() => el.select(), 0);     // B-16: הקלדה מחליפה את השם
    el.oninput = () => {
      const a = S.areas[+el.dataset.an]; a.name = el.value;
      // תת-האזורים מקושרים במזהה; השם שלהם לאב מתעדכן איתו
      syncParents();
      S.areas.forEach(x => { if(x === a || isChildOf(x, a)) retitle(x); });
      save(); render();
    };
    // שם כפול נבדק בסיום ההקלדה, לא באמצעה
    el.onchange = () => {
      const a = S.areas[+el.dataset.an];
      const empty = !el.value.trim();
      const t = el.value.trim() || nextAreaName('אזור');
      const u = uniqueName(t, a);
      if(empty) setStatus(`השם היה ריק — האזור נקרא "${u}"`, '#ffd479');
      if(u !== el.value){
        if(u !== t) setStatus(`כבר יש אזור בשם "${t}" — נקרא "${u}"`, '#ffd479');
        a.name = u; el.value = u; syncParents();
        S.areas.forEach(x => { if(x === a || isChildOf(x, a)) retitle(x); });
        save(); renderTabs(); render();
      }
    };
  });
  box.querySelectorAll('[data-ad]').forEach(el=>{
    el.onclick = async () => {
      const i = +el.dataset.ad, gone = S.areas[i];
      // מחיקת אזור מוחקת גם את תת-האזורים שנגזרו ממנו. תת-אזור
      // בלי אביו מאבד את תיבת הפתיחה שלו ואת מקומו בסרגל.
      const kids = S.areas.filter(x => isChildOf(x, gone)).length;
      const gDone = S.areas.filter(x => x === gone || isChildOf(x, gone))
                          .reduce((n, x) => n + (x.slides||[]).filter(isDone).length, 0);
      if(gDone && !await askYes('מחיקת אזור', [`באזור "${gone.name}" יש ${cnt(gDone, 'שקופיות מאושרות', 'שקופית אחת מאושרת')}.`], 'למחוק בכל זאת', 'ביטול', true)) return;
      const gSlides = S.areas.filter(x => x === gone || isChildOf(x, gone))
                             .reduce((n, x) => n + (x.slides||[]).length, 0);
      if(!gDone && !kids && gSlides &&
         !await askYes('מחיקת אזור', [`למחוק את האזור "${gone.name}" ואת ${gSlides} השקופיות שבו?`], 'מחק', 'ביטול', true)) return;
      // מה שנמחק נשמר עם מקומו בסרגל, כדי שהביטול יחזיר בדיוק לשם
      const removed = S.areas.map((x, k) => [k, x])
                             .filter(([k, x]) => x === gone || isChildOf(x, gone));
      if(kids && !await askYes('מחיקת אזור', ['לאזור "' + gone.name + '" יש ' + kids + ' תת-אזורים' +
          (gSlides ? ' ו-' + cnt(gSlides, 'שקופיות') : '') + '. למחוק את כולם?'], 'מחק את כולם', 'ביטול', true)) return;
      S.areas = S.areas.filter(x => x !== gone && !isChildOf(x, gone));
      if(S.curArea >= S.areas.length) S.curArea = S.areas.length-1;
      save(); renderTabs(); renderSide(); render();
      offerUndo(`האזור "${gone.name}" נמחק` + (gSlides ? ` (${cnt(gSlides, 'שקופיות')})` : ''), () => {
        removed.forEach(([k, x]) => S.areas.splice(Math.min(k, S.areas.length), 0, x));
        syncParents(); save(); renderTabs(); renderSide(); render();
      });
    };
  });
  updateSummary(); render();
}

function renderWorkMode(box){
  const a = S.areas[S.curArea];
  if(!a){ box.innerHTML = '<div class="empty">אין אזור נבחר</div>'; return; }
  $('#sidehint').innerHTML =
    'שלב 2 מתוך 3 — <b>עבודה באזור</b>. המעבר בין אזורים בלשוניות שמעל התוכנית. ' +
    'לכל שקופית: בחר שכבות תאורה, צמצם לסוג גוף, או בחר גופים בלחיצה.';

  const byLayer = {};
  ovFixturesIn(a).forEach(f=>{
    if(!byLayer[f.layer]) byLayer[f.layer] = {n:0, codes:{}};
    byLayer[f.layer].n++;
    byLayer[f.layer].codes[f.code] = (byLayer[f.layer].codes[f.code]||0)+1;
  });
  const sl = curSlideObj();

  // השכבות קובעות את כל מה שיבוא אחריהן — מה מוצג בתוכנית ואילו
  // גופים בכלל קיימים. לכן הן בראש שלב 2 ולא בתחתיתו.
  /* **שלוש דרכים לפתוח שקופית, ולכן הן יושבות יחד.** גיא ביקש
     שגזירת תת-אזור ובחירת גופים בלחיצה יהיו למעלה עם "שקופית
     חדשה" וייצרו שקופית. הן באמת אותו סוג פעולה — כל אחת מתחילה
     שקופית, רק שהאחת מתחילה אותה מאזור והשנייה מגופים. הן ישבו
     קודם בתחתית הסרגל, מתחת לשכבות, ונראו כהגדרות של השקופית
     הנוכחית. */
  // מי שבתוך תת-אזור צריך לדעת את זה תמיד, ולדעת איך יוצאים (גיא,
  // 12.10: "לא ברור לי איך הוא עובד").
  const subBanner = a.parent ? `<div class="box" style="border-color:var(--glow-y);
      padding:9px 11px; margin-bottom:10px; font-size:13px; line-height:1.6">
      <b style="color:var(--glow-y)">▨ אתה בתוך תת-האזור "${a.name}"</b>
      — חלק מ"${a.parent}".<br>
      השקופית הראשונה היא שקופית הפתיחה. כל שקופית שתוסיף כאן
      חתוכה לצורה שגזרת. כשתסיים — בחר אזור אחר בסרגל למעלה.</div>` : '';
  // B-18 (גיא בחר אפשרות א): רשימת השקופיות למעלה, כפתורי ההתחלה בשורה
  // קטנה, ושכבות השרטוט (מקופלות) בתחתית. בלפטופ זה חוסך כ-300px גלילה.
  let html = subBanner;
  const nDone = a.slides.filter(isDone).length;
  html += `<div class="hint" style="margin-bottom:5px">שקופיות באזור (${a.slides.length})${
    nDone ? ` · <span class="dk-ok">✓ ${cnt(nDone, 'מאושרות', 'אחת מאושרת')}</span>` : ''} — לחץ על כותרת כדי לערוך</div>`;
  html += a.slides.map((s,si)=>`
    <div class="slide ${si===S.curSlide?'cur':''} ${isDone(s)?'done':''}">
      <button class="ok" data-sok="${si}"
              title="${isDone(s)?'מאושרת — לחץ כדי לפתוח לעריכה':'סמן כגמורה ונעל מפני שינוי'}">✓</button>
