      <input type="text" value="${(s.title||'').replace(/"/g,'&quot;')}"
             data-st="${si}" ${isDone(s)?'readonly':''}
             title="${isDone(s)?'השקופית מאושרת. בטל את ה-✓ כדי לערוך':s.auto?'נגזר מהבחירות. הקלד כדי לקבוע שם משלך; מחק הכל כדי לחזור לאוטומטי':'שם שהוקלד ידנית. מחק הכל כדי לחזור לאוטומטי'}"
             placeholder="נגזר מהבחירות">
      <span class="meta">${litIndices(a,s).size}</span>
      <button data-sdup="${si}" title="שכפל">⧉</button>
      <button class="del" data-sdel="${si}" title="מחק">✕</button>
    </div>`).join('') || '<div class="hint" style="padding:5px 3px">אין שקופיות</div>';
  html += `<div class="mk">
    <button class="ghost" data-addslide title="שקופית חדשה באזור זה">+ שקופית חדשה</button>
    <button class="ghost" data-submode title="גזור תת-אזור והפוך אותו לשקופיות חדשות">${
      S.subDraw ? '✓ סגור תת-אזור' : '▨ תת-אזור'}</button>
    <button class="ghost" data-pickmode title="שקופית מגופים שאבחר בלחיצה">${
      S.picking ? '✓ סיים בחירה' : '◉ מגופים בלחיצה'}</button>
    <button class="ghost" data-photoslide title="שקופית תצלומים בלבד">▭ תצלומים בלבד</button>
    <button class="ghost" data-pvopen title="הצג כשקופית">👁 הצג</button>
  </div>`;

  // כל מה שמתחת — הארה, גופים, תצלומים — שייך לשקופית הנוכחית.
  // כשהיא מאושרת הוא נעול ומעומעם, ומעליו הסבר ודרך לפתוח.
  if(isDone(sl)) html += `<div class="done-note"><span>
      <b>✓ השקופית מאושרת.</b> התוכנית, התצלום והכותרת נעולים.</span>
      <button class="ghost" data-sunlock style="margin-inline-start:auto; white-space:nowrap">פתח לעריכה</button></div>`;
  html += `<div class="${isDone(sl) ? 'locked' : ''}">`;

  if(sl && sl.photosOnly){
    html += `<div class="box" style="padding:9px 11px; margin-top:12px; font-size:13px; line-height:1.6">
      <b>▭ שקופית תצלומים בלבד</b> — בלי תוכנית ובלי הארה.<br>
      עד 3 תצלומים, באותו גובה, ממורכזים ובמרחקים שווים. הכותרת
      נערכת כמו בכל שקופית.</div>`;
    html += photoPanel(a, sl);
  }else if(sl && sl.mask){
    // **שקופית הפתיחה אינה שקופית הארה.** בייחוס אין בה ולו סמן
    // אחד, והשרת כופה זאת. הצגת תיבות שכבות שלא עושות דבר בלחיצה
    // היא בדיוק מה שגרם לגיא לא לזהות שנוצרה כאן שקופית מיוחדת.
    html += `<div class="box" style="border-color:var(--glow-y)">
      <div style="padding:9px 10px; font-size:13px; line-height:1.5">
        <b style="color:var(--glow-y)">שקופית פתיחה של תת-האזור</b><br>
        התוכנית המלאה של "${a.parent || 'האזור'}" עם המסכה הצהובה על
        "${a.name}". <b>אין בה הארה</b> — כמו בייחוס. השקופיות
        שאחריה חתוכות לתת-האזור.
      </div></div>`;
    // **תצלום כאן הוא בחירה, לא ברירת מחדל** (D-031). בלי תצלום
    // התוכנית תופסת את כל רוחב השקופית.
    if((sl.photos||[]).length || sl.wantPhoto) html += photoPanel(a, sl);
    else html += `<button class="ghost" data-wantphoto style="width:100%; margin-top:10px">
        ＋ הוסף תצלום (לא חובה)</button>
      <div class="hint" style="margin-top:5px">בלי תצלום — התוכנית והמסכה בלבד, על כל רוחב השקופית.</div>`;
  }else if(sl){
    if(!litIndices(a,sl).size && !isDone(sl)) html += `<div class="warn" style="margin-top:14px">
      בשקופית הזו עוד לא מואר דבר. בחר מה מואר בה: שכבה למטה, סוג גוף,
      או "שקופית מגופים שאבחר בלחיצה". לאופציה נוספת לשקופית קיימת — שכפל אותה (⧉).</div>`;
    html += `<div class="hint" style="margin:14px 0 6px">
      הארה בשקופית הנוכחית — <b style="color:var(--glow-y)">${cnt(litIndices(a,sl).size, 'גופים')}</b></div>`;
    html += Object.entries(byLayer).sort((p,q)=>q[1].n-p[1].n).map(([lay,v])=>{
      const on = (sl.layers||[]).indexOf(lay) >= 0;
      return `<div class="lit-layer">
        <label class="lit-head">
          <input type="checkbox" data-ll="${lay}" ${on?'checked':''}>
          <span class="lay">${lay}</span>
          <span class="n">${cnt(v.n, 'גופים')}</span>
          <span class="caret">${cnt(Object.keys(v.codes).length, 'סוגים')}</span>
        </label></div>`;
    }).join('');

    // צמצום לסוג גוף — רק על השכבות שנבחרו, ומאוחד. אותו קוד יכול
    // לשבת על שתי שכבות (TA על light kir וגם light floor), ולכן
    // הצגה לפי שכבה הייתה מייצרת תיבות כפולות שיוצאות מסנכרון.
    const chosen = new Set((sl.layers||[]).map(x=>x.toLowerCase()));
    const codeCount = {};
    if(chosen.size){
      ovFixturesIn(a).forEach(f=>{
        if(chosen.has(f.layer.toLowerCase()))
          codeCount[f.code] = (codeCount[f.code]||0)+1;
      });
    }
    const codeRows = Object.entries(codeCount).sort((p,q)=>q[1]-p[1]).map(([c,n])=>`
      <label class="brow">
        <input type="checkbox" data-bc="${c}" ${(sl.codes||[]).indexOf(c)>=0?'checked':''}>
        <span class="code">${codeLabel(c)}</span><span class="n">${n}</span>
      </label>`).join('');
    if(codeRows) html += `<div class="lit-layer" style="margin-top:8px">
        <div class="lit-head" style="cursor:default">
          <span class="lay" style="direction:rtl">צמצום לסוג גוף</span>
          <span class="n">${cnt(Object.keys(codeCount).length, 'סוגים')}</span>
        </div>
        <div class="lit-blocks" style="display:block; padding-inline-start:14px">
          <div class="hint" style="padding:2px 0 4px">ריק = כל הסוגים בשכבות שנבחרו</div>
          ${codeRows}
        </div></div>`;

    if(a.parent) html += `<div class="hint" style="margin-top:9px">
      אתה בתוך תת-אזור של "${a.parent}". השקופיות כאן חתוכות לצורה
      שגזרת.</div>`;
    if(!sl.photosOnly && !sl.mask) html += `<button class="ghost" data-lightpoly
        style="width:100%; margin-top:9px" title="משרטטים צורה חופשית סביב חלק מהתוכנית, ובוחרים: להדליק הכל, להדליק רק סוג אחד, או לכבות">
        ${S.lightDraw ? '✓ סגור את הפוליגון' : '⬠ הדלק או כבה לפי פוליגון'}</button>`;
    if(sl.picks && sl.picks.length) html += `<div class="hint" style="margin-top:7px">
      נבחרו ידנית ${cnt(sl.picks.length, 'גופים')} — גובר על השכבות.
      <a href="#" data-repick style="color:var(--accent)">המשך בחירה</a> ·
      <a href="#" data-clearpicks style="color:var(--accent)">בטל בחירה ידנית</a></div>`;
    html += photoPanel(a, sl);
  }
  html += `</div>`;
  html += layersPanel();

  box.innerHTML = html;
  wireWork(a); wireLayers();
  if(sl) loadPhotos(a, sl);
  updateSummary(); render();
  $('#modehint').className = (S.picking || S.subDraw || S.lightDraw) ? 'pick' : '';
  $('#modehint').textContent = S.lightDraw
    ? ('סמן נקודות סביב החלק שרוצים להדליק או לכבות — בכל זווית. ' +
       (S.lightDraw.pts.length >= 3
         ? 'לחיצה על הנקודה הראשונה או לחיצה כפולה סוגרות. '
         : 'צריך שלוש נקודות לפחות. ') + 'Escape מבטל.')
    : S.subDraw
    ? ('סמן פינות על התוכנית — כל צלע יוצאת ישרה מעצמה. ' +
       (S.subDraw.pts.length >= 3
         ? 'לחיצה על הנקודה הראשונה או לחיצה כפולה סוגרות. '
         : 'צריך שלוש פינות לפחות. ') + 'Escape מבטל.')
    : S.picking
    ? 'לחץ על נקודה בתוכנית כדי להדליק או לכבות גוף בודד. נקודות עמומות שייכות לאזור אחר.'
    : '';
}

function layersPanel(){
  if(!S.layers.length) return '';
  const on = S.layers.filter(l=>l.on).length;
  // הפאנל נבנה מחדש בכל רענון. בלי לזכור שהוא פתוח, כל שינוי
  // עובי היה סוגר אותו מתחת לידיים.
  return `<details class="box" data-lbox ${S.layersOpen ? 'open' : ''}>
    <summary>שכבות השרטוט <span class="n">${on} מתוך ${S.layers.length}</span></summary>
    <div class="scroll-list" data-lscroll>${S.layers.map((l,i)=>`
      <div class="lwrap">
        <label class="lrow ${l.role==='lighting'?'lit':''}">
          <input type="checkbox" data-lyr="${i}" ${l.on?'checked':''}>
          <span class="lname" title="${l.name}">${l.name}</span>
          <span class="ln">${l.n.toLocaleString()}</span>
        </label>${styleable(l) ? `<span class="lsum">${styleSummary(l.name)}</span>
        <button class="ledit ${S.styleOpen===l.name?'on':''}" data-ledit="${i}"
                title="עובי ובהירות">✎ עריכה</button>` : ''}
      </div>${styleable(l) && S.styleOpen === l.name ? layerStyleRow(l, i) : ''}`).join('')}</div>
    <div style="padding:7px 11px; display:flex; gap:6px; flex-wrap:wrap">
      ${Object.keys(S.layerStyles || {}).length ? `<button class="ghost" data-lstyreset
        style="font-size:12.5px; padding:4px 8px" title="מחזיר את העובי והבהירות של כל השכבות">
        ↺ אפס עובי ובהירות (${Object.keys(S.layerStyles).length})</button>` : ''}
      <button class="ghost" data-lreset style="font-size:12.5px; padding:4px 8px">ברירת מחדל</button>
      <button class="ghost" data-lall style="font-size:12.5px; padding:4px 8px">הכל</button>
      <button class="ghost" data-lnone style="font-size:12.5px; padding:4px 8px">כלום</button>
    </div></details>`;
}
/* ─── עובי ובהירות לשכבה (D-031) ───────────────────────────────
   גיא: "לדקק ולעבות שכבות... להבהיר ולהכהות — כדי לייצר ניגודיות
   בין קירות לרהיטים". חל על הפרויקט כולו ולא על שקופית, ולא על
   שכבות התאורה — מה שנראה בהן הוא הזוהר. הדרגות והטווח נקבעים
   ב-knowledge/layout.yaml; השרת מנקה כל ערך אחר. */
const WIDTHS = [['thin','דק'],['normal','רגיל'],['thick','עבה'],['xthick','עבה מאוד']];
function styleOf(name){ return (S.layerStyles || {})[name] || {w:'normal', b:0}; }
function stylesPayload(){
  const on = new Set(S.layers.filter(l=>l.on && l.role!=='lighting').map(l=>l.name));
  const out = {};
  Object.entries(S.layerStyles || {}).forEach(([k,v]) => {
    if(on.has(k) && (v.w !== 'normal' || v.b)) out[k] = v;
  });
  return out;
}
/* העריכה מוסתרת מאחורי ✎ (גיא, 12.10: שורת עריכה מתחת לכל שכבה
   הציפה את הרשימה). מה ששונה נראה גם בלי לפתוח — בתקציר ליד השם. */
function styleable(l){ return l.on && l.role !== 'lighting'; }
function pct(b){ const v = Math.round(b * 100); return (v > 0 ? '+' : '') + v + '%'; }
function styleSummary(name){
  const st = styleOf(name), parts = [];
  if(st.w !== 'normal') parts.push(WIDTHS.find(w => w[0] === st.w)[1]);
  if(st.b) parts.push('‎' + pct(st.b));
  return parts.join(' · ');
}
function layerStyleRow(l, i){
  const st = styleOf(l.name);
  const changed = st.w !== 'normal' || st.b;
  return `<div class="lsty ${changed?'changed':''}">
    <span>עובי</span>
    <span class="seg">${WIDTHS.map(([k,he]) =>
      `<button class="${st.w===k?'on':''}" data-lw="${i}" data-v="${k}">${he}</button>`).join('')}</span>
    <span style="flex-basis:100%; height:0"></span>
    <span>בהירות</span><span>בהיר</span>
    <input type="range" min="-60" max="100" step="5" value="${Math.round(Math.max(st.b, -.6)*100)}"
           data-lb="${i}" title="שמאל מכהה, ימין מבהיר">
    <span>כהה</span>
    <span class="bv" data-bv="${i}">${pct(st.b)}</span>
    ${changed ? `<button class="ghost rst" data-lr="${i}" title="חזרה לברירת המחדל">↺</button>` : ''}
  </div>`;
}
async function setLayerStyle(i, patch){
  if(!await confirmGlobal('שינוי עובי או בהירות')){ renderSide(); return; }
  const name = S.layers[i].name;
  S.layerStyles = S.layerStyles || {};
  const st = Object.assign({}, styleOf(name), patch);
  if(st.w === 'normal' && !st.b) delete S.layerStyles[name];
  else S.layerStyles[name] = st;
  renderSide(); refreshPlan();
}

     ומשנה אותה בלי לשאול. מי שכן רוצה לתקן בחירה קיימת מקבל

  const lp = box.querySelector('[data-lightpoly]');
  if(lp) lp.onclick = () => {

  const wp = box.querySelector('[data-wantphoto]');
  if(wp) wp.onclick = () => { sl.wantPhoto = true; save(); renderSide(); };
  const cp = box.querySelector('[data-clearpicks]');

/* ═══ שמירה (D-036) ═══
   מצגת היא עבודה של שעות. בדיקת השמישות (13.10) מצאה ארבע דרכים
   לאבד אותה, וכאן מטופלות שלוש מהן:

   • **כל שינוי נכתב מיד גם לדפדפן** (localStorage), לפני השליחה.
     שינוי שלא הגיע לשרת — שרת למטה, לשונית שנסגרה אחרי רבע שנייה —
     מחכה שם, ומוצע לשחזור בפתיחה הבאה.
   • **כישלון שמירה נראה.** "⚠ לא נשמר" בכותרת ופס התראה, וניסיון
     חוזר כל 5 שניות. קודם `.catch(()=>{})` בלע הכל.
   • **שינוי מחלון אחר עוצר את השמירה מכאן** (409 מהשרת), במקום
     למחוק אותו בשקט.

   הרביעית — קובץ פגום — מטופלת בטעינה (`blockSaving('corrupt')`). */
const SAVE = {timer: null, retry: null, seq: 0, inflight: false, blocked: '', dirty: false};
function pendingKey(name){ return 'lighting-pending:' + (name || S.name); }
function projectBody(){
  syncParents();
  // כל אזור נשמר עם נעילה. בלי זה אזור חדש שנשמר לפני שנפתחה בו
  // שקופית היה נטען בפעם הבאה כ"פרויקט קיים", ושקופיות בלי תצלום
  // היו משתחררות מהנעילה (נתפס בסקירה, 19.10).
  ensureLocks();
  return {drawing: S.name, areas: S.areas,
          layers: S.layers.filter(l=>l.on).map(l=>l.name),
          layer_styles: S.layerStyles || {},
          deck: S.deck || deckDefaults()};
}
function writePending(){
  try{
    localStorage.setItem(pendingKey(), JSON.stringify(
      {state: projectBody(), base_rev: S.rev, at: Date.now(), seq: SAVE.seq}));
  }catch(e){}
}
function clearPending(seq){
  try{
    const p = JSON.parse(localStorage.getItem(pendingKey()) || 'null');
    if(p && p.seq <= seq) localStorage.removeItem(pendingKey());
  }catch(e){}
}
function save(){
  if(!S.name) return;
  SAVE.seq++; SAVE.dirty = true;
  // **פרויקט שלא נקרא אינו נשמר גם לדפדפן.** מה שעל המסך אז הוא לא
  // הפרויקט אלא ההצעות הריקות; עותק שלו הוצע אחר כך "לשחזור" ודרס
  // את הגרסה ששוחזרה (נתפס בבדיקה, 13.10).
  if(SAVE.blocked === 'corrupt' || SAVE.blocked === 'unreadable'){
    showSaveState('bad'); return;
  }
  writePending();
  // חסום (פגום / חלון אחר) — נשמר בדפדפן בלבד. במצב "שרת למטה" הניסיון
  // החוזר כבר מתוזמן ויישא איתו גם את השינוי הזה.
  if(SAVE.blocked){ if(SAVE.blocked !== 'offline') showSaveState('bad'); return; }
  showSaveState('busy');
  clearTimeout(SAVE.timer);
  SAVE.timer = setTimeout(() => flushSave(), 500);
}
async function flushSave(force){
  if(!S.name || SAVE.inflight) return;
  if(SAVE.blocked && SAVE.blocked !== 'offline' && !force) return;
  clearTimeout(SAVE.timer); clearTimeout(SAVE.retry);
  const seq = SAVE.seq;
  const body = Object.assign(projectBody(), {base_rev: S.rev});
  if(force === 'overwrite') body.force = true;
  SAVE.inflight = true;
  try{
    const r = await fetch('/api/project', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if(r.status === 409){
      SAVE.inflight = false;
      blockSaving(d.conflict ? 'conflict' : 'corrupt', [], d.saved_at);
      return;
    }
    if(!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    S.rev = d.rev; SAVE.inflight = false;
    if(SAVE.blocked === 'offline'){ SAVE.blocked = ''; hideSaveBar(); }
    clearPending(seq);
    if(SAVE.seq === seq){ SAVE.dirty = false; showSaveState('ok', d.saved_at); }
    else flushSave();                  // שינויים נוספים הגיעו בינתיים
  }catch(e){
    SAVE.inflight = false;
    SAVE.blocked = 'offline';
    showSaveState('bad');
    showSaveBar(`<b>⚠ השינויים לא נשמרו בשרת</b> — השרת לא עונה. העבודה
      נשמרת בינתיים בדפדפן הזה, ותישלח מעצמה כשהשרת יחזור.
      <b>אל תעבור למחשב אחר</b> עד שיופיע "נשמר ✓".`);
    SAVE.retry = setTimeout(() => flushSave(), 5000);
  }
}
function showSaveState(kind, at){
  const el = $('#savestate'); if(!el) return;
  el.className = kind || '';
  const t = at ? String(at).slice(11, 16) : new Date().toTimeString().slice(0, 5);
  el.textContent = kind === 'ok' ? `נשמר ✓ ${t}` : kind === 'busy' ? 'שומר…' :
                   kind === 'bad' ? '⚠ לא נשמר' : '';
}
function showSaveBar(html){ const b = $('#savebar'); b.innerHTML = html;
  b.style.top = document.querySelector('header').offsetHeight + 'px';   // B-09
  b.style.display = 'flex'; }
function hideSaveBar(){ const b = $('#savebar'); if(b){ b.style.display = 'none'; b.innerHTML = ''; } }

/* מצב שבו שמירה רגילה הייתה הורסת משהו — ולכן היא נעצרת. */
function blockSaving(kind, versions, at){
  SAVE.blocked = kind;
  clearTimeout(SAVE.timer); clearTimeout(SAVE.retry);
  showSaveState('bad');
  if(kind === 'corrupt'){
    const v = (versions || []).slice(0, 6);
    showSaveBar(`<b>⚠ קובץ הפרויקט בדיסק פגום ולא נקרא.</b> כדי לא לדרוס אותו,
      השמירה מושבתת. ${v.length ? 'שחזר גרסה שמורה:' :
      'אין גרסאות שמורות — אל תמשיך לעבוד על הפרויקט, ופנה למי שמתחזק את הכלי.'}
      ${v.map(x => `<button class="ghost" data-restore="${x.id}">
        ${x.saved_at || x.id} · ${cnt(x.slides, 'שקופיות')}</button>`).join('')}`);
    document.querySelectorAll('[data-restore]').forEach(b => b.onclick = async () => {
      if(!await askYes('שחזור גרסה', ['לשחזר את הגרסה מ-' + b.textContent.trim() + '?',
         'הקובץ הפגום נשמר בצד ולא נמחק.'], 'שחזר', 'ביטול')) return;
      const r = await fetch('/api/project/restore', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({drawing: S.name, version: b.dataset.restore})});
      if(r.ok){ hideSaveBar(); $('#load').click(); }
      else setStatus('השחזור נכשל — נסה גרסה אחרת או פנה למי שמתחזק את הכלי', '#ff6b6b');
    });
  }else if(kind === 'conflict'){
    showSaveBar(`<b>⚠ הפרויקט נשמר בינתיים ממקום אחר</b>${at ? ' (' + String(at).slice(11,16) + ')' : ''}
      — חלון או עובד נוסף. כדי לא למחוק את מה שנשמר שם, השמירה מכאן נעצרה.
      השינויים שעשית כאן שמורים בדפדפן.
      <button class="ghost" data-cf="load">טען את הגרסה העדכנית</button>
      <button class="ghost" data-cf="mine">שמור בכל זאת את מה שכאן</button>`);
    document.querySelector('[data-cf="load"]').onclick = async () => {
      if(await askYes('טעינת הגרסה העדכנית', ['לטעון את הגרסה שנשמרה ממקום אחר?',
         'השינויים מהחלון הזה יוצעו לשחזור מיד אחר כך.'], 'טען', 'ביטול'))
        $('#load').click();
    };
    document.querySelector('[data-cf="mine"]').onclick = async () => {
      if(!await askYes('דריסת הגרסה האחרת', ['לדרוס את הגרסה שנשמרה ממקום אחר בגרסה שכאן?',
         'הגרסה האחרת תישמר בגרסאות הקודמות.'], 'דרוס', 'ביטול', true)) return;
      SAVE.blocked = ''; hideSaveBar(); flushSave('overwrite');
    };
  }else if(kind === 'unreadable'){
    showSaveBar(`<b>⚠ לא ניתן היה לקרוא את הפרויקט מהשרת.</b> כדי לא לדרוס עבודה
      קיימת, השמירה מושבתת. נסה לטעון מחדש בעוד רגע.`);
  }
}

/* מי חדש יותר: העותק בדפדפן או מה שבשרת (B-07). לעותק נשמר מספר הגרסה של
   השרת שממנו התחיל (`base_rev`). אם השרת התקדם מאז — הוא החדש, וזו ברירת
   המחדל. אם לא — העבודה היחידה החדשה היא בדפדפן. */
function pendingPlan(p, server, serverRev){
  const count = st => (st && st.areas || []).reduce((k, a) => k + (a.slides||[]).length, 0);
  const newer = p.base_rev !== serverRev;
  return {n: count(p.state), m: count(server), newer: newer,
          primary: newer ? 'server' : 'browser'};
}

/* שינויים שנשארו בדפדפן מפעם קודמת — שרת שנפל, לשונית שנסגרה. */
async function offerPending(name, server){
  let p = null;
  try{ p = JSON.parse(localStorage.getItem(pendingKey(name)) || 'null'); }catch(e){}
  if(!p || !p.state || !p.state.areas) return;
  // זהה למה שבשרת (למשל השליחה בסגירת הלשונית הצליחה) — אין מה לשאול
  const same = server && JSON.stringify(p.state.areas) === JSON.stringify(server.areas || []) &&
    JSON.stringify(p.state.layers || []) === JSON.stringify(server.layers || []) &&
    JSON.stringify(p.state.layer_styles || {}) === JSON.stringify(server.layer_styles || {}) &&
    JSON.stringify(p.state.deck || {}) === JSON.stringify(server.deck || {});
  if(same){ try{ localStorage.removeItem(pendingKey(name)); }catch(e){} return; }
  const plan = pendingPlan(p, server, S.rev);
  const fmt = ms => new Date(ms).toLocaleString('he-IL');
  const serverWhen = server && server.saved_at ? server.saved_at : '';
  const lines = [
    `בדפדפן: ${cnt(plan.n, 'שקופיות')} (${fmt(p.at)})`,
    `בשרת: ${cnt(plan.m, 'שקופיות')}${serverWhen ? ' (' + serverWhen + ')' : ''}`,
    plan.newer
      ? 'הפרויקט נשמר בשרת אחרי שהשינויים האלה התחילו — כנראה מחלון אחר. לכן הגרסה של השרת חדשה יותר.'
      : 'השרת לא התקדם מאז שהשינויים האלה התחילו, ולכן העותק שבדפדפן הוא העדכני.'];
  if(plan.n < plan.m) lines.push(`⚠ בדפדפן פחות שקופיות מבשרת. שחזור מהדפדפן יחליף ${plan.m} ב-${plan.n}.`);
  const serverBtn = {label: plan.newer ? 'טען מהשרת (מומלץ)' : 'השאר את מה שבשרת',
                     value: 'server', primary: plan.primary === 'server'};
  const browserBtn = {label: plan.newer ? 'שחזר מהדפדפן — יחליף את מה שבשרת' : 'שחזר מהדפדפן (מומלץ)',
                      value: 'browser', primary: plan.primary === 'browser'};
  const choice = await askChoice('נמצאו שינויים שלא הגיעו לשרת', lines,
    plan.primary === 'server' ? [serverBtn, browserBtn] : [browserBtn, serverBtn]);
  // Esc או לחיצה בחוץ = לא להחליט. העותק נשאר, ויוצע שוב בפתיחה הבאה.
  if(choice === null) return;
  if(choice === 'server'){ try{ localStorage.removeItem(pendingKey(name)); }catch(e){} return; }
  const newer = plan.newer;
  S.areas = p.state.areas;
  migrateAreas(); syncParents();
  S.layers.forEach(l => l.on = (p.state.layers || []).includes(l.name));
  S.layerStyles = p.state.layer_styles || {};
  S.deck = Object.assign(deckDefaults(), p.state.deck || {});
  const ids = S.areas.flatMap(a=>(a.slides||[]).map(s=>s.id||0));
  S.seq = ids.length ? Math.max.apply(null, ids) : 0;
  renderSide();
  SAVE.seq++;
  await flushSave(newer ? 'overwrite' : true);
}

/* סגירת לשונית: שולחים מה שעוד ממתין, בבקשה ששורדת את סגירת הדף.
   גם אם זה נכשל — העותק בדפדפן כבר כתוב, ויוצע בפתיחה הבאה.
   **מעבר ללשונית אחרת אינו סגירה** — שם שומרים כרגיל, כי בקשה
   ששורדת בלי שהדף מקבל את מספר הגרסה החדש הייתה גורמת לחלון
   להתנגש בעצמו בשמירה הבאה. */
function flushOnLeave(){
  if(!S.name || !SAVE.dirty || SAVE.blocked || SAVE.inflight) return;
  const body = JSON.stringify(Object.assign(projectBody(), {base_rev: S.rev}));
  if(body.length < 60000){
    try{ fetch('/api/project', {method:'POST', keepalive:true,
           headers:{'Content-Type':'application/json'}, body}); }catch(e){}
  }
}
addEventListener('pagehide', flushOnLeave);
// B-22: סגירת לשונית עם שינויים שעוד לא הגיעו לשרת — הדפדפן שואל לפני.
// ההודעה עצמה היא של הדפדפן (אי אפשר לשנות אותה); העותק המקומי נשמר בכל מקרה.
addEventListener('beforeunload', e => {
  if(S.name && (SAVE.dirty || SAVE.inflight)){ e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden' && SAVE.dirty && !SAVE.blocked) flushSave();
});

/* ═══ הפקה ═══ */
/* מה שנשלח להפקה — וגם לבדיקה של שלב 3 (`/api/deck_check`). פונקציה
   אחת, כדי שהבדיקה לא תוכל לראות מצגת אחרת ממה שיופק. */
function buildPayload(){
  return {
    drawing: S.name,
    layers: S.layers.filter(l=>l.on).map(l=>l.name),
    layer_styles: stylesPayload(),
    title_rule: deckRule(),
    deck_style: deckStyle(),
    areas: S.areas.map(a => ({
      name:a.name, x0:a.x0, y0:a.y0, x1:a.x1, y1:a.y1,
      // תת-אזור: הפוליגון מצמצם, ותיבת האב משמשת את שקופית הפתיחה
      poly: a.poly || [], parent: a.parent || '',
      parent_box: a.parent ? [a.x0, a.y0, a.x1, a.y1] : [],
      plan_lock: lockPayload(a),
      slides: (a.slides||[]).map(s => ({
        title: s.title||'', layers_lit: s.layers||[],
        codes: s.codes||[], picks: s.picks||[],
        photos: s.photos||[],
        // הפריסה שהעובד סידר בתצוגה. בלעדיה המצגת הייתה יוצאת
        // בפריסה האוטומטית, וכל הסידור היה נעלם בייצוא.
        geom: s.geom || {},
        plan_free: !!s.planFree,
        glow: s.glow || {},
        // שקופית פתיחה של תת-אזור. בלעדיה המסכה הייתה נראית
        // בתצוגה ונעלמת במצגת.
        mask: !!s.mask,
        photos_only: !!s.photosOnly,
        // לזיכרון המאגר: לאיזו קטגוריה התצלומים האלה נבחרו (D-038)
        photo_category: dominantCategory(a, s).cat || '',
        photo_tags: s.photoTags || [],
        // מאושרת בלי תצלום = בחירה, ולא תופיע ב"בלי תצלום"
        done: isDone(s),
        wide: (s.wide === undefined || s.wide === null) ? -1 : (s.wide ? 1 : 0),
        type: (s.layers||[])[0] || ''}))
    }))
  };
}

$('#build').onclick = async () => {
  $('#build').disabled = true;
  $('#result').innerHTML = '<span class="hint">מפיק…</span>';
  try{
    const r = await fetch('/api/build', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(buildPayload())});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || 'הפקה נכשלה');
    let h = `<a class="dl" href="/api/download?file=${encodeURIComponent(d.file)}">⬇ ${d.file} · ${cnt(d.slides, 'שקופיות')}</a>`;
    const iss = d.issues || [];
    if(iss.length){
      h += `<div class="warn" style="margin-top:7px">${cnt(iss.length, 'שקופיות דורשות', 'שקופית אחת דורשת')} תשומת לב — לחץ כדי לפתוח:` +
           iss.map((x, k) => `<div class="issue" data-issue="${k}"></div>`).join('') + '</div>';
    }
    $('#result').innerHTML = h;
    // טקסט ולא HTML — הכותרות הוקלדו בידי עובדים
    $('#result').querySelectorAll('[data-issue]').forEach(el => {
      const x = iss[+el.dataset.issue];
      el.textContent = x.text;
      el.onclick = () => jumpToSlide(x.area, x.slide);
    });
  }catch(e){ $('#result').innerHTML = `<div class="warn">שגיאה: ${errText(e)}</div>`; }
  $('#build').disabled = false;
};

$('#side').addEventListener('scroll', () => {
  if(!SIDE.pending && SIDE.key === sideKey()) SIDE.top = $('#side').scrollTop;
});
// גלילה של אדם גוברת על החזרה שממתינה
$('#side').addEventListener('wheel', () => { SIDE.pending = false; }, {passive: true});
// B-12: אחרי רענון חוזרים לשרטוט האחרון ולמקום שבו היינו, ומצגות שכבר
// הופקו נשארות זמינות גם אם הקישור נעלם מהמסך.
async function showRecentDecks(){
  const box = $('#result');
  if(!box || box.innerHTML.trim()) return;      // לא דורסים הפקה או שגיאה
  try{
    const d = await fetch('/api/recent_decks').then(r => r.json());
    if(!d.decks.length || box.innerHTML.trim()) return;
    box.innerHTML = '<div class="hint">מצגות אחרונות:</div>' + d.decks.map(x =>
      `<a class="dl" style="display:block;margin-top:4px" href="/api/download?file=${encodeURIComponent(x.file)}"></a>`).join('');
    box.querySelectorAll('a.dl').forEach((el, i) => {
      const x = d.decks[i], t = new Date(x.mtime * 1000);
      el.textContent = '⬇ ' + x.file + ' · ' + t.toLocaleString('he-IL',
        {day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
    });
  }catch(e){}
}
listDrawings().then(() => {
  let last = null;
  try{ last = localStorage.getItem('lighting-last'); }catch(e){}
  const opt = last && [...$('#file').options].find(o => o.value === last);
  if(opt){ $('#file').value = last; $('#load').click(); }
}).catch(()=>{});
showRecentDecks(); renderSide(); markSteps();
</script>
